[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelexpress"
version = "0.5.1"
description = "Python client for ModelExpress P2P GPU transfer service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "NVIDIA Corporation", email = "sw-dl-dynamo@nvidia.com" }]
keywords = ["llm", "gpu", "transfer", "rdma", "nixl", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "grpcio>=1.66.2",
    "google-crc32c>=1.5.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.24.0",
    "protobuf>=5.27.2,<7.0.0",
    "pydantic>=2.0.0",
    "torch>=2.6.0",
    "runai-model-streamer[s3,gcs,azure]; sys_platform == 'linux'",
    "instanttensor>=0.1.9 ; sys_platform == 'linux'",
    # First release with IfNoneMatch on CompleteMultipartUpload.
    "boto3>=1.35.2",
    "zstandard>=0.22.0",
    "safetensors>=0.8.0",
    "s3transfer>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    # tests/test_metrics.py builds the real collectors and forks real ranks, so
    # the test extra needs what the metrics extra installs. CI installs only
    # [dev]; without this the metrics tests would error out on import rather
    # than run.
    "prometheus-client>=0.20.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
codegen = [
    # Keep generated Python stubs compatible with both protobuf 5 and 6.
    "grpcio-tools==1.66.2",
]
otel = [
    "opentelemetry-api>=1.20.0",
]
# Opt-in Prometheus metrics collector (MX_METRICS_ENABLED=1).
# Lazily imported; not required for normal operation.
metrics = [
    "prometheus-client>=0.20.0",
]
# Required for the VmmArena allocator (CudaVmmBackend uses cuMem* APIs).
# The pure-Python VmmArena tests don't need it; CudaVmmBackend does.
vmm = [
    # 12.4 is the first release exposing CU_MEM_HANDLE_TYPE_FABRIC.
    "cuda-python>=12.4",
]

[project.urls]
Homepage = "https://github.com/ai-dynamo/modelexpress"
Repository = "https://github.com/ai-dynamo/modelexpress.git"
Documentation = "https://github.com/ai-dynamo/modelexpress/tree/main/docs"

[project.entry-points."vllm.general_plugins"]
modelexpress = "modelexpress:register_modelexpress"

[tool.pytest.ini_options]
markers = [
    "gpu: requires one or more CUDA GPUs",
    "slow: long-running test (real model load + transfer)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modelexpress*"]

[tool.setuptools.package-data]
modelexpress = ["py.typed"]
