[package]
name = "modelexpress-client"
description = "Client library for Model Express gRPC server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true

[features]
default = ["gcs", "tls-rustls"]
openssl = ["tls-native"]
gcs = ["modelexpress-common/gcs"]
tls-native = [
    "modelexpress-common/tls-native",
    "dep:openssl",
    "dep:tokio-openssl",
    "dep:hyper-util",
    "dep:tower",
    "dep:http",
]
tls-rustls = [
    "modelexpress-common/tls-rustls",
    "dep:rustls",
    "rustls/ring",
    "rustls/std",
    "rustls/tls12",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
    "dep:hyper-util",
    "dep:tower",
    "dep:http",
]

[dependencies]
modelexpress-common = { workspace = true, default-features = false }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
tower = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
modelexpress-common = { workspace = true, default-features = false, features = ["test-support"] }
tempfile = "3.20"

[lints]
workspace = true

[[bin]]
name = "modelexpress-cli"
path = "src/bin/cli.rs"
