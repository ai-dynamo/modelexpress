syntax = "proto3";

package model_express.refit;

// Control-plane metadata for RL weight publication. Object-storage-backed
// versions own one global object URI; worker-sharded versions advertise
// per-worker manifests.
service RefitService {
  // External APIs: called by the RL framework orchestrator.
  rpc CreateWeightVersion(CreateWeightVersionRequest) returns (CreateWeightVersionResponse);
  rpc GetWeightVersion(GetWeightVersionRequest) returns (GetWeightVersionResponse);
  // Cancel a STAGING version or retire a READY version.
  rpc DeleteWeightVersion(DeleteWeightVersionRequest) returns (DeleteWeightVersionResponse);
  rpc UpdateWeightVersionState(UpdateWeightVersionStateRequest) returns (UpdateWeightVersionStateResponse);

  // Internal APIs: called by ModelExpress worker clients, not by the RL
  // framework orchestrator.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc CreateWeightVersionShard(CreateWeightVersionShardRequest) returns (CreateWeightVersionShardResponse);
  rpc ListWeightVersionShards(ListWeightVersionShardsRequest) returns (ListWeightVersionShardsResponse);
  rpc DeleteWeightVersionShard(DeleteWeightVersionShardRequest) returns (DeleteWeightVersionShardResponse);
  // A live lease protects the version source while a generator installs it.
  // Re-registering the same lease owner renews its expiry.
  rpc RegisterVersionLease(RegisterVersionLeaseRequest) returns (RegisterVersionLeaseResponse);
  rpc DeleteVersionLease(DeleteVersionLeaseRequest) returns (DeleteVersionLeaseResponse);
}

// Internal worker-to-worker API. The generator fetches the small transfer
// manifest here; tensor bytes remain on the advertised data-plane transport.
service RefitWorkerService {
  rpc GetWeightVersionShardManifest(GetWeightVersionShardManifestRequest) returns (GetWeightVersionShardManifestResponse);
}

enum WorkerRole {
  WORKER_ROLE_UNSPECIFIED = 0;
  WORKER_ROLE_TRAINER = 1;
  WORKER_ROLE_GENERATOR = 2;
}

enum WeightPayloadFormat {
  WEIGHT_PAYLOAD_FORMAT_UNSPECIFIED = 0;
  WEIGHT_PAYLOAD_FORMAT_FULL_TENSOR = 1;
  WEIGHT_PAYLOAD_FORMAT_XOR_DELTA = 2;
  WEIGHT_PAYLOAD_FORMAT_FULL_HF_CHECKPOINT = 3;
}

enum WeightVersionState {
  WEIGHT_VERSION_STATE_UNSPECIFIED = 0;
  WEIGHT_VERSION_STATE_STAGING = 1;
  WEIGHT_VERSION_STATE_READY = 2;
  WEIGHT_VERSION_STATE_RELEASING = 3;
}

enum ObjectStorageType {
  OBJECT_STORAGE_TYPE_UNSPECIFIED = 0;
  OBJECT_STORAGE_TYPE_S3 = 1;
  OBJECT_STORAGE_TYPE_AZURE = 2;
  OBJECT_STORAGE_TYPE_GCS = 3;
}

message WorkerRegistration {
  // Fresh identity for this concrete process lifetime. A restarted worker
  // receives a new worker_id rather than fencing a prior registration.
  string worker_id = 1;
  WorkerRole role = 2;
  string model_name = 3;
  uint64 expires_at_unix_ms = 4;
}

message RegisterWorkerRequest {
  WorkerRegistration worker = 1;
  uint32 ttl_seconds = 2;
}

message RegisterWorkerResponse {
  WorkerRegistration worker = 1;
}

message WeightVersion {
  // Opaque identity for this WeightVersion. MX generates it when the caller
  // omits CreateWeightVersionRequest.uid.
  string uid = 1;
  string model_name = 2;
  string idempotency_key = 3;
  WeightPayloadFormat payload_format = 4;
  // Present only for XOR_DELTA; identifies the base WeightVersion to which the
  // delta is applied. Full payloads omit it.
  optional string base_version_id = 5;
  // Required only for worker-sharded publication. Physical source workers are
  // not baked in; the trainer coordinator supplies opaque IDs such as a
  // selected publisher global rank. Object-storage-backed versions leave this
  // empty.
  repeated string expected_source_slots = 6;
  // Reserved placeholder for a future server-assigned layout fingerprint.
  // Content identity currently travels in the payload.
  string layout_signature = 7;
  WeightVersionState state = 8;
  uint64 created_at_unix_ms = 9;
  // Present only when the version payload is published through object storage.
  ObjectStorageSource object_storage = 10;
}

message CreateWeightVersionRequest {
  string model_name = 1;
  string idempotency_key = 2;
  WeightPayloadFormat payload_format = 3;
  // Required only for XOR_DELTA; omitted for full payloads.
  optional string base_version_id = 4;
  // Required for worker-sharded publication; empty for object storage.
  repeated string expected_source_slots = 5;
  // Set for an object-storage-backed version; omitted for worker-sharded
  // publication.
  ObjectStorageSource object_storage = 6;
  WeightVersionState state = 7;
  // Optional caller-selected identity; MX generates one when omitted.
  optional string uid = 8;
}

message CreateWeightVersionResponse {
  WeightVersion version = 1;
}

message GetWeightVersionRequest {
  string uid = 1;
}

message GetWeightVersionResponse {
  WeightVersion version = 1;
}

message DeleteWeightVersionRequest {
  string uid = 1;
}

message DeleteWeightVersionResponse {
  WeightVersion version = 1;
}

message UpdateWeightVersionStateRequest {
  string uid = 1;
  WeightVersionState state = 2;
}

message UpdateWeightVersionStateResponse {
  WeightVersion version = 1;
}

message WeightVersionShard {
  string version_id = 1;
  // Required version-scoped source contribution covered by this publication.
  string source_slot_id = 2;
  // Together with version_id and source_slot_id, identifies this publication.
  string worker_id = 3;
  uint64 tensor_count = 4;
  uint64 total_bytes = 5;
  string manifest_digest = 6;
  string manifest_endpoint = 7;
}

message ObjectStorageSource {
  string uri = 1;
  ObjectStorageType storage_type = 2;
}

message CreateWeightVersionShardRequest {
  WeightVersionShard shard = 1;
}

message CreateWeightVersionShardResponse {
  WeightVersionShard shard = 1;
  WeightVersion version = 2;
}

message ListWeightVersionShardsRequest {
  string version_id = 1;
}

message ListWeightVersionShardsResponse {
  repeated WeightVersionShard shards = 1;
}

message GetWeightVersionShardManifestRequest {
  string version_id = 1;
  string source_slot_id = 2;
}

message GetWeightVersionShardManifestResponse {
  bytes manifest = 1;
  string manifest_digest = 2;
}

message DeleteWeightVersionShardRequest {
  string version_id = 1;
  string source_slot_id = 2;
  string worker_id = 3;
}

message DeleteWeightVersionShardResponse {
  bool deleted = 1;
}

message VersionLease {
  // Server-generated 8-character lowercase hexadecimal ID.
  string lease_id = 1;
  string version_id = 2;
  string worker_id = 3;
  uint64 expires_at_unix_ms = 4;
}

message RegisterVersionLeaseRequest {
  string version_id = 1;
  string worker_id = 2;
  uint32 ttl_seconds = 3;
}

message RegisterVersionLeaseResponse {
  VersionLease lease = 1;
}

message DeleteVersionLeaseRequest {
  string version_id = 1;
  string lease_id = 2;
  string worker_id = 3;
}

message DeleteVersionLeaseResponse {
  bool deleted = 1;
}
