syntax = "proto3";

package model_express.refit_collective;

// Rendezvous and admission for the NCCL M2N collective refit path.
//
// This service is deliberately separate from `RefitService`: that one is the
// directory for the NIXL pull path, where a generator discovers shards and
// reads them one-sidedly. Here both sides enter one collective together, so MX
// brokers the NCCL bootstrap instead of a shard table, and owns admission,
// rank assignment, worker-generation fencing, and a readiness state the
// trainer can observe before it launches.
//
// Weight bytes never reach this service. Neither does the reshard plan: MX
// stores only its digest and the endpoint that serves it, as the pull path
// does for tensor manifests.
service RefitCollectiveService {
  // Orchestrator-facing. `idempotency_key` makes a retried create return the
  // same operation rather than opening a second one against the same group.
  rpc CreateCollectiveTransfer(CreateCollectiveTransferRequest) returns (CollectiveTransfer);
  rpc GetCollectiveTransfer(GetCollectiveTransferRequest) returns (CollectiveTransfer);
  rpc DeleteCollectiveTransfer(DeleteCollectiveTransferRequest) returns (CollectiveTransfer);

  // Worker-client-facing. Workers join a group; they never create or delete
  // one. Groups are reclaimed automatically once every participant's
  // `WorkerRegistration` has lapsed and no transfer still references them.
  rpc JoinCollectiveGroup(JoinCollectiveGroupRequest) returns (CollectiveGroupMembership);
  rpc GetCollectiveGroup(GetCollectiveGroupRequest) returns (CollectiveGroup);
  rpc PublishGroupBootstrap(PublishGroupBootstrapRequest) returns (CollectiveGroup);
  rpc ReportCollectiveTransfer(ReportCollectiveTransferRequest) returns (CollectiveTransfer);
}

// Worker-to-worker. The trainer that MX ranks first in the group serves the
// reshard plan; every other participant fetches it and verifies the digest MX
// advertised before issuing any wire operation.
service RefitCollectiveWorkerService {
  rpc GetReshardPlan(GetReshardPlanRequest) returns (GetReshardPlanResponse);
}

enum CollectiveRole {
  COLLECTIVE_ROLE_UNSPECIFIED = 0;
  COLLECTIVE_ROLE_TRAINER = 1;
  COLLECTIVE_ROLE_GENERATOR = 2;
}

enum LaneKind {
  LANE_KIND_UNSPECIFIED = 0;
  // One per disjoint source partition, spanning that partition's trainer ranks
  // plus every admitted generator rank. Carries `nccl.m2n.reshard`.
  LANE_KIND_RESHARD = 1;
  // Exactly one, spanning every admitted trainer and generator rank. Carries
  // the packed broadcast for parameters the reshard does not move.
  LANE_KIND_BROADCAST = 2;
}

enum CollectiveGroupState {
  COLLECTIVE_GROUP_STATE_UNSPECIFIED = 0;
  COLLECTIVE_GROUP_STATE_FORMING = 1;
  COLLECTIVE_GROUP_STATE_READY = 2;
  COLLECTIVE_GROUP_STATE_RELEASING = 3;
}

enum CollectiveTransferState {
  COLLECTIVE_TRANSFER_STATE_UNSPECIFIED = 0;
  COLLECTIVE_TRANSFER_STATE_PENDING = 1;
  COLLECTIVE_TRANSFER_STATE_RUNNING = 2;
  COLLECTIVE_TRANSFER_STATE_COMPLETE = 3;
  COLLECTIVE_TRANSFER_STATE_FAILED = 4;
  COLLECTIVE_TRANSFER_STATE_ABORTED = 5;
}

// One admitted worker process inside one lane.
message CollectiveParticipant {
  // Logical, version-scoped contribution identifier. Stable across restarts.
  string slot_id = 1;
  // Concrete process lifetime. A restarted worker presents a new worker_id,
  // which is what lets MX fence a stale generation out of a formed group.
  string worker_id = 2;
  CollectiveRole role = 3;
  // Ordinal within the role, supplied by the client. MX derives rank_in_lane
  // from it; it never interprets the caller's parallelism.
  uint32 index_in_role = 4;
  // MX-assigned. Trainers occupy the low ranks of a lane, generators follow.
  uint32 rank_in_lane = 5;
}

message CollectiveLane {
  uint32 lane_id = 1;
  LaneKind kind = 2;
  uint32 world_size = 3;
  // Opaque 128-byte ncclUniqueId, generated by the lane's rank 0.
  bytes nccl_unique_id = 4;
  // Epoch the identifier above was published for. A bootstrap left over from a
  // previous epoch describes a communicator with the wrong world size, so
  // readiness ignores any lane whose stamp is not the group's current epoch.
  uint64 bootstrap_epoch = 5;
  repeated CollectiveParticipant participants = 6;
}

// Where the reshard plan can be fetched, and what it must hash to.
message PlanSource {
  string worker_id = 1;
  string endpoint = 2;
  string digest = 3;
}

message CollectiveGroup {
  // Derived from the declared membership, so every participant of one
  // operation resolves the same group without a separate create call.
  string group_id = 1;
  string model_name = 2;
  // Bumps on any membership change, and on a plan-digest change. Clients cache
  // their NCCL communicator and their fetched plan under (group_id, epoch) and
  // drop both together when it moves.
  uint64 epoch = 3;
  CollectiveGroupState state = 4;
  repeated CollectiveLane lanes = 5;
  optional PlanSource plan_source = 6;
  // Agreed across every participant before the group may become READY.
  string plan_digest = 7;
  repeated string expected_trainer_slots = 8;
  repeated string expected_generator_slots = 9;
  uint64 created_at_unix_ms = 10;
}

// What a joining worker needs in order to build its communicators.
message CollectiveGroupMembership {
  string group_id = 1;
  uint64 epoch = 2;
  // The joining worker's assignment in each lane it participates in.
  repeated LaneAssignment assignments = 3;
  CollectiveGroupState state = 4;
  // True when this worker is rank 0 of a reshard lane and therefore owes that
  // lane its ncclUniqueId.
  bool is_bootstrap_leader = 5;
}

message LaneAssignment {
  uint32 lane_id = 1;
  LaneKind kind = 2;
  uint32 rank_in_lane = 3;
  uint32 world_size = 4;
}

// Declares the membership of a group. Every participant of one operation sends
// an identical declaration; MX hashes it into the group_id, so a disagreement
// surfaces as two groups that never reach READY rather than as one group with
// inconsistent geometry.
message CollectiveGroupSpec {
  string model_name = 1;
  repeated string expected_trainer_slots = 2;
  repeated string expected_generator_slots = 3;
  // Number of disjoint source partitions. One reshard lane is created per
  // partition, plus one broadcast lane.
  uint32 source_partition_count = 4;
}

message JoinCollectiveGroupRequest {
  CollectiveGroupSpec spec = 1;
  string slot_id = 2;
  string worker_id = 3;
  CollectiveRole role = 4;
  uint32 index_in_role = 5;
  // Which source partition this worker's parameters belong to. Trainers only;
  // generators join every reshard lane and must leave this unset.
  optional uint32 source_partition = 6;
  // The digest this worker computed for the reshard plan. Readiness requires
  // every participant to report the same one.
  string plan_digest = 7;
  // Set by the participant that serves the plan.
  optional PlanSource plan_source = 8;
}

message GetCollectiveGroupRequest {
  string group_id = 1;
}

message PublishGroupBootstrapRequest {
  string group_id = 1;
  // Rejected unless it matches the group's current epoch, so a late publish
  // cannot overwrite the identifier a newer membership is already using.
  uint64 epoch = 2;
  uint32 lane_id = 3;
  string worker_id = 4;
  bytes nccl_unique_id = 5;
}

message CollectiveTransfer {
  string operation_id = 1;
  string group_id = 2;
  // The group epoch this operation was admitted against. A report carrying a
  // different epoch belongs to a superseded membership and is rejected.
  uint64 epoch = 3;
  string version_id = 4;
  string model_name = 5;
  string idempotency_key = 6;
  CollectiveTransferState state = 7;
  uint64 created_at_unix_ms = 8;
  // Participants that have reported a terminal result for this operation.
  repeated string reported_worker_ids = 9;
  // Set when the operation ends in FAILED or ABORTED.
  string failure_message = 10;
}

message CreateCollectiveTransferRequest {
  CollectiveGroupSpec spec = 1;
  string version_id = 2;
  string idempotency_key = 3;
}

message GetCollectiveTransferRequest {
  string operation_id = 1;
}

message DeleteCollectiveTransferRequest {
  string operation_id = 1;
}

message ReportCollectiveTransferRequest {
  string operation_id = 1;
  string group_id = 2;
  uint64 epoch = 3;
  string worker_id = 4;
  bool succeeded = 5;
  string message = 6;
}

message GetReshardPlanRequest {
  string group_id = 1;
  uint64 epoch = 2;
}

message GetReshardPlanResponse {
  bytes plan = 1;
  string digest = 2;
}
