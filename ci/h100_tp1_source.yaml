apiVersion: v1
kind: Service
metadata:
  name: h100-tp1-source
spec:
  selector:
    app.kubernetes.io/name: h100-tp1-source
  ports:
  - {name: metadata, port: 8080, targetPort: metadata}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: h100-tp1-source
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: h100-tp1-source
      annotations:
        ecr-cache.dynamoci.io/skip-rewrite: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: ci-nightly-high-priority
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      imagePullSecrets:
      - {name: nvcr-imagepullsecret}
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      containers:
      - name: source
        image: WORKER_IMAGE
        imagePullPolicy: Always
        command: [python3, /opt/h100-smoke/h100_tp1_smoke.py, source]
        env:
        - {name: HOME, value: /tmp}
        - {name: MX_NIXL_BACKEND, value: UCX}
        - {name: NIXL_UCX_TLS, value: "tcp,cuda_copy"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        ports:
        - {name: metadata, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /metadata, port: metadata}
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 300
        resources:
          requests: {cpu: "1", memory: 4Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "2", memory: 16Gi, nvidia.com/gpu: "1"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [IPC_LOCK]
        volumeMounts:
        - {name: script, mountPath: /opt/h100-smoke, readOnly: true}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: script
        configMap: {name: h100-tp1-script}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 2Gi}
