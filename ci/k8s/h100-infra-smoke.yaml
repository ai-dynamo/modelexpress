# Infrastructure contract for the dedicated H100 vCluster. Render only
# SMOKE_ID and H100_STORAGE_CLASS; pod-side shell variables must remain intact.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: h100-smoke-shared
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ${H100_STORAGE_CLASS}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: h100-smoke-gpu-quota
spec:
  hard:
    requests.nvidia.com/gpu: "3"
    limits.nvidia.com/gpu: "3"
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer
  labels:
    app.kubernetes.io/name: mx-h100-infra-smoke
    ci.modelexpress.nvidia.com/role: trainer
spec:
  automountServiceAccountToken: false
  activeDeadlineSeconds: 600
  restartPolicy: Never
  nodeSelector:
    ai-dynamo.github.com/ci-pool: h100
    kubernetes.io/arch: amd64
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mx-h100-infra-smoke
  containers:
    - name: trainer
      image: nvcr.io/nvidia/cuda:13.0.0-base-ubuntu24.04
      command: [bash, -ceu, --]
      args:
        - |
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          mapfile -t gpu_records < <(
            nvidia-smi --query-gpu=name,uuid --format=csv,noheader
          )
          test "${#gpu_records[@]}" -eq 2
          if printf '%s\n' "${gpu_records[@]}" | grep -qv '^NVIDIA H100'; then
            exit 1
          fi

          run_dir=/shared/${SMOKE_ID}
          mkdir -p "$run_dir"
          printf '%s\n' "${gpu_records[@]}" > "$run_dir/.trainer-gpus"
          printf '%s\n' "$NODE_NAME" > "$run_dir/.trainer-node"
          printf '%s\n' "${SMOKE_ID}" > "$run_dir/.trainer-ready"
          sync
          mv "$run_dir/.trainer-gpus" "$run_dir/trainer-gpus"
          mv "$run_dir/.trainer-node" "$run_dir/trainer-node"
          mv "$run_dir/.trainer-ready" "$run_dir/trainer-ready"

          deadline=$((SECONDS + 480))
          until test -s "$run_dir/rollout-ack"; do
            if (( SECONDS >= deadline )); then
              echo "rollout ACK timed out" >&2
              exit 1
            fi
            sleep 2
          done
          grep -Fxq "${SMOKE_ID}" "$run_dir/rollout-ack"
          printf 'GPU_RECORD trainer %s\n' "${gpu_records[@]}"
          printf 'NODE_RECORD trainer %s\n' "$NODE_NAME"
          echo H100_TRAINER_OK
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SMOKE_ID
          value: ${SMOKE_ID}
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
          nvidia.com/gpu: "2"
        limits:
          cpu: "1"
          memory: 1Gi
          nvidia.com/gpu: "2"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: h100-smoke-shared
---
apiVersion: v1
kind: Pod
metadata:
  name: rollout
  labels:
    app.kubernetes.io/name: mx-h100-infra-smoke
    ci.modelexpress.nvidia.com/role: rollout
spec:
  automountServiceAccountToken: false
  activeDeadlineSeconds: 600
  restartPolicy: Never
  nodeSelector:
    ai-dynamo.github.com/ci-pool: h100
    kubernetes.io/arch: amd64
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mx-h100-infra-smoke
  containers:
    - name: rollout
      image: nvcr.io/nvidia/cuda:13.0.0-base-ubuntu24.04
      command: [bash, -ceu, --]
      args:
        - |
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          mapfile -t gpu_records < <(
            nvidia-smi --query-gpu=name,uuid --format=csv,noheader
          )
          test "${#gpu_records[@]}" -eq 1
          [[ "${gpu_records[0]}" == NVIDIA\ H100* ]]

          run_dir=/shared/${SMOKE_ID}
          deadline=$((SECONDS + 480))
          until test -s "$run_dir/trainer-ready"; do
            if (( SECONDS >= deadline )); then
              echo "trainer token timed out" >&2
              exit 1
            fi
            sleep 2
          done
          grep -Fxq "${SMOKE_ID}" "$run_dir/trainer-ready"
          test -s "$run_dir/trainer-gpus"
          test -s "$run_dir/trainer-node"
          printf '%s\n' "${gpu_records[@]}" > "$run_dir/.rollout-gpus"
          printf '%s\n' "$NODE_NAME" > "$run_dir/.rollout-node"
          printf '%s\n' "${SMOKE_ID}" > "$run_dir/.rollout-ack"
          sync
          mv "$run_dir/.rollout-gpus" "$run_dir/rollout-gpus"
          mv "$run_dir/.rollout-node" "$run_dir/rollout-node"
          mv "$run_dir/.rollout-ack" "$run_dir/rollout-ack"

          printf 'GPU_RECORD rollout %s\n' "${gpu_records[@]}"
          printf 'NODE_RECORD rollout %s\n' "$NODE_NAME"
          echo H100_ROLLOUT_OK
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SMOKE_ID
          value: ${SMOKE_ID}
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
          nvidia.com/gpu: "1"
        limits:
          cpu: "1"
          memory: 1Gi
          nvidia.com/gpu: "1"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: h100-smoke-shared
