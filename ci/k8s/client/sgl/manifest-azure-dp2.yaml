# SGLang native DP=2 with two complete rank-0 model copies.
# Applied separately for mx-source and mx-target on different full-GPU hosts.

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: mx-p2p-worker
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: worker-registry
      # Pin to a non-MIG full-GPU pool (see CLUSTER REQUIREMENT above). The
      # agentpool podAffinity below is redundant under this nodeSelector but is
      # kept for self-documentation and as defense if the nodeSelector changes.
      nodeSelector:
        agentpool: a100b
      affinity:
        # Source and target on different hosts so we exercise true cross-host
        # RDMA over IB, not intra-node loopback through the same NIC.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mx-p2p-worker
              topologyKey: kubernetes.io/hostname
        # Pin source + target to the SAME node pool. The test cluster splits GPU
        # nodes across InfiniBand partitions (different pkeys), and pods on
        # different pkeys can't talk RDMA (UCX "local pkey differs from remote
        # pkey", NIXL_ERR_BACKEND on receive). Combined with the hostname
        # anti-affinity, this forces source/target onto different hosts WITHIN
        # the same IB partition.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mx-p2p-worker
              topologyKey: agentpool
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: no-datadog
          operator: Exists
          effect: NoExecute
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
      containers:
        - name: ${JOB_NAME}
          image: ${WORKER_IMAGE}
          # Force re-pull on every pod creation so CI/dev iterations on the same
          # tag pick up freshly pushed images instead of the node's cached copy.
          imagePullPolicy: Always
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - --model-path
            - "${MX_CI_MODEL}"
            - --host
            - "0.0.0.0"
            - --port
            - "${WORKER_PORT}"
            - --tp
            - "1"
            - --dp-size
            - "2"
            - --load-balance-method
            - round_robin
            # Keep KV fixed and small so VRAM parity stays sensitive to weight
            # residency instead of the engine auto-sizing cache around leaks.
            - --context-length
            - "1024"
            - --mem-fraction-static
            - "0.6"
            - --trust-remote-code
            - --load-format
            - remote_instance
            - --remote-instance-weight-loader-backend
            - modelexpress
            - --modelexpress-config
            - '{"transport": "nixl"}'
          env:
            - name: MX_MODEL_URI
              value: "${MX_CI_MODEL}"
            - name: MX_SERVER_ADDRESS
              value: "mx-server:8000"
            - name: MX_ARTIFACT_TRANSFER
              value: "1"
            - name: MX_ARTIFACT_READY_URL
              value: "http://127.0.0.1:${WORKER_PORT}/health"
            - name: MX_RDMA_NIC_PIN
              value: "auto"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          ports:
            - containerPort: ${WORKER_PORT}
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "2"
              rdma/ib: "2"
            limits:
              nvidia.com/gpu: "2"
              rdma/ib: "2"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add: [IPC_LOCK]
