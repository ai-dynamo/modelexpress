# Azure single-GPU vLLM MTP template for P2P RDMA CI.
# Applied once as mx-source and once as mx-target. The target must receive the
# main-model weights over P2P, then load the small MTP draft head locally.
#
# Environment variables substituted before each apply:
#   JOB_NAME        — mx-source or mx-target
#   WORKER_IMAGE    — image built from ci/k8s/client/vllm/Dockerfile
#   WORKER_PORT     — port the vLLM server listens on
#   MX_CI_MODEL     — MTP-capable HuggingFace model id
#   MX_P2P_METADATA — decentralized (1) or central full-manifest (0) metadata

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mx-p2p-worker
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: worker-registry
      nodeSelector:
        agentpool: a100a
      affinity:
        # Keep source and target on different hosts so the transfer exercises
        # cross-host InfiniBand instead of intra-node loopback.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mx-p2p-worker
              topologyKey: kubernetes.io/hostname
        # Keep both roles in one node pool because its nodes share an IB pkey.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mx-p2p-worker
              topologyKey: agentpool
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: no-datadog
          operator: Exists
          effect: NoExecute
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
      containers:
        - name: ${JOB_NAME}
          image: ${WORKER_IMAGE}
          imagePullPolicy: Always
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - "${MX_CI_MODEL}"
            - --load-format
            - modelexpress
            - --tensor-parallel-size
            - "1"
            - --language-model-only
            - --max-model-len
            - "1024"
            - --kv-cache-memory-bytes
            - "1073741824"
            - --compilation-config
            - '{"cache_dir":"/root/.cache/vllm/torch_compile_cache/mx-ci-mtp"}'
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":1}'
            - --trust-remote-code
            - --port
            - "${WORKER_PORT}"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VLLM_PLUGINS
              value: "modelexpress"
            - name: MX_SERVER_ADDRESS
              value: "mx-server:8000"
            - name: MX_CONTIGUOUS_REG
              value: "0"
            - name: MX_RDMA_NIC_PIN
              value: "auto"
            - name: MX_P2P_METADATA
              value: "${MX_P2P_METADATA}"
            - name: MX_ARTIFACT_TRANSFER
              value: "1"
            - name: MX_ARTIFACT_READY_URL
              value: "http://127.0.0.1:${WORKER_PORT}/health"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          ports:
            - containerPort: ${WORKER_PORT}
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add: [IPC_LOCK]
