# Inference CI downloads per Pod; RL needs one local seed visible to both the
# trainer and rollout worker, so this creates per-run RWX staging.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-model-cache
spec:
  accessModes: [ReadWriteMany]
  storageClassName: azurefile-csi
  resources:
    requests: {storage: 10Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vime-delta-refit-model-download
spec:
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - {name: nvcr-imagepullsecret}
      containers:
      - name: download
        image: WORKER_IMAGE
        command: [python3, -c]
        args:
        - >-
          from huggingface_hub import snapshot_download;
          snapshot_download("Qwen/Qwen3-0.6B", revision="c1899de289a04d12100db370d81485cdf75e47ca", local_dir="/models/Qwen/Qwen3-0.6B")
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token-secret, key: HF_TOKEN}
        volumeMounts:
        - {name: models, mountPath: /models}
      volumes:
      - name: models
        persistentVolumeClaim: {claimName: shared-model-cache}
