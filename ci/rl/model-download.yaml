# aws-dev-02 creates the shared-model-cache claim with each namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: vime-delta-refit-model-download
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector: {kubernetes.io/arch: amd64}
      imagePullSecrets:
      - {name: nvcr-imagepullsecret}
      containers:
      - name: download
        image: WORKER_IMAGE
        command: [python3, -c]
        args:
        - >-
          from huggingface_hub import snapshot_download;
          snapshot_download("Qwen/Qwen3-0.6B", revision="c1899de289a04d12100db370d81485cdf75e47ca", local_dir="/models/Qwen/Qwen3-0.6B")
        env:
        - {name: HOME, value: /tmp}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token-secret, key: HF_TOKEN}
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts:
        - {name: models, mountPath: /models}
      volumes:
      - name: models
        persistentVolumeClaim: {claimName: shared-model-cache}
