<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">One warm refit — per-PP-stage lanes overlap, the misc broadcast cannot</title>
  <desc id="d">Timing waterfall of one refit. Trainer stages stack grouped MoE experts, then co-call nccl.m2n.reshard with the generator ranks on independent per-stage communicators that overlap on separate CUDA streams. After every reshard lane drains, the remaining parameters ride one packed broadcast on the all-participants communicator, then the loader installs and both sides report completion.</desc>
