  <rect x="822.97" y="673" width="22" height="14" rx="3" fill="#fed7aa" stroke="#B45309" stroke-width="1.4"/>
  <text x="851.97" y="684" class="key">misc broadcast</text>
  <rect x="971.7" y="673" width="22" height="14" rx="3" fill="#dbeafe" stroke="#1565C0" stroke-width="1.4"/>
  <text x="1000.7" y="684" class="key">install</text>
  <text x="350" y="728" class="note-em">Why the broadcast lane cannot overlap the reshard lanes</text>
  <text x="350" y="752" class="note">The broadcast communicator spans every trainer and generator rank, so it overlaps every reshard communicator. Concurrent traffic on</text>
  <text x="350" y="776" class="note">overlapping NCCL communicators can deadlock, so the misc broadcast is issued strictly after all bulk lanes drain.</text>
  <text x="350" y="812" class="note">Bulk fraction is what makes this shape pay: 97-98% of a large MoE model's refit bytes are FFN projection weights on the green lanes, ~67% dense.</text>
  <text x="350" y="848" class="note-em">Every participant must issue the identical op sequence — the plan's parameter order is the single source of truth on both sides.</text>
  <text x="350" y="872" class="note">A rank that skips one parameter its peers issue hangs the whole communicator, not just itself, which is why the plan is digest-verified first.</text>
</svg>
