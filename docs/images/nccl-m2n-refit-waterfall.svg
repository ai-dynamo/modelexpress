  <rect x="794.6" y="380" width="58.5" height="40" rx="5" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="823.9" y="405" text-anchor="middle" class="bl">post</text>
  <rect x="853.1" y="380" width="245.7" height="40" rx="5" fill="#76B900" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="976.0" y="405" text-anchor="middle" class="bl">reshard  lane 0 · group 1</text>
