  <text x="1520" y="660" text-anchor="end" class="axis">wall-clock time -&gt;</text>
  <rect x="20" y="110" width="1560" height="80" rx="8" fill="#faf5ff"/>
  <text x="30" y="165" class="lane">RL orchestrator</text>
  <rect x="20" y="190" width="1560" height="80" rx="8" fill="#f0fdf4"/>
