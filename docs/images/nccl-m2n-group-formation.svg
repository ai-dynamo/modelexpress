  <rect x="687.0" y="224" width="697.0" height="40" rx="5" fill="#fed7aa" stroke="#B45309" stroke-width="1.5"/>
  <text x="1035.5" y="249" text-anchor="middle" class="bl">Communicator.init  (nccl4py)</text>
  <rect x="466.0" y="308" width="63.8" height="40" rx="5" fill="#dcfce7" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="497.9" y="333" text-anchor="middle" class="bl">Join</text>
  <rect x="529.8" y="308" width="157.2" height="40" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="530.8" y1="302" x2="530.8" y2="307" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="536.8" y="298" class="blo">GetCollectiveGroup poll</text>
  <rect x="687.0" y="308" width="697.0" height="40" rx="5" fill="#fed7aa" stroke="#B45309" stroke-width="1.5"/>
  <text x="1035.5" y="333" text-anchor="middle" class="bl">Communicator.init</text>
  <rect x="474.5" y="392" width="63.8" height="40" rx="5" fill="#dcfce7" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="506.4" y="417" text-anchor="middle" class="bl">Join</text>
  <rect x="538.2" y="392" width="148.8" height="40" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="539.2" y1="386" x2="539.2" y2="391" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="545.2" y="382" class="blo">GetCollectiveGroup poll</text>
  <rect x="687.0" y="392" width="697.0" height="40" rx="5" fill="#fed7aa" stroke="#B45309" stroke-width="1.5"/>
