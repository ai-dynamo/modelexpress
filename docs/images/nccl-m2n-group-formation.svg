  <line x1="670.0" y1="112" x2="670.0" y2="526" stroke="#e5e7eb" stroke-width="1"/>
  <text x="670.0" y="548" text-anchor="middle" class="axis">400ms</text>
  <line x1="840.0" y1="112" x2="840.0" y2="526" stroke="#e5e7eb" stroke-width="1"/>
  <text x="840.0" y="548" text-anchor="middle" class="axis">600ms</text>
