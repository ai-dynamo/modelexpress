  <line x1="1520.0" y1="112" x2="1520.0" y2="526" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1520.0" y="548" text-anchor="middle" class="axis">1400ms</text>
  <line x1="330" y1="526" x2="1520" y2="526" stroke="#94a3b8" stroke-width="2"/>
