<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Group formation — paid once per group epoch, not once per refit</title>
  <desc id="d">Timing waterfall of collective group formation. The orchestrator creates the transfer and invokes both actor sets. Every worker joins the group; the trainer MX ranks first in each lane generates and publishes the NCCL unique id. Once MX marks the group READY, all ranks initialize their NCCL communicator, which dominates setup cost, after which generators fetch the reshard plan.</desc>
  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #111827; }
      .subtitle { font: 500 17px system-ui, sans-serif; fill: #4b5563; }
      .lane { font: 600 15px system-ui, sans-serif; fill: #111827; }
      .lane-sub { font: 400 13px system-ui, sans-serif; fill: #6b7280; }
      .bl { font: 600 13px system-ui, sans-serif; fill: #ffffff; }
      .blo { font: 600 13px system-ui, sans-serif; fill: #334155; }
      .axis { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
      .note { font: 400 14px system-ui, sans-serif; fill: #4b5563; }
      .note-em { font: 700 14px system-ui, sans-serif; fill: #B45309; }
      .key { font: 500 13px system-ui, sans-serif; fill: #4b5563; }
    </style>
  </defs>
  <rect width="1600" height="800" rx="20" fill="#f8fafc"/>
  <text x="800" y="46" text-anchor="middle" class="title">Group formation — paid once per group epoch, not once per refit</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">MX replaces NeMo RL's per-PP-stage TCPStore rendezvous, and adds admission, fencing, and a READY state the trainer can observe.</text>
