  <text x="508.5" y="501" text-anchor="middle" class="bl">FORMING</text>
  <rect x="687.0" y="476" width="833.0" height="40" rx="5" fill="#dcfce7" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1103.5" y="501" text-anchor="middle" class="bl">READY</text>
  <line x1="687.0" y1="104" x2="687.0" y2="470" stroke="#B45309" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="697.0" y="120" class="note-em" fill="#B45309">READY</text>
  <rect x="330" y="581" width="22" height="14" rx="3" fill="#ede9fe" stroke="#6D28D9" stroke-width="1.4"/>
  <text x="359" y="592" class="key">orchestrator</text>
  <rect x="465.34000000000003" y="581" width="22" height="14" rx="3" fill="#dcfce7" stroke="#2E7D32" stroke-width="1.4"/>
  <text x="494.34000000000003" y="592" class="key">MX rendezvous</text>
  <rect x="607.375" y="581" width="22" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="636.375" y="592" class="key">waiting</text>
  <rect x="709.24" y="581" width="22" height="14" rx="3" fill="#fed7aa" stroke="#B45309" stroke-width="1.4"/>
  <text x="738.24" y="592" class="key">NCCL communicator setup</text>
  <rect x="918.225" y="581" width="22" height="14" rx="3" fill="#dbeafe" stroke="#1565C0" stroke-width="1.4"/>
  <text x="947.225" y="592" class="key">plan fetch</text>
  <text x="330" y="636" class="note">Communicator.init is the expensive bar — hundreds of milliseconds to seconds at scale — and it is charged once per group epoch.</text>
  <text x="330" y="660" class="note">An unchanged membership reuses the communicators across every later refit; a membership change bumps the epoch and forces a rebuild.</text>
  <text x="330" y="700" class="note-em">What MX adds over a raw TCPStore rendezvous</text>
  <text x="330" y="724" class="note">no per-stage port allocation to plumb through the driver   ·   admission against an explicit expected set   ·   worker-generation fencing</text>
  <text x="330" y="748" class="note">and a READY state observable by the trainer that must launch the collective, rather than a barrier it can only block on.</text>
</svg>
