<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="t d">
  <title id="t">NCCL M2N collective refit — components and messages</title>
  <desc id="d">Component diagram. The RL orchestrator creates a collective transfer in the ModelExpress control plane and invokes trainer and generator actors with the same version and operation reference. Each rank-local refit client joins the collective group, receives an MX-assigned rank in each lane, and waits for the group to reach READY before entering the collective. The trainer lane leader generates and publishes the NCCL unique id. Weight bytes move directly between trainer and generator ranks over nccl.m2n.reshard followed by a packed broadcast for the remaining parameters.</desc>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B45309"/></marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E7D32"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1565C0"/></marker>
    <marker id="av" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6D28D9"/></marker>
    <style>
