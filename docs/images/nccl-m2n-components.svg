      .st { font: 700 14px system-ui, sans-serif; fill: #111827; }
      .nx { font: 400 14px system-ui, sans-serif; fill: #374151; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .lane { font: 600 15px system-ui, sans-serif; fill: #111827; }
      .lane-sub { font: 400 13px system-ui, sans-serif; fill: #6b7280; }
      .bl { font: 600 13px system-ui, sans-serif; fill: #ffffff; }
      .blo { font: 600 13px system-ui, sans-serif; fill: #374151; }
      .axis { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
      .note { font: 400 14px system-ui, sans-serif; fill: #4b5563; }
      .note-em { font: 700 14px system-ui, sans-serif; fill: #B45309; }
      .legend { font: 400 15px system-ui, sans-serif; fill: #4b5563; }
      .edge { fill: none; stroke-width: 2.2; }
      .wire { fill: none; stroke-width: 6; }
    </style>
  </defs>
  <rect width="1800" height="1120" rx="20" fill="#f8fafc"/>
  <text x="900" y="46" text-anchor="middle" class="title">NCCL M2N collective refit — components and messages</text>
  <text x="900" y="76" text-anchor="middle" class="subtitle">MX brokers rendezvous, admission, rank assignment, fencing and readiness. Weight bytes never touch the control plane.</text>
  <rect x="694" y="100" width="420" height="64" rx="10" fill="#ede9fe" stroke="#6D28D9" stroke-width="2"/>
  <text x="904" y="125" text-anchor="middle" class="nt">RL orchestrator</text>
  <text x="904" y="147" text-anchor="middle" class="nx">owns version choice, target selection, barriers</text>
  <path class="edge" d="M694,140 L219,140 L219,232" stroke="#6D28D9" marker-end="url(#av)" stroke-dasharray="6 5"/>
  <path class="edge" d="M1114,140 L1589,140 L1589,232" stroke="#6D28D9" marker-end="url(#av)" stroke-dasharray="6 5"/>
  <text x="219" y="132" text-anchor="middle" class="mono" fill="#6D28D9">actor RPC (version, operation_ref)</text>
  <text x="1589" y="132" text-anchor="middle" class="mono" fill="#6D28D9">actor RPC (version, operation_ref)</text>
  <rect x="14" y="186" width="410" height="586" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="24" y="214" class="col" fill="#1565C0">Trainer side</text>
  <rect x="684" y="186" width="440" height="586" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="694" y="214" class="col" fill="#2E7D32">MX control plane</text>
  <rect x="1384" y="186" width="410" height="586" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1394" y="214" class="col" fill="#1565C0">Generator side</text>
  <rect x="24" y="232" width="390" height="56" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="219" y="257" text-anchor="middle" class="nt">RL trainer actor</text>
  <text x="219" y="279" text-anchor="middle" class="nx">one per trainer rank, framework-native RPC</text>
  <rect x="1394" y="232" width="390" height="56" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="1589" y="257" text-anchor="middle" class="nt">RL generator actor</text>
  <text x="1589" y="279" text-anchor="middle" class="nx">one per generator rank, framework-native RPC</text>
  <path class="edge" d="M219,288 L219,318" stroke="#1565C0" marker-end="url(#ab)"/>
  <path class="edge" d="M1589,288 L1589,318" stroke="#1565C0" marker-end="url(#ab)"/>
  <rect x="24" y="318" width="390" height="438" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="219" y="343" text-anchor="middle" class="nt">RefitClient.Trainer</text>
  <text x="219" y="365" text-anchor="middle" class="nx">initialize · setup_layer_groups · compute_plan</text>
  <text x="219" y="384" text-anchor="middle" class="nx">start_weight_update · publish_weights</text>
  <text x="219" y="403" text-anchor="middle" class="nx">finish_weight_update · cleanup</text>
  <rect x="38" y="434" width="362" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="219" y="456" text-anchor="middle" class="st">Publisher — pluggable engine SPI</text>
  <text x="219" y="478" text-anchor="middle" class="nx">capture() -&gt; LocalParamSpec(base, pre, post)</text>
  <text x="219" y="497" text-anchor="middle" class="nx">pre: stack this rank's grouped MoE experts</text>
  <rect x="38" y="536" width="362" height="206" rx="8" fill="#fef3c7" stroke="#B45309" stroke-width="1.5"/>
  <text x="219" y="558" text-anchor="middle" class="st">ShardRedistributionBackend.Sender</text>
  <text x="219" y="582" text-anchor="middle" class="nx">nccl_m2n backend — the only importer of nccl</text>
  <text x="219" y="601" text-anchor="middle" class="nx">reshard lanes: one per trainer PP stage</text>
  <text x="219" y="620" text-anchor="middle" class="nx">broadcast lane: all participants</text>
  <text x="219" y="639" text-anchor="middle" class="nx">caches Communicator by (group_id, epoch)</text>
  <text x="219" y="664" text-anchor="middle" class="nx" fill="#6b7280">internal to MX — not called from outside</text>
  <rect x="1394" y="318" width="390" height="438" rx="10" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="1589" y="343" text-anchor="middle" class="nt">RefitClient.Generator</text>
  <text x="1589" y="365" text-anchor="middle" class="nx">initialize · setup_layer_groups · compute_plan</text>
  <text x="1589" y="384" text-anchor="middle" class="nx">start_weight_update · update_weights</text>
  <text x="1589" y="403" text-anchor="middle" class="nx">finish_weight_update · cleanup</text>
  <rect x="1408" y="434" width="362" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1589" y="456" text-anchor="middle" class="st">Loader — pluggable engine SPI</text>
  <text x="1589" y="478" text-anchor="middle" class="nx">capture · patch_temporary_buffers · install</text>
  <text x="1589" y="497" text-anchor="middle" class="nx">post: copy region into the fused parameter</text>
  <rect x="1408" y="536" width="362" height="206" rx="8" fill="#fef3c7" stroke="#B45309" stroke-width="1.5"/>
  <text x="1589" y="558" text-anchor="middle" class="st">ShardRedistributionBackend.Receiver</text>
  <text x="1589" y="582" text-anchor="middle" class="nx">nccl_m2n backend — destinations prepared first</text>
  <text x="1589" y="601" text-anchor="middle" class="nx">identical lane set and op order</text>
  <text x="1589" y="620" text-anchor="middle" class="nx">post-hooks commit into live parameters</text>
  <text x="1589" y="639" text-anchor="middle" class="nx">caches Communicator by (group_id, epoch)</text>
  <text x="1589" y="664" text-anchor="middle" class="nx" fill="#6b7280">internal to MX — not called from outside</text>
  <rect x="694" y="232" width="420" height="76" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="904" y="257" text-anchor="middle" class="nt">RefitCollectiveService</text>
  <text x="904" y="279" text-anchor="middle" class="nx">new proto and Rust module, NCCL-only;</text>
  <text x="904" y="298" text-anchor="middle" class="nx">reuses RegisterWorker + WeightVersion only</text>
  <rect x="694" y="330" width="420" height="168" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="904" y="355" text-anchor="middle" class="nt">CollectiveGroup — membership-keyed</text>
  <text x="904" y="377" text-anchor="middle" class="nx">epoch — bumps on any membership change</text>
  <text x="904" y="396" text-anchor="middle" class="nx">state: FORMING -&gt; READY -&gt; RELEASING</text>
  <text x="904" y="415" text-anchor="middle" class="nx">lanes[]: RESHARD x pp_size + BROADCAST x1</text>
  <text x="904" y="434" text-anchor="middle" class="nx">    world_size · nccl_unique_id</text>
  <text x="904" y="453" text-anchor="middle" class="nx">    participants[] {slot, worker_id, rank}</text>
  <text x="904" y="472" text-anchor="middle" class="nx">plan_source {worker_id, endpoint, digest}</text>
  <rect x="694" y="524" width="420" height="116" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="904" y="549" text-anchor="middle" class="nt">CollectiveTransfer — one per refit</text>
  <text x="904" y="571" text-anchor="middle" class="nx">operation_id · version_id · (group_id, epoch)</text>
  <text x="904" y="590" text-anchor="middle" class="nx">admitted trainer + generator slots  &lt;- RQ5</text>
  <text x="904" y="609" text-anchor="middle" class="nx">PENDING -&gt; RUNNING -&gt; COMPLETE | FAILED</text>
  <rect x="694" y="666" width="420" height="90" rx="10" fill="#f0fdf4" stroke="#76B900" stroke-width="2"/>
  <text x="904" y="691" text-anchor="middle" class="nt">READY requires all three</text>
  <text x="904" y="713" text-anchor="middle" class="nx">every expected slot has joined</text>
  <text x="904" y="732" text-anchor="middle" class="nx">every lane has a posted nccl_unique_id</text>
  <text x="904" y="751" text-anchor="middle" class="nx">every admitted WorkerRegistration is live</text>
  <path class="edge" d="M416,362 L692,362" stroke="#2E7D32" marker-end="url(#agr)"/>
  <text x="554" y="355" text-anchor="middle" class="mono" fill="#2E7D32">JoinCollectiveGroup</text>
  <path class="edge" d="M1392,362 L1116,362" stroke="#2E7D32" marker-end="url(#agr)"/>
  <path class="edge" d="M692,398 L416,398" stroke="#2E7D32" marker-end="url(#agr)"/>
  <text x="554" y="391" text-anchor="middle" class="mono" fill="#2E7D32">-&gt; rank_in_lane, epoch</text>
  <path class="edge" d="M1116,398 L1392,398" stroke="#2E7D32" marker-end="url(#agr)"/>
  <path class="edge" d="M416,434 L692,434" stroke="#2E7D32" marker-end="url(#agr)"/>
  <text x="554" y="427" text-anchor="middle" class="mono" fill="#2E7D32">PublishGroupBootstrap</text>
  <path class="edge" d="M1392,434 L1116,434" stroke="#2E7D32" marker-end="url(#agr)"/>
  <path class="edge" d="M692,470 L416,470" stroke="#2E7D32" marker-end="url(#agr)" stroke-dasharray="5 4"/>
  <text x="554" y="463" text-anchor="middle" class="mono" fill="#2E7D32">GetCollectiveGroup poll</text>
  <path class="edge" d="M1116,470 L1392,470" stroke="#2E7D32" marker-end="url(#agr)" stroke-dasharray="5 4"/>
  <text x="1254" y="355" text-anchor="middle" class="mono" fill="#2E7D32">JoinCollectiveGroup</text>
  <text x="1254" y="391" text-anchor="middle" class="mono" fill="#2E7D32">-&gt; rank_in_lane, epoch</text>
  <text x="1254" y="427" text-anchor="middle" class="mono" fill="#2E7D32">(lane leader only)</text>
  <text x="1254" y="463" text-anchor="middle" class="mono" fill="#2E7D32">GetCollectiveGroup poll</text>
  <path class="edge" d="M416,570 L692,570" stroke="#2E7D32" marker-end="url(#agr)"/>
  <text x="554" y="563" text-anchor="middle" class="mono" fill="#2E7D32">ReportCollectiveTransfer</text>
  <path class="edge" d="M1392,570 L1116,570" stroke="#2E7D32" marker-end="url(#agr)"/>
  <text x="1254" y="563" text-anchor="middle" class="mono" fill="#2E7D32">ReportCollectiveTransfer</text>
  <rect x="14" y="798" width="1780" height="142" rx="16" fill="#f7fee7" stroke="#76B900" stroke-width="2"/>
  <text x="900" y="826" text-anchor="middle" class="col" fill="#2E7D32">Data plane — trainer ranks to generator ranks, directly</text>
  <path class="edge" d="M219,758 L219,794" stroke="#2E7D32" marker-end="url(#agr)"/>
  <path class="edge" d="M1589,758 L1589,794" stroke="#2E7D32" marker-end="url(#agr)"/>
  <path class="wire" d="M219,872 L1589,872" stroke="#76B900"/>
  <circle cx="219" cy="872" r="7" fill="#76B900"/><circle cx="1589" cy="872" r="7" fill="#76B900"/>
  <text x="900" y="864" text-anchor="middle" class="mono" fill="#2E7D32">nccl.m2n.reshard(src_local, dst_local, comm, src_mesh, src_placements, dst_mesh, dst_placements, stream)</text>
  <text x="900" y="900" text-anchor="middle" class="mono" fill="#2E7D32">then  comm.broadcast(packed misc params, root=0)   —   strictly after every reshard lane drains</text>
  <text x="900" y="926" text-anchor="middle" class="legend">co-called: the trainer passes dst=NULL and the generator passes src=NULL; NCCL routes M-&gt;N from the two meshes</text>
  <rect x="14" y="966" width="1780" height="80" rx="16" fill="#fffbeb" stroke="#B45309" stroke-width="2" stroke-dasharray="8 5"/>
  <path class="edge" d="M1589,1012 L219,1012" stroke="#B45309" marker-end="url(#ag)" stroke-dasharray="7 5"/>
  <text x="900" y="1002" text-anchor="middle" class="mono" fill="#B45309">RefitCollectiveWorkerService.GetReshardPlan(group_id, epoch)   —   worker to worker, digest-verified</text>
  <text x="900" y="1034" text-anchor="middle" class="legend">the plan is a function of layout and admitted membership, not of the weights: fetched once per epoch, never per refit</text>
  <text x="900" y="1086" text-anchor="middle" class="legend">Green = control plane (client to MX).  Amber dashed = worker to worker.  Purple dashed = framework-native actor RPC.  No component on this path imports NIXL.</text>
</svg>
