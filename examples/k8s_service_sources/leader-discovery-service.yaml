# The complete MX discovery Service for a multi-node LeaderWorkerSet.
# Set app: my-model on the LWS leader template, and set the following on ALL
# source/target containers (images must contain this version of ModelExpress):
#   MX_METADATA_BACKEND=k8s-service
#   MX_K8S_LEADER_SERVICE=mx-sources:6555
#   MX_WORKER_GRPC_PORT=6555
#   MX_METADATA_PORT=5555
#   MX_ARTIFACT_TRANSFER=1
#   MX_MODEL_REVISION=<immutable checkpoint revision>
#   MX_WORKER_HOST=<status.podIP through the Downward API>
# Keep the leader's engine /health readiness probe enabled. Worker registration
# uses the engine head address (vLLM master_addr / SGLang dist_init_addr / LWS
# LWS_LEADER_ADDRESS); it MUST NOT use this load-balanced Service address.
# The LWS controller still owns its normal engine rendezvous/headless Services.
apiVersion: v1
kind: Service
metadata:
  name: mx-sources
spec:
  selector:
    app: my-model
    leaderworkerset.sigs.k8s.io/worker-index: "0"
  ports:
    - name: mx-metadata
      port: 6555
      targetPort: 6555
