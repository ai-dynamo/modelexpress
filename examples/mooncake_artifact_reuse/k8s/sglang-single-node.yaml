# Replace the image, model PVC, and namespace before applying. The image must
# include SGLang, ModelExpress, NIXL, and a Mooncake package with mooncake.store.
apiVersion: v1
kind: Service
metadata:
  name: mx-mooncake-sglang
spec:
  selector:
    app: mx-mooncake-sglang
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-mooncake-sglang
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mx-mooncake-sglang
  template:
    metadata:
      labels:
        app: mx-mooncake-sglang
    spec:
      containers:
        - name: sglang
          image: your-registry/sglang-modelexpress-mooncake:latest
          command: [python3, -m, sglang.launch_server]
          args:
            - --model-path
            - /models/model
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --tp
            - "1"
            - --load-format
            - remote_instance
            - --remote-instance-weight-loader-backend
            - modelexpress
            - --modelexpress-config
            - '{"transport":"nixl"}'
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 10
          securityContext:
            capabilities:
              add: [IPC_LOCK]
          env:
            - name: MX_ARTIFACT_TRANSFER
              value: "1"
            - name: MX_ARTIFACT_BACKEND
              value: mooncake
            - name: MX_P2P_METADATA
              value: "0"
            - name: MX_ARTIFACT_MOONCAKE_NAMESPACE
              value: modelexpress/examples/change-me/
            - name: MX_MOONCAKE_CONFIG_PATH
              value: /etc/mooncake/config.json
            - name: MX_ARTIFACT_READY_URL
              value: http://127.0.0.1:8000/health
            - name: MX_ARTIFACT_BUNDLE_ROOT
              value: /cache/artifact-bundles
            - name: SGLANG_CACHE_DIR
              value: /cache/sglang
            - name: SGLANG_DG_CACHE_DIR
              value: /cache/deep_gemm
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /cache/torch_inductor
            - name: TVM_FFI_CACHE_DIR
              value: /cache/tvm_ffi
            - name: TRITON_CACHE_DIR
              value: /cache/triton
            - name: TILELANG_CACHE_DIR
              value: /cache/tilelang
            - name: CUTE_DSL_CACHE_DIR
              value: /cache/cute_dsl
            - name: FLASHINFER_WORKSPACE_BASE
              value: /cache/flashinfer_workspace
            - name: CUDA_CACHE_PATH
              value: /cache/cuda
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: mooncake-config
              mountPath: /etc/mooncake
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: model-cache
        - name: cache
          emptyDir: {}
        - name: mooncake-config
          secret:
            secretName: mooncake-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
