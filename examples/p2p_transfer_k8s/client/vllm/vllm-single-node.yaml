# Single-node vLLM deployment with ModelExpress P2P weight and cache transfer.
# Deploys DeepSeek-V4-Pro on 1 node (8 GPUs, TP=8).
#
# Prerequisites:
#   - ModelExpress server deployed (see ../../server/)
#   - PVC with model weights pre-downloaded
#   - kubectl create secret generic hf-token-secret --from-literal=HF_TOKEN=<token>
#
# On startup, the mx loader queries the MX server:
#   - If a ready source exists for this model -> receive weights via RDMA
#   - If no source is available -> load weights from disk
# Either way, the node registers with NIXL and publishes metadata so
# future nodes can discover it as a source.
# P2P metadata is enabled by default; set MX_P2P_METADATA=0 to disable it.
apiVersion: v1
kind: Service
metadata:
  name: mx-vllm
  labels:
    app: mx-vllm
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: mx-vllm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-vllm
  labels:
    app: mx-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mx-vllm
  template:
    metadata:
      labels:
        app: mx-vllm
      # Opt-in ModelExpress client metrics. One endpoint per pod serves the
      # merged series from all eight ranks -- see docs/METRICS.md.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9402"
        prometheus.io/path: /metrics
    spec:
      initContainers:
        # An emptyDir survives container restarts within a pod, so last run's
        # .db files would otherwise be merged into this run's numbers. Must not
        # be done from worker code: ranks start staggered, and a late rank's
        # wipe unlinks an earlier rank's mmapped files, which then vanishes from
        # every later scrape. Note this runs on pod start, not on an app-only
        # container restart; put the same command in your image entrypoint if
        # you need it to cover that too.
        - name: reset-metrics-dir
          image: <your-registry>/modelexpress-client:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "modelexpress.metrics", "--reset"]
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /var/run/mx-metrics
          volumeMounts:
            - name: mx-metrics
              mountPath: /var/run/mx-metrics
      containers:
        - name: vllm
          # Build a vLLM + ModelExpress client image using
          # examples/p2p_transfer_k8s/client/vllm/Dockerfile
          image: <your-registry>/modelexpress-client:latest
          imagePullPolicy: IfNotPresent
          # Needed for GPUDirect RDMA to work.
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          env:
            # Increase startup timeout to allow DeepGemm warmup to complete (2 hours)
            - name: VLLM_RPC_TIMEOUT
              value: "7200000"
            - name: HF_HUB_CACHE
              value: "/models"
            - name: MODEL_NAME
              value: "deepseek-ai/DeepSeek-V4-Pro"
            # Server address for metadata publishing
            - name: MX_SERVER_ADDRESS
              value: "modelexpress-server:8001"
            # Transfer compatible vLLM JIT caches after the source is healthy.
            # Client metrics. PROMETHEUS_MULTIPROC_DIR must be set here in the
            # manifest, never from Python: prometheus_client latches its value
            # class at import, so an in-process assignment lands after the engine
            # has already imported it and silently produces no data.
            - name: MX_METRICS_ENABLED
              value: "1"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /var/run/mx-metrics
            # Distinct from vLLM's own metrics port. Every rank calls enable();
            # whichever wins the bind serves all eight, and the rest re-attempt
            # so the endpoint migrates if that rank exits.
            - name: MX_METRICS_PORT
              value: "9402"
            - name: MX_ARTIFACT_TRANSFER
              value: "1"
            # Per-rank IB NIC pinning. Workaround for openucx/ucx#11259.
            - name: MX_RDMA_NIC_PIN
              value: "auto"
            # Logging (set to DEBUG for troubleshooting)
            - name: NIXL_LOG_LEVEL
              value: "INFO"
            - name: UCX_LOG_LEVEL
              value: "INFO"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          ports:
            - name: mx-metrics
              containerPort: 9402
              protocol: TCP
          args:
            - --model
            - $(MODEL_NAME)
            - --load-format
            - modelexpress
            - --tensor-parallel-size
            - "8"
            - --kv-cache-dtype
            - fp8
          resources:
            limits:
              nvidia.com/gpu: "8"
              rdma/ib: "8"
            requests:
              nvidia.com/gpu: "8"
              rdma/ib: "8"
              memory: "200Gi"
              cpu: "16"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /models
            - name: mx-metrics
              mountPath: /var/run/mx-metrics

      volumes:
        # Memory-backed and small: these are per-rank mmap files, not storage.
        - name: mx-metrics
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
      imagePullSecrets:
        - name: nvcr-imagepullsecret
