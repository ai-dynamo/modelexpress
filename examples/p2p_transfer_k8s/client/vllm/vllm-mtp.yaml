# Single-GPU vLLM deployment with ModelExpress P2P weight transfer and MTP.
# Uses Qwen3.5-0.8B so the full source -> target flow fits on two GPUs.
#
# Prerequisites:
#   - ModelExpress server deployed (see ../../server/)
#   - PVC named model-cache for the Hugging Face cache
#   - kubectl create secret generic hf-token-secret --from-literal=HF_TOKEN=<token>
#
# Verification workflow:
#   1. kubectl apply -f vllm-mtp.yaml
#   2. Wait for the first replica to become ready; it loads from storage and
#      publishes the target-model weights as a P2P source.
#   3. kubectl scale deployment/mx-vllm-mtp --replicas=2
#   4. The second replica receives the target-model weights through P2P, while
#      its small MTP draft head loads locally by design.
apiVersion: v1
kind: Service
metadata:
  name: mx-vllm-mtp
  labels:
    app: mx-vllm-mtp
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: mx-vllm-mtp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx-vllm-mtp
  labels:
    app: mx-vllm-mtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mx-vllm-mtp
  template:
    metadata:
      labels:
        app: mx-vllm-mtp
    spec:
      containers:
        - name: vllm
          # Build a vLLM + ModelExpress client image using
          # examples/p2p_transfer_k8s/client/vllm/Dockerfile
          image: <your-registry>/modelexpress-client:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          env:
            - name: VLLM_RPC_TIMEOUT
              value: "7200000"
            - name: HF_HUB_CACHE
              value: "/models"
            - name: MODEL_NAME
              value: "Qwen/Qwen3.5-0.8B"
            - name: MX_SERVER_ADDRESS
              value: "modelexpress-server:8001"
            - name: MX_ARTIFACT_TRANSFER
              value: "1"
            - name: MX_RDMA_NIC_PIN
              value: "auto"
            - name: NIXL_LOG_LEVEL
              value: "INFO"
            - name: UCX_LOG_LEVEL
              value: "INFO"
            - name: UCX_RNDV_SCHEME
              value: "get_zcopy"
            - name: UCX_RNDV_THRESH
              value: "0"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          args:
            - --model
            - $(MODEL_NAME)
            - --load-format
            - modelexpress
            - --tensor-parallel-size
            - "1"
            - --language-model-only
            - --max-model-len
            - "1024"
            - --kv-cache-memory-bytes
            - "1073741824"
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":1}'
          resources:
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            requests:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
              memory: "32Gi"
              cpu: "8"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /models

      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
      imagePullSecrets:
        - name: nvcr-imagepullsecret
