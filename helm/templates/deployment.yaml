apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modelexpress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modelexpress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "modelexpress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /*
        Scrape annotations are generated from .Values.metrics rather than written
        by hand, so the port can never drift back onto the gRPC listener. Values
        set explicitly in .Values.podAnnotations still win, so an operator can
        override or suppress any single key.
      */}}
      {{- $scrapeAnnotations := dict }}
      {{- if and .Values.metrics .Values.metrics.enabled .Values.metrics.podAnnotations }}
      {{- $scrapeAnnotations = dict
            "prometheus.io/scrape" "true"
            "prometheus.io/port" (.Values.metrics.port | default 9401 | toString)
            "prometheus.io/path" "/metrics" }}
      {{- end }}
      {{- $podAnnotations := merge (deepCopy (.Values.podAnnotations | default dict)) $scrapeAnnotations }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "modelexpress.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "modelexpress.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.image }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 8001 }}
              protocol: TCP
            {{- if and .Values.metrics .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 9401 }}
              protocol: TCP
            {{- end }}
          env:
            {{- $hasNsInExtra := false }}
            {{- $hasMetricsPortInExtra := false }}
            {{- range .Values.extraEnv }}
              {{- if eq .name "MX_METADATA_NAMESPACE" }}
                {{- $hasNsInExtra = true }}
              {{- end }}
              {{- if eq .name "MODEL_EXPRESS_SERVER_METRICS_PORT" }}
                {{- $hasMetricsPortInExtra = true }}
              {{- end }}
            {{- end }}
            {{- /*
              metrics.port is the single source of truth. It drives four things
              that have to agree: this env var, the scrape annotation, the
              containerPort, and the optional Service port. Setting the env var
              directly would move only the first of those, so the server would
              listen on one port while Kubernetes advertised another -- and
              setting it to "0" would silently disable the listener while the
              scrape annotation still pointed at it. Rejected rather than
              silently skipped.

              The env var itself is read only through the clap --metrics-port
              override: the layered config loader maps this name to the key path
              server.metrics.port, which matches no field, and serde drops it
              without a warning.
            */}}
            {{- if or (hasKey .Values.env "MODEL_EXPRESS_SERVER_METRICS_PORT") $hasMetricsPortInExtra }}
            {{- fail "Set metrics.port (and metrics.enabled) rather than MODEL_EXPRESS_SERVER_METRICS_PORT directly: the chart derives the scrape annotation, containerPort and Service port from metrics.port, and an env-only override desynchronizes them." }}
            {{- end }}
            - name: MODEL_EXPRESS_SERVER_METRICS_PORT
              value: {{ if and .Values.metrics .Values.metrics.enabled }}{{ .Values.metrics.port | default 9401 | quote }}{{ else }}"0"{{ end }}
            {{- if and (not (hasKey .Values.env "MX_METADATA_NAMESPACE")) (not $hasNsInExtra) }}
            - name: MX_METADATA_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
            {{- if .Values.security.enabled }}
            {{- if and (eq .Values.security.mode "enforce") (not .Values.security.tokenAudiences) }}
            {{- fail "security.mode=enforce requires a non-empty security.tokenAudiences" }}
            {{- end }}
            {{- if and (eq .Values.security.mode "enforce") (not .Values.security.allowedServiceAccounts) }}
            {{- fail "security.mode=enforce requires a non-empty security.allowedServiceAccounts" }}
            {{- end }}
            - name: MODEL_EXPRESS_SECURITY_MODE
              value: {{ .Values.security.mode | quote }}
            {{- with .Values.security.tokenAudiences }}
            - name: MODEL_EXPRESS_SECURITY_TOKEN_AUDIENCES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.security.allowedServiceAccounts }}
            - name: MODEL_EXPRESS_SECURITY_ALLOWED_SERVICE_ACCOUNTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if hasKey .Values.security "cacheTtlSecs" }}
            - name: MODEL_EXPRESS_SECURITY_CACHE_TTL_SECS
              value: {{ .Values.security.cacheTtlSecs | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          {{- if and .Values.livenessProbe .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.livenessProbe.tcpSocket }}
            tcpSocket:
              {{- toYaml .Values.livenessProbe.tcpSocket | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if and .Values.readinessProbe .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.readinessProbe.tcpSocket }}
            tcpSocket:
              {{- toYaml .Values.readinessProbe.tcpSocket | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (and .Values.persistence .Values.persistence.enabled) .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if and .Values.persistence .Values.persistence.enabled }}
            - name: model-cache
              mountPath: {{ .Values.persistence.mountPath | default "/root" }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (and .Values.persistence .Values.persistence.enabled) .Values.extraVolumes }}
      volumes:
        {{- if and .Values.persistence .Values.persistence.enabled }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "modelexpress.fullname" . }}-pvc
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
