{{- if and .Values.metrics .Values.metrics.rules .Values.metrics.rules.enabled -}}
{{- /*
  Alerts only, no recording rules. Recording rules would make the shipped
  dashboard depend on this resource being installed, so a site that enabled the
  dashboard and not the rules would get empty panels with no error. The panel
  queries are cheap enough that there is no measured load to precompute away.
*/}}
{{- $cfg := .Values.metrics.rules }}
{{- $t := $cfg.thresholds | default dict }}
{{- if not (or $cfg.skipApiVersionCheck (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1")) }}
{{- fail "metrics.rules.enabled but monitoring.coreos.com/v1 is not available: install the Prometheus Operator, or set metrics.rules.skipApiVersionCheck=true if the CRDs are applied alongside this chart." }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "modelexpress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modelexpress.labels" . | nindent 4 }}
    {{- with $cfg.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: modelexpress.liveness
      rules:
        # Server metrics are always-on, so absence is a fault. The client is
        # opt-in and legitimately absent, which is why it has no such alert.
        - alert: MXServerMetricsAbsent
          expr: absent(mx_build_info{component="server"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: ModelExpress server metrics are not being scraped
            description: >-
              No mx_build_info{component="server"} series. Either every replica is
              down, or the scrape never reached them. If this fired right after
              install, check that the Prometheus podMonitorSelector matches this
              PodMonitor's labels -- an unmatched selector produces no error.

        # The heartbeat is stamped only on a successful pass, so staleness is
        # the signal. Never rate() this: it holds a unix timestamp.
        - alert: MXRegistryStatsStale
          expr: >-
            time() - max(mx_task_last_success_timestamp_seconds{task="registry_stats_refresh"})
            > {{ $t.registryStatsStaleSeconds | default 600 }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Registry statistics refresh has stopped succeeding
            description: >-
              mx_registry_entries and mx_state_entries are written by that task and
              are now stale. They keep their last good values on a failed pass, so
              they still look plausible -- this alert is the only thing separating
              a current reading from a frozen one.

    - name: modelexpress.download
      rules:
        # Documented as the leading indicator of a duplicate download.
        - alert: MXDownloadLeaseLost
          expr: sum(rate(mx_download_lease_refresh_total{result="lost"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A download lease was lost
            description: >-
              A downloader stopped heartbeating and another replica may now claim
              its model. Expect MXDownloadTakeover next if it does.

        # A takeover re-pulls the whole model: hundreds of GB for a large one.
        - alert: MXDownloadTakeover
          expr: sum(rate(mx_download_claims_total{result="takeover"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: A download was taken over and is being pulled again
            description: >-
              The previous downloader died mid-transfer. The bytes already fetched
              are re-fetched from scratch.

        # Level without flow. The level must come from the gauge: the transition
        # counters are process-local while DOWNLOADING persists in the store, so
        # after a restart their difference can go negative.
        - alert: MXDownloadWedged
          expr: >-
            sum(mx_registry_entries{status="downloading"}) > 0
            and sum(rate(mx_registry_status_transitions_total{to="downloading"}[30m])) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Entries stuck in DOWNLOADING with nothing entering that state
            description: >-
              Cross-check against MXRegistryStatsStale first: if the refresh task
              is wedged, this gauge is frozen rather than genuinely stuck.

        - alert: MXDownloadFailureRatio
          expr: >-
            sum(rate(mx_download_seconds_count{outcome="error"}[15m]))
            / sum(rate(mx_download_seconds_count[15m]))
            > {{ $t.downloadFailureRatio | default 0.1 }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Model downloads are failing

    - name: modelexpress.serving
      rules:
        # Ratio taken over the counter, not the histogram _count: a cancelled
        # request increments the counter and writes no latency sample, so a
        # histogram-derived denominator silently omits exactly the slow calls.
        #
        # cancelled is excluded from the numerator too -- that is the caller
        # leaving, not a server fault. not_found is a legitimate answer.
        - alert: MXGrpcErrorRatio
          expr: >-
            sum by (method) (rate(mx_grpc_requests_total{outcome!~"ok|cancelled|not_found"}[5m]))
            / sum by (method) (rate(mx_grpc_requests_total[5m]))
            > {{ $t.grpcErrorRatio | default 0.05 }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'gRPC errors on {{ "{{ $labels.method }}" }}'
            description: >-
              If every method lit up at once, suspect the auth path rather than the
              store: outcome="backend_error" absorbs Code::Unavailable, which the
              ServiceAccount token review returns when the Kubernetes API is down.
              A real store outage also raises mx_backend_ops_total{result="error"}.

        - alert: MXBackendErrorRatio
          expr: >-
            sum by (store) (rate(mx_backend_ops_total{result="error"}[5m]))
            / sum by (store) (rate(mx_backend_ops_total[5m]))
            > {{ $t.backendErrorRatio | default 0.05 }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'Storage backend errors in {{ "{{ $labels.store }}" }}'
            description: >-
              store names the subsystem (p2p, registry, refit), not the engine.
              The engine is on mx_build_info{backend=...}.

        # The in-flight gauges are decremented by a Drop guard on every exit path
        # including cancellation, so a standing value is real rather than drift.
        - alert: MXBackendOpsStuck
          expr: >-
            sum by (store) (mx_backend_ops_in_flight) > 0
            and sum by (store) (rate(mx_backend_ops_total[10m])) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'Storage backend {{ "{{ $labels.store }}" }} has operations in flight and none completing'

    - name: modelexpress.capacity
      rules:
        # Registered as the OOM early warning: these maps are never evicted.
        - alert: MXStateEntriesGrowing
          expr: sum by (map) (mx_state_entries) > {{ $t.stateEntriesLimit | default 10000 }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'In-process map {{ "{{ $labels.map }}" }} is large and never evicted'
{{- if $cfg.client }}

    - name: modelexpress.client
      rules:
        # partial and empty both return success today, so they are invisible to
        # every other signal. This is the only place they surface.
        - alert: MXNixlSilentReceiveFailures
          expr: >-
            sum(rate(mx_nixl_receive_total{result=~"partial|empty"}[15m]))
            / sum(rate(mx_nixl_receive_total[15m]))
            > {{ $t.nixlSilentFailureRatio | default 0.01 }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: NIXL transfers are returning partial or empty data
            description: >-
              These report success to the caller. A model loaded from a partial
              receive is silently wrong rather than failed.

        - alert: MXNixlDataPlaneErrors
          expr: sum by (kind) (rate(mx_nixl_data_plane_errors_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'NIXL data-plane errors ({{ "{{ $labels.kind }}" }})'

        # result="error" is a backend outage. result="empty" is a healthy cluster
        # that has published no peers yet, so it is deliberately not alertable.
        - alert: MXP2PListSourcesErrors
          expr: >-
            sum(rate(mx_p2p_list_sources_total{result="error"}[15m]))
            / sum(rate(mx_p2p_list_sources_total[15m]))
            > {{ $t.grpcErrorRatio | default 0.05 }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Source lookups are failing on the client
{{- end }}
{{- end }}
