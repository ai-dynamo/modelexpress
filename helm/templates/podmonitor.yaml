{{- if and .Values.metrics .Values.metrics.podMonitor .Values.metrics.podMonitor.enabled -}}
{{- /*
  A PodMonitor with no endpoint behind it is worse than none: the target reports
  down forever and reads as a crashed pod rather than a disabled feature.
*/}}
{{- if not .Values.metrics.enabled }}
{{- fail "metrics.podMonitor.enabled requires metrics.enabled: the PodMonitor would point at a port the server was never told to listen on." }}
{{- end }}
{{- /*
  Rendering nothing when the CRD is absent is the conventional gate, and it
  reproduces exactly the failure this resource exists to fix -- an operator
  believing scraping is configured while nothing collects. Asking for a
  PodMonitor on a cluster that cannot hold one is a mistake worth surfacing at
  install time. Set skipApiVersionCheck when the Operator's CRDs land in the
  same apply as this chart, which is the one case the check gets wrong.
*/}}
{{- if not (or .Values.metrics.podMonitor.skipApiVersionCheck (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1")) }}
{{- fail "metrics.podMonitor.enabled but monitoring.coreos.com/v1 is not available: install the Prometheus Operator, or use metrics.podAnnotations if your Prometheus scrapes pod annotations, or set metrics.podMonitor.skipApiVersionCheck=true if the CRDs are applied alongside this chart." }}
{{- end }}
{{- include "modelexpress.checkScrapeTimeout" (list .Values.metrics.podMonitor.interval .Values.metrics.podMonitor.scrapeTimeout "metrics.podMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "modelexpress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modelexpress.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "modelexpress.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    {{- /* Selected by port name, so it tracks metrics.port automatically. */}}
    - port: metrics
      path: /metrics
      {{- with .Values.metrics.podMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.metrics.podMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with .Values.metrics.podMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
