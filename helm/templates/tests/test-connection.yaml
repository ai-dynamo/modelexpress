{{- $tls := .Values.tls | default dict }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "modelexpress.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modelexpress.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: grpc-health-probe
    image: ghcr.io/grpc-ecosystem/grpc-health-probe:v0.4.35
    command: ['/ko-app/grpc-health-probe']
    args:
    - '-addr={{ include "modelexpress.fullname" . }}:{{ .Values.service.port | default 8001 }}'
    {{- if $tls.enabled }}
    - '-tls'
    {{- if $tls.caKey }}
    - '-tls-ca-cert=/etc/modelexpress/tls/ca.crt'
    - '-tls-server-name={{ include "modelexpress.fullname" . }}.{{ .Release.Namespace }}.svc'
    {{- else }}
    - '-tls-no-verify'
    {{- end }}
    {{- end }}
    {{- if and $tls.enabled $tls.caKey }}
    volumeMounts:
    - name: tls-ca
      mountPath: /etc/modelexpress/tls
      readOnly: true
    {{- end }}
  {{- if and $tls.enabled $tls.caKey }}
  volumes:
  - name: tls-ca
    secret:
      secretName: {{ $tls.secretName }}
      items:
      - key: {{ $tls.caKey }}
        path: ca.crt
  {{- end }}
  restartPolicy: Never
