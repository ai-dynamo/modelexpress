# Production values for ModelExpress
replicaCount: 3

image:
  repository: nvcr.io/nvidia/ai-dynamo/modelexpress-server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  automount: true

# Scrape annotations are generated from .Values.metrics (see values.yaml); do not
# hand-write prometheus.io/port here. It used to be pinned to "8001", the tonic
# gRPC listener — tonic is HTTP/2 only, so every server pod reported up == 0
# permanently.
podAnnotations: {}

podLabels: {}

service:
  type: ClusterIP
  port: 8001

metrics:
  enabled: true
  port: 9401
  podAnnotations: true

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: modelexpress.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: modelexpress-tls
      hosts:
        - modelexpress.yourdomain.com

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

persistence:
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: 100Gi
  mountPath: /root

env:
  MODEL_EXPRESS_SERVER_PORT: "8001"
  MODEL_EXPRESS_LOG_LEVEL: "info"
  MODEL_EXPRESS_CACHE_DIRECTORY: "/root"
  MX_METADATA_BACKEND: "redis"
  REDIS_URL: "redis://redis:6379"

livenessProbe:
  enabled: true
  tcpSocket:
    port: 8001
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 8001
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector:
  node-type: "compute"

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "model-serving"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - modelexpress
          topologyKey: kubernetes.io/hostname

extraEnv:
  - name: MODEL_EXPRESS_ENVIRONMENT
    value: "production"
  - name: MODEL_EXPRESS_MAX_CONCURRENT_REQUESTS
    value: "100"
