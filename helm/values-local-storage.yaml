# Values for testing gRPC file transfer without shared storage (no PVC)
# This configuration uses emptyDir volumes instead of PersistentVolumeClaims,
# which means the server and client have isolated storage and must transfer
# files via gRPC streaming.

replicaCount: 1

image:
  repository: modelexpress
  pullPolicy: IfNotPresent
  tag: "test"

# No image pull secrets needed for local testing
imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  automount: true
  rbac:
    enabled: true

podAnnotations: {}

podLabels: {}

# Deliberately no securityContext override: this file is what CI deploys, so it
# has to exercise the same non-root defaults from values.yaml that a plain
# `helm install ./helm` gets. Overriding them here is exactly what let the
# default path regress unnoticed.

service:
  type: ClusterIP
  port: 8001

ingress:
  enabled: false

# Minimal resources for testing
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Disable PVC-based persistence - use emptyDir instead
persistence:
  enabled: false

# Use emptyDir for ephemeral storage (server-side cache)
extraVolumes:
  - name: model-cache
    emptyDir:
      sizeLimit: 2Gi

extraVolumeMounts:
  - name: model-cache
    mountPath: /app/cache

env:
  MODEL_EXPRESS_SERVER_PORT: "8001"
  MODEL_EXPRESS_LOG_LEVEL: "debug"
  MODEL_EXPRESS_CACHE_DIRECTORY: "/app/cache"
  # HOME is left to the image (/home/modelexpress, owned by uid 1000) so the
  # HuggingFace fallback cache lands somewhere the non-root server can write.
  # Drives both P2P and registry: P2P uses ModelMetadata CRs, registry uses
  # ModelCacheEntry CRs in the same namespace.
  MX_METADATA_BACKEND: "kubernetes"

# Inject pod namespace so the Kubernetes metadata backend uses the correct namespace
extraEnv:
  - name: MX_METADATA_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  # Uncomment to enable HuggingFace downloads (private/gated models):
  #   kubectl create secret generic hf-token-secret --from-literal=HF_TOKEN=<your-token>
  # - name: HF_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: hf-token-secret
  #       key: HF_TOKEN
  # Uncomment to enable NGC model downloads:
  #   kubectl create secret generic ngc-api-key-secret --from-literal=NGC_API_KEY=<your-key>
  # - name: NGC_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: ngc-api-key-secret
  #       key: NGC_API_KEY

livenessProbe:
  enabled: true
  tcpSocket:
    port: 8001
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 8001
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

args: []

command: []
