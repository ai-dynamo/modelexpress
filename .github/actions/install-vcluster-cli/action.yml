name: 'Install vCluster CLI'
description: 'Download and install the vCluster CLI binary (architecture-aware)'

inputs:
  vcluster_version:
    description: 'vCluster CLI version to install'
    required: false
    default: 'v0.36.0'

runs:
  using: "composite"
  steps:
    - name: Install vCluster CLI
      shell: bash
      env:
        VCLUSTER_VERSION: ${{ inputs.vcluster_version }}
      run: |
        echo "::group::Install vCluster CLI ${VCLUSTER_VERSION}"
        if command -v vcluster &>/dev/null; then
          echo "vCluster CLI already installed: $(vcluster version)"
        else
          ARCH=$(uname -m)
          case "${ARCH}" in
            x86_64)  VCLUSTER_ARCH="amd64" ;;
            aarch64) VCLUSTER_ARCH="arm64" ;;
            *)       echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
          esac
          TMP_BIN="$(mktemp -p /tmp vcluster.XXXXXX)"
          for attempt in 1 2 3 4 5 6; do
            if HTTP_STATUS=$(curl --connect-timeout 10 --max-time 120 \
              --fail --show-error -sL --write-out '%{http_code}' \
              -o "${TMP_BIN}" \
              "https://github.com/loft-sh/vcluster/releases/download/${VCLUSTER_VERSION}/vcluster-linux-${VCLUSTER_ARCH}"); then
              break
            else
              status=$?
            fi
            case "${status}:${HTTP_STATUS}" in
              5:*|6:*|7:*|18:*|28:*|35:*|52:*|55:*|56:*|22:408|22:429|22:500|22:502|22:503|22:504)
                if [ "$attempt" -eq 6 ]; then
                  exit "$status"
                fi
                echo "Download failed with curl exit ${status}, HTTP ${HTTP_STATUS}; retrying in 2s"
                sleep 2
                ;;
              *) exit "$status" ;;
            esac
          done
          sudo install -m 0755 "${TMP_BIN}" /usr/local/bin/vcluster
          rm -f "${TMP_BIN}"
          vcluster version
        fi
        echo "::endgroup::"
