name: ModelExpress E2E CI

on:
  # copy-pr-bot mediated trigger. Direct `pull_request:` events are forbidden
  # on self-hosted runners (PR-head code is untrusted); copy-pr-bot
  # copies a PR's content to `pull-request/<N>` in this repo AFTER a
  # maintainer approves (or all commits are GPG-signed by Nvidians), and
  # the push to that internal branch is what fires this workflow.
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read
  pull-requests: read

jobs:
  inference-tests:
    name: Inference
    uses: ./.github/workflows/modelexpress-inference-ci.yml
    secrets: inherit

  rl-tests:
    name: RL
    uses: ./.github/workflows/modelexpress-rl-ci.yml
    with:
      model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
      scenario: delta
      sha: ${{ github.sha }}
      runtime: ${{ fromJSON(vars.MX_BENCH_RUNTIME_BASES || '{}').nemotron || '' }}
    secrets: inherit

  ci-status-check:
    name: CI status check
    runs-on: ubuntu-latest
    needs: [inference-tests, rl-tests]
    if: always()
    steps:
      - name: Inference and RL tests succeeded
        run: |
          echo '${{ toJson(needs) }}' \
            | jq -e 'to_entries | map(.value.result) | all(. == "success")'
