name: Trigger CI for modelexpress

on:
  push:
    branches:
      - main
      - 'release/*.*.*'
  pull_request:
    branches:
      - main
      - 'release/*.*.*'

# Autocancel any previous check runs for the same pull request to avoid redundant workflows.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirror_repo:
    name: Mirror Repository to GitLab
    # Upstream-only: mirrors to ai-dynamo's GitLab using secrets a fork does not have.
    # Fork PRs also do not receive repository secrets, so the mirror/trigger jobs
    # would fail with empty PROJECT_ACCESS_TOKEN/MIRROR_URL/PIPELINE_* values.
    if: >-
      github.repository == 'ai-dynamo/modelexpress'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    environment: GITLAB
    runs-on: gitlab
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Sync Mirror Repository
        env:
          PROJECT_ACCESS_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
        run: ./.github/workflows/mirror_repo.sh "$PROJECT_ACCESS_TOKEN" "$MIRROR_URL"

  trigger_ci:
    name: Trigger CI Pipeline
    needs: mirror_repo
    environment: GITLAB
    runs-on: gitlab
    steps:
      - name: Trigger GitLab pipeline
        env:
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          PIPELINE_URL: ${{ secrets.PIPELINE_URL }}
        run: |
          echo "Triggering GitLab pipeline for ref: $REF"

          curl --fail-with-body \
            --request POST \
            --form token="$PIPELINE_TOKEN" \
            --form ref="$REF" \
            "$PIPELINE_URL"
