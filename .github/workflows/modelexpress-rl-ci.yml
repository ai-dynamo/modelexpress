name: ModelExpress RL CI

on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      pull_request:
        type: number
        default: 0
      model:
        type: string
        required: true
      scenario:
        type: string
        default: delta
      sha:
        type: string
        required: true
      runtime:
        type: string
        default: ""
    secrets:
      NGC_API_KEY:
        required: true
      HF_TOKEN:
        required: false

permissions:
  contents: read

env:
  KUBECONFIG: /teleport/kubeconfig.yaml
  KUBE_CONTEXT: ${{ vars.MX_BENCH_KUBE_CONTEXT || 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02' }}
  NAMESPACE: mx-ci-bench-${{ github.run_id }}-${{ github.run_attempt }}
  MX_IMAGE_REPO: nvcr.io/0980761089281446
  VIME_DYNAMO_REF: c3e05f0244ae6264d7953f68e2499c6dc2f54723
  RESULTS_DIR: ${{ github.workspace }}/bench-results

jobs:
  authorize:
    concurrency:
      group: bench-pr-${{ github.event.issue.number }}-authorize
      cancel-in-progress: true
    name: RL refit authorization
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'ai-dynamo/modelexpress' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/bench' || startsWith(github.event.comment.body, '/bench '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      model: ${{ steps.gate.outputs.model }}
      scenario: ${{ steps.gate.outputs.scenario }}
    steps:
      # issue_comment uses default-branch code. Never check out PR code here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate caller and copy-pr-bot mirror
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/bench/scripts/comment_gate.py

  validate:
    needs: authorize
    if: ${{ !cancelled() && (github.event_name != 'issue_comment' || needs.authorize.result == 'success') }}
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pull_request || github.event.issue.number || github.ref_name }}-rl-refit-validate
      cancel-in-progress: true
    name: RL refit validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      harness_sha: ${{ steps.inputs.outputs.harness_sha }}
      sha: ${{ steps.inputs.outputs.sha }}
      scenario: ${{ steps.inputs.outputs.scenario }}
      gpu_slot: ${{ steps.inputs.outputs.gpu_slot }}
      model: ${{ steps.inputs.outputs.model }}
      runtime: ${{ steps.inputs.outputs.runtime }}
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'push' && inputs.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate immutable source and registered experiment
        id: inputs
        env:
          TEST_SHA: ${{ inputs.sha || needs.authorize.outputs.sha }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.issue.number || 0 }}
          GH_TOKEN: ${{ github.token }}
          MODEL_PROFILE: ${{ inputs.model || needs.authorize.outputs.model }}
          SCENARIO: ${{ inputs.scenario || needs.authorize.outputs.scenario }}
          RUNTIME_BASE: ${{ inputs.runtime || fromJSON(vars.MX_BENCH_RUNTIME_BASES || '{}')[needs.authorize.outputs.model] || '' }}
        run: |
          python3 ci/bench/scripts/comment_gate.py --workflow-call
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c 'import os; number = int(os.environ["PR_NUMBER"]) or int(os.environ["GITHUB_REF"].rsplit("/", 1)[1]); print("gpu_slot=" + str(number % 4))' >> "$GITHUB_OUTPUT"

  build:
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pull_request || github.event.issue.number || github.ref_name }}-rl-refit-build
      cancel-in-progress: true
    name: RL refit build
    needs: validate
    runs-on: prod-modelexpress-builder-amd-v1
    timeout-minutes: 60
    outputs:
      server: ${{ steps.images.outputs.server }}
      worker: ${{ steps.images.outputs.worker }}
      cleanup: ${{ steps.images.outputs.cleanup }}
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.harness_sha }}
          persist-credentials: false
      - name: Checkout approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build images from the approved revision
        id: images
        env:
          CACHE_SCOPE: ${{ inputs.pull_request || github.event.issue.number || github.ref_name }}
          TEST_SHA: ${{ needs.validate.outputs.sha }}
          RUNTIME_BASE: ${{ needs.validate.outputs.runtime }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          echo "$NGC_API_KEY" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          cache_tag="buildcache-${CACHE_SCOPE//\//-}"
          repo=nvcr.io/0980761089281446
          server="$repo/mx-bench-server:$TEST_SHA"
          worker="$repo/mx-bench-worker:$TEST_SHA"
          cleanup="$repo/mx-bench-cleanup:$TEST_SHA"
          docker buildx build --platform linux/amd64 -f ci/k8s/server/Dockerfile.server \
            --cache-from "type=registry,ref=$repo/mx-bench-server:$cache_tag" \
            --cache-to "type=registry,ref=$repo/mx-bench-server:$cache_tag,mode=max,ignore-error=true" \
            -t "$server" --metadata-file server-build.json --push candidate
          docker buildx build --platform linux/amd64 -f ci/bench/Dockerfile \
            --cache-from "type=registry,ref=$repo/mx-bench-worker:$cache_tag" \
            --cache-to "type=registry,ref=$repo/mx-bench-worker:$cache_tag,mode=max,ignore-error=true" \
            --build-arg "RUNTIME_BASE=$RUNTIME_BASE" -t "$worker" \
            --metadata-file worker-build.json --push candidate
          docker buildx build --platform linux/amd64 -f ci/bench/Dockerfile.cleanup \
            --cache-from "type=registry,ref=$repo/mx-bench-cleanup:$cache_tag" \
            --cache-to "type=registry,ref=$repo/mx-bench-cleanup:$cache_tag,mode=max,ignore-error=true" \
            -t "$cleanup" --metadata-file cleanup-build.json --push candidate
          echo "cleanup=$repo/mx-bench-cleanup@$(jq -r '."containerimage.digest"' cleanup-build.json)" >> "$GITHUB_OUTPUT"
          echo "server=$repo/mx-bench-server@$(jq -r '."containerimage.digest"' server-build.json)" >> "$GITHUB_OUTPUT"
          echo "worker=$repo/mx-bench-worker@$(jq -r '."containerimage.digest"' worker-build.json)" >> "$GITHUB_OUTPUT"

  test:
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' }}
    concurrency:
      group: ${{ vars.MX_CI_GPU_CONCURRENCY == '1' && format('modelexpress-rl-gpu-{0}', vars.MX_BENCH_KUBE_CONTEXT || 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02') || vars.MX_CI_GPU_CONCURRENCY == '2' && format('modelexpress-rl-gpu-{0}-refit', vars.MX_BENCH_KUBE_CONTEXT || 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02') || format('modelexpress-rl-gpu-{0}-slot-{1}', vars.MX_BENCH_KUBE_CONTEXT || 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02', needs.validate.outputs.gpu_slot) }}
      queue: max
      cancel-in-progress: false
    name: "RL refit (${{ needs.validate.outputs.model }})"
    needs: [validate, build]
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 120
    env:
      MX_CI_GPU_CONCURRENCY: ${{ vars.MX_CI_GPU_CONCURRENCY || '4' }}
      MX_CI_GPU_LANE: ${{ vars.MX_CI_GPU_CONCURRENCY == '1' && 'all' || vars.MX_CI_GPU_CONCURRENCY == '2' && 'refit' || format('slot-{0}', needs.validate.outputs.gpu_slot) }}
      MODEL_PROFILE: ${{ needs.validate.outputs.model }}
      SCENARIO: ${{ needs.validate.outputs.scenario }}
      RUN_ID: ${{ needs.validate.outputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_IMAGE: ${{ needs.build.outputs.server }}
      WORKER_IMAGE: ${{ needs.build.outputs.worker }}
      CLEANUP_IMAGE: ${{ needs.build.outputs.cleanup }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.harness_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install manifest parser
        run: python3 -m pip install pyyaml
      - name: Wait for previous RL GPU workload cleanup
        run: |
          source .github/scripts/ci-kubectl.sh
          wait_for_gpu_pool_cleanup rl
      - name: Provision storage and profile-sized namespace
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 ci/bench/scripts/ci.py setup
      - name: Verify refitted GPU weights and measure cold-load and refit latency
        timeout-minutes: 45
        run: python3 ci/bench/scripts/ci.py run
      - name: Collect missing run evidence
        if: ${{ always() && hashFiles('bench-results/report.json') == '' }}
        run: python3 ci/bench/scripts/ci.py collect
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 14
      - name: Record tested revision
        if: always()
        env:
          TEST_SHA: ${{ needs.validate.outputs.sha }}
        run: echo "RL weight refit CI of $TEST_SHA; evidence is attached to this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove owned workload before releasing GPU admission
        if: always()
        run: python3 ci/bench/scripts/ci.py cleanup

  # Keep queued and running cleanup outside the cancellation groups.
  cleanup:
    name: RL refit cleanup
    needs: [validate, build, test]
    if: ${{ always() && needs.build.result == 'success' && needs.test.result != 'skipped' }}
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 15
    env:
      MODEL_PROFILE: ${{ needs.validate.outputs.model }}
      SCENARIO: ${{ needs.validate.outputs.scenario }}
      RUN_ID: ${{ needs.validate.outputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_IMAGE: ${{ needs.build.outputs.server }}
      WORKER_IMAGE: ${{ needs.build.outputs.worker }}
      CLEANUP_IMAGE: ${{ needs.build.outputs.cleanup }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.harness_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install manifest parser
        run: python3 -m pip install pyyaml
      - name: Remove exact-run objects and owned namespace
        run: python3 ci/bench/scripts/ci.py cleanup
      - name: Save cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  build-vime-delta-refit:
    if: ${{ github.event_name != 'issue_comment' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}-build-vime-delta-refit
      cancel-in-progress: true
    name: RL Vime delta-refit build
    runs-on: prod-modelexpress-builder-amd-v1
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout pinned Dynamo nightly
        run: |
          rm -rf "${RUNNER_TEMP}/dynamo"
          git init --quiet "${RUNNER_TEMP}/dynamo"
          git -C "${RUNNER_TEMP}/dynamo" remote add origin \
            https://github.com/ai-dynamo/dynamo.git
          git -C "${RUNNER_TEMP}/dynamo" fetch --depth 1 --filter=blob:none \
            origin "${VIME_DYNAMO_REF}"
          git -C "${RUNNER_TEMP}/dynamo" checkout --detach FETCH_HEAD
          git -C "${RUNNER_TEMP}/dynamo" rev-parse HEAD

      - name: Log in to image registry
        run: |
          echo "${{ secrets.NGC_API_KEY }}" | \
            docker login nvcr.io -u '$oauthtoken' --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push trainer and rollout
        run: |
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 \
            -f examples/rl/vime_dynamo_delta_refit/Dockerfile \
            --cache-from "type=registry,ref=${MX_IMAGE_REPO}/vime-dynamo-mx-trainer:buildcache-${GITHUB_REF_NAME//\//-}" \
            --cache-to "type=registry,ref=${MX_IMAGE_REPO}/vime-dynamo-mx-trainer:buildcache-${GITHUB_REF_NAME//\//-},mode=max,ignore-error=true" \
            --target trainer --push \
            -t "${MX_IMAGE_REPO}/vime-dynamo-mx-trainer:${{ github.sha }}" .
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 \
            -f examples/rl/vime_dynamo_delta_refit/Dockerfile \
            --build-context dynamo="${RUNNER_TEMP}/dynamo" \
            --cache-from "type=registry,ref=${MX_IMAGE_REPO}/vime-dynamo-mx-worker:buildcache-${GITHUB_REF_NAME//\//-}" \
            --cache-to "type=registry,ref=${MX_IMAGE_REPO}/vime-dynamo-mx-worker:buildcache-${GITHUB_REF_NAME//\//-},mode=max,ignore-error=true" \
            --target worker --push \
            -t "${MX_IMAGE_REPO}/vime-dynamo-mx-worker:${{ github.sha }}" .

  # ---------------------------------------------------------------------------

  test-vime-delta-refit:
    concurrency:
      group: ${{ vars.MX_CI_GPU_CONCURRENCY == '1' && format('modelexpress-rl-gpu-{0}', 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02') || vars.MX_CI_GPU_CONCURRENCY == '2' && format('modelexpress-rl-gpu-{0}-vime', 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02') || format('modelexpress-rl-gpu-{0}-slot-{1}', 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02', 3) }}
      queue: max
      cancel-in-progress: false
    name: RL Vime delta-refit smoke
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 120
    needs: [build-vime-delta-refit]
    permissions:
      contents: read
    env:
      MX_CI_GPU_CONCURRENCY: ${{ vars.MX_CI_GPU_CONCURRENCY || '4' }}
      MX_CI_GPU_LANE: ${{ vars.MX_CI_GPU_CONCURRENCY == '1' && 'all' || vars.MX_CI_GPU_CONCURRENCY == '2' && 'vime' || format('slot-{0}', 3) }}
      KUBE_CONTEXT: nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02
      NAMESPACE: mx-ci-h100-vime-${{ github.run_id }}-${{ github.run_attempt }}
      WORKER_IMAGE: nvcr.io/0980761089281446/vime-dynamo-mx-worker:${{ github.sha }}
      TRAINER_IMAGE: nvcr.io/0980761089281446/vime-dynamo-mx-trainer:${{ github.sha }}
      MODEL_SUBPATH: Qwen/Qwen3-0.6B

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Wait for previous RL GPU workload cleanup
        run: |
          source .github/scripts/ci-kubectl.sh
          wait_for_gpu_pool_cleanup rl

      - name: Prepare direct H100 workload
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          kc=(kubectl --kubeconfig=/teleport/kubeconfig.yaml --context="$KUBE_CONTEXT")
          k=("${kc[@]}" --namespace="$NAMESPACE")
          "${kc[@]}" config get-contexts "$KUBE_CONTEXT" -o name | grep -qx "$KUBE_CONTEXT"
          "${kc[@]}" create namespace "$NAMESPACE" --dry-run=client -o yaml \
            | "${kc[@]}" label --local -f - \
                ci.modelexpress.nvidia.com/run-id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                ci.modelexpress.nvidia.com/gpu-lane="$MX_CI_GPU_LANE" \
                -o yaml \
            | "${kc[@]}" create -f -
          "${k[@]}" create quota vime-delta-refit-gpu-budget \
            --hard=requests.nvidia.com/gpu=3,limits.nvidia.com/gpu=3
          "${k[@]}" create secret docker-registry nvcr-imagepullsecret \
            --docker-server=nvcr.io \
            --docker-username="\$oauthtoken" \
            --docker-password="$NGC_API_KEY"
          "${k[@]}" create secret generic mx-s3-creds \
            --from-literal=AWS_ACCESS_KEY_ID=delta-refit \
            --from-literal=AWS_SECRET_ACCESS_KEY=delta-refit-smoke
          "${k[@]}" create secret generic hf-token-secret \
            --from-literal=HF_TOKEN="$HF_TOKEN"
          "${k[@]}" wait --for=create persistentvolumeclaim/shared-model-cache --timeout=2m
          "${k[@]}" wait --for=jsonpath='{.status.phase}'=Bound \
            persistentvolumeclaim/shared-model-cache --timeout=5m
          sed "s|WORKER_IMAGE|$WORKER_IMAGE|g" ci/rl/model-download.yaml \
            | "${k[@]}" create -f -
          "${k[@]}" wait --for=condition=complete \
            job/vime-delta-refit-model-download --timeout=20m

      - name: Run Kubernetes Vime delta-refit smoke
        run: ci/rl/smoke_vime_delta_refit.sh

      - name: Dump direct H100 diagnostics
        if: failure()
        run: |
          k=(kubectl --kubeconfig=/teleport/kubeconfig.yaml \
            --context="$KUBE_CONTEXT" --namespace="$NAMESPACE")
          "${k[@]}" get pods,jobs,deployments,services,dynamographdeployments -o wide || true
          "${k[@]}" describe dynamographdeployment/vime-delta-refit || true
          "${k[@]}" get events --sort-by='.lastTimestamp' || true
          for pod in $("${k[@]}" get pods -o name 2>/dev/null); do
            "${k[@]}" describe "$pod" | tail -60 || true
            "${k[@]}" logs "$pod" --all-containers --tail=200 || true
          done

      - name: Reap direct H100 workload
        if: always()
        run: |
          kc=(kubectl --kubeconfig=/teleport/kubeconfig.yaml --context="$KUBE_CONTEXT")
          owner=$("${kc[@]}" get namespace "$NAMESPACE" --ignore-not-found \
            -o go-template='{{ index .metadata.labels "ci.modelexpress.nvidia.com/run-id" }}')
          if [ "$owner" = "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            "${kc[@]}" delete namespace "$NAMESPACE" --wait=true --timeout=180s
          fi


  test-vime-delta-refit-cleanup:
    name: RL Vime delta-refit cleanup
    runs-on: prod-deploy-tester-v1
    needs: [test-vime-delta-refit]
    if: ${{ always() && github.event_name != 'issue_comment' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      KUBE_CONTEXT: nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02
      NAMESPACE: mx-ci-h100-vime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Delete direct H100 workload namespace
        run: |
          set -euo pipefail
          kc=(kubectl --kubeconfig=/teleport/kubeconfig.yaml --context="$KUBE_CONTEXT")
          owner=$("${kc[@]}" get namespace "$NAMESPACE" --ignore-not-found \
            -o go-template='{{ index .metadata.labels "ci.modelexpress.nvidia.com/run-id" }}')
          if [ -z "$owner" ]; then
            exit 0
          fi
          if [ "$owner" != "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]; then
            echo "Refusing to delete $NAMESPACE owned by $owner" >&2
            exit 1
          fi
          "${kc[@]}" delete namespace "$NAMESPACE" --wait=true --timeout=180s


  status-check:
    name: RL status check
    runs-on: ubuntu-latest
    needs: [validate, build, test, cleanup, build-vime-delta-refit, test-vime-delta-refit, test-vime-delta-refit-cleanup]
    if: ${{ always() && (github.event_name != 'issue_comment' || needs.validate.result != 'skipped') }}
    steps:
      - name: All selected RL jobs succeeded
        env:
          COMMENT_RUN: ${{ github.event_name == 'issue_comment' }}
        run: |
          echo '${{ toJson(needs) }}' \
            | jq -e --arg comment "$COMMENT_RUN" 'to_entries | map(select($comment != "true" or (.key | contains("vime") | not))) | map(.value.result) | all(. == "success")'
