name: ModelExpress RL CI

on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      runs_on:
        description: Runner for control jobs; GPU jobs retain their dedicated runners.
        type: string
        default: ''
      upload_evidence:
        description: Upload test evidence to GitHub; nightlies retain only compliance artifacts.
        type: boolean
        default: true
      pull_request:
        type: number
        default: 0
      model:
        type: string
        required: true
      scenario:
        type: string
        default: delta
      sha:
        type: string
        required: true
      runtime:
        type: string
        default: ""
    secrets:
      NGC_API_KEY:
        required: true
      HF_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'issue_comment' }}

env:
  MX_IMAGE_REPO: nvcr.io/0980761089281446
  VIME_DYNAMO_REF: c3e05f0244ae6264d7953f68e2499c6dc2f54723

jobs:
  validate:
    if: >-
      !cancelled() &&
      (github.event_name != 'issue_comment' ||
       (github.repository == 'ai-dynamo/modelexpress' &&
        github.event.issue.pull_request &&
        (github.event.comment.body == '/bench' || startsWith(github.event.comment.body, '/bench '))))
    name: RL generator-only refit validation
    runs-on: ${{ inputs.runs_on || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      harness_sha: ${{ steps.inputs.outputs.harness_sha }}
      sha: ${{ steps.inputs.outputs.sha }}
      scenario: ${{ steps.inputs.outputs.scenario }}
      gpu_slot: ${{ steps.inputs.outputs.gpu_slot }}
      gpu_limit: ${{ steps.inputs.outputs.gpu_limit }}
      vime_gpu_slot: ${{ steps.inputs.outputs.vime_gpu_slot }}
      primerl_gpu_slot: ${{ steps.inputs.outputs.primerl_gpu_slot }}
      model: ${{ steps.inputs.outputs.model }}
      runtime: ${{ steps.inputs.outputs.runtime }}
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'push' && inputs.sha || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.sha || github.event.repository.default_branch) }}
          persist-credentials: false
      - name: Authorize /bench caller and copy-pr-bot mirror
        if: ${{ github.event_name == 'issue_comment' }}
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/bench/scripts/comment_gate.py
      - name: Validate immutable source and registered experiment
        id: inputs
        env:
          KUBE_CONTEXT: ${{ vars.MX_BENCH_KUBE_CONTEXT || 'nv-prd-dgxc.teleport.sh-dynamo-aws-dev-02' }}
          TEST_SHA: ${{ inputs.sha || steps.gate.outputs.sha }}
          MX_CI_RL_GPU_CONCURRENCY: ${{ vars.MX_CI_RL_GPU_CONCURRENCY || '4' }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.issue.number || 0 }}
          GH_TOKEN: ${{ github.token }}
          MODEL_PROFILE: ${{ inputs.model || steps.gate.outputs.model }}
          SCENARIO: ${{ inputs.scenario || steps.gate.outputs.scenario }}
          RUNTIME_BASE: ${{ inputs.runtime || fromJSON(vars.MX_BENCH_RUNTIME_BASES || '{}')[steps.gate.outputs.model] || '' }}
        run: |
          python3 ci/bench/scripts/comment_gate.py --workflow-call
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import os
          count = int(os.environ["MX_CI_RL_GPU_CONCURRENCY"])
          if not 1 <= count <= 16:
              raise SystemExit("MX_CI_RL_GPU_CONCURRENCY must be between 1 and 16")
          number = int(os.environ["PR_NUMBER"]) or int(os.environ["GITHUB_RUN_ID"] if os.environ["GITHUB_EVENT_NAME"] in {"schedule", "workflow_dispatch"} else os.environ["GITHUB_REF"].rsplit("/", 1)[1])
          print(f"gpu_limit={count}")
          print(f"gpu_slot={number % count}")
          print(f"vime_gpu_slot={(number + 1) % count}")
          print(f"primerl_gpu_slot={(number + 2) % count}")
          PYTHON

  build-generator-only:
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    name: RL generator-only refit build
    needs: validate
    runs-on: prod-modelexpress-builder-amd-v1
    timeout-minutes: 60
    outputs:
      server_image: ${{ steps.images.outputs.server_image }}
      worker_image: ${{ steps.images.outputs.worker_image }}
      cleanup_image: ${{ steps.images.outputs.cleanup_image }}
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.harness_sha }}
          persist-credentials: false
      - name: Checkout approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build images from the approved revision
        id: images
        env:
          TEST_SHA: ${{ needs.validate.outputs.sha }}
          RUNTIME_BASE: ${{ needs.validate.outputs.runtime }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          echo "$NGC_API_KEY" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          repo=nvcr.io/0980761089281446
          server="$repo/mx-bench-server:$TEST_SHA"
          worker="$repo/mx-bench-worker:$TEST_SHA"
          cleanup="$repo/mx-bench-cleanup:$TEST_SHA"
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 -f ci/k8s/server/Dockerfile.server \
            --cache-from "type=registry,ref=$repo/mx-bench-server:buildcache-shared" \
            --cache-to "type=registry,ref=$repo/mx-bench-server:buildcache-shared,mode=max,ignore-error=true" \
            -t "$server" --metadata-file server-build.json --push candidate
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 -f ci/bench/Dockerfile \
            --cache-from "type=registry,ref=$repo/mx-bench-worker:buildcache-shared" \
            --cache-to "type=registry,ref=$repo/mx-bench-worker:buildcache-shared,mode=max,ignore-error=true" \
            --build-arg "RUNTIME_BASE=$RUNTIME_BASE" -t "$worker" \
            --metadata-file worker-build.json --push candidate
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 -f ci/bench/Dockerfile.cleanup \
            --provenance=false \
            --cache-from "type=registry,ref=$repo/mx-bench-cleanup:buildcache-shared" \
            --cache-to "type=registry,ref=$repo/mx-bench-cleanup:buildcache-shared,mode=max,ignore-error=true" \
            -t "$cleanup" --metadata-file cleanup-build.json --push candidate
          echo "cleanup_image=$repo/mx-bench-cleanup@$(jq -r '."containerimage.digest"' cleanup-build.json)" >> "$GITHUB_OUTPUT"
          echo "server_image=$repo/mx-bench-server@$(jq -r '."containerimage.digest"' server-build.json)" >> "$GITHUB_OUTPUT"
          echo "worker_image=$repo/mx-bench-worker@$(jq -r '."containerimage.digest"' worker-build.json)" >> "$GITHUB_OUTPUT"

  test-generator-only:
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build-generator-only.result == 'success' }}
    name: GPU
    needs: [validate, build-generator-only]
    uses: ./.github/workflows/modelexpress-rl-generator-only-gpu-ci.yml
    secrets: inherit
    with:
      upload_evidence: ${{ github.event_name == 'issue_comment' || inputs.upload_evidence }}
      gpu_limit: ${{ needs.validate.outputs.gpu_limit }}
      gpu_slot: ${{ needs.validate.outputs.gpu_slot }}
      model: ${{ needs.validate.outputs.model }}
      scenario: ${{ needs.validate.outputs.scenario }}
      sha: ${{ needs.validate.outputs.sha }}
      harness_sha: ${{ needs.validate.outputs.harness_sha }}
      server_image: ${{ needs.build-generator-only.outputs.server_image }}
      worker_image: ${{ needs.build-generator-only.outputs.worker_image }}
      cleanup_image: ${{ needs.build-generator-only.outputs.cleanup_image }}

  build-vime:
    name: RL Vime delta-refit build
    needs: validate
    if: ${{ !cancelled() && github.event_name != 'issue_comment' && needs.validate.result == 'success' }}
    runs-on: prod-modelexpress-builder-amd-v1
    timeout-minutes: 60
    outputs:
      trainer_image: ${{ steps.images.outputs.trainer_image }}
      worker_image: ${{ steps.images.outputs.worker_image }}
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.harness_sha }}
          persist-credentials: false
      - name: Checkout approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout pinned Dynamo nightly
        run: |
          rm -rf "${RUNNER_TEMP}/dynamo"
          git init --quiet "${RUNNER_TEMP}/dynamo"
          git -C "${RUNNER_TEMP}/dynamo" remote add origin https://github.com/ai-dynamo/dynamo.git
          git -C "${RUNNER_TEMP}/dynamo" fetch --depth 1 --filter=blob:none origin "${VIME_DYNAMO_REF}"
          git -C "${RUNNER_TEMP}/dynamo" checkout --detach FETCH_HEAD
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build candidate trainer and rollout
        id: images
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          TEST_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          echo "$NGC_API_KEY" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          trainer="$MX_IMAGE_REPO/vime-dynamo-mx-trainer"
          worker="$MX_IMAGE_REPO/vime-dynamo-mx-worker"
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 \
            -f examples/rl/vime_dynamo_delta_refit/Dockerfile \
            --cache-from "type=registry,ref=$trainer:buildcache-shared" \
            --cache-to "type=registry,ref=$trainer:buildcache-shared,mode=max,ignore-error=true" \
            --target trainer --metadata-file trainer-build.json --push -t "$trainer:$TEST_SHA" candidate &
          trainer_pid=$!
          worker_status=0
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 \
            -f examples/rl/vime_dynamo_delta_refit/Dockerfile \
            --build-context dynamo="${RUNNER_TEMP}/dynamo" \
            --cache-from "type=registry,ref=$worker:buildcache-shared" \
            --cache-to "type=registry,ref=$worker:buildcache-shared,mode=max,ignore-error=true" \
            --target worker --metadata-file worker-build.json --push -t "$worker:$TEST_SHA" candidate || worker_status=$?
          trainer_status=0
          wait "$trainer_pid" || trainer_status=$?
          if [ "$worker_status" -ne 0 ]; then exit "$worker_status"; fi
          if [ "$trainer_status" -ne 0 ]; then exit "$trainer_status"; fi
          echo "trainer_image=$trainer@$(jq -r '."containerimage.digest"' trainer-build.json)" >> "$GITHUB_OUTPUT"
          echo "worker_image=$worker@$(jq -r '."containerimage.digest"' worker-build.json)" >> "$GITHUB_OUTPUT"

  test-vime:
    name: GPU
    needs: [validate, build-vime]
    if: ${{ !cancelled() && github.event_name != 'issue_comment' && needs.validate.result == 'success' }}
    uses: ./.github/workflows/modelexpress-rl-vime-gpu-ci.yml
    secrets: inherit
    with:
      sha: ${{ needs.validate.outputs.sha }}
      harness_sha: ${{ needs.validate.outputs.harness_sha }}
      worker_image: ${{ needs.build-vime.outputs.worker_image }}
      trainer_image: ${{ needs.build-vime.outputs.trainer_image }}
      gpu_limit: ${{ needs.validate.outputs.gpu_limit }}
      gpu_slot: ${{ needs.validate.outputs.vime_gpu_slot }}
      upload_evidence: ${{ inputs.upload_evidence }}

  build-primerl:
    needs: validate
    if: ${{ !cancelled() && github.event_name != 'issue_comment' && needs.validate.result == 'success' }}
    name: PrimeRL dev140 build
    runs-on: prod-modelexpress-builder-amd-v1
    timeout-minutes: 60
    outputs:
      worker_image: ${{ steps.image.outputs.worker_image }}
    steps:
      - name: Checkout trusted harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.harness_sha }}
          persist-credentials: false
      - name: Checkout approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout pinned upstream tests
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: PrimeIntellect-ai/prime-rl
          ref: 0790ebb5d856860d916b270bda4884184ce9d786 # v0.10.1.dev140
          path: prime-rl
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build candidate client and server on PrimeRL dev140
        id: image
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          TEST_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          echo "$NGC_API_KEY" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          image=nvcr.io/0980761089281446/mx-primerl-ci
          bash .github/scripts/build-with-registry-retry.sh --platform linux/amd64 \
            -f ci/rl/primerl/Dockerfile \
            --build-context prime-rl=prime-rl \
            --cache-from "type=registry,ref=$image:buildcache-shared" \
            --cache-to "type=registry,ref=$image:buildcache-shared,mode=max,ignore-error=true" \
            --metadata-file primerl-build.json --push -t "$image:$TEST_SHA" candidate
          echo "worker_image=$image@$(jq -r '."containerimage.digest"' primerl-build.json)" >> "$GITHUB_OUTPUT"

  test-primerl:
    name: GPU
    needs: [validate, build-primerl]
    if: ${{ !cancelled() && github.event_name != 'issue_comment' && needs.validate.result == 'success' }}
    uses: ./.github/workflows/modelexpress-rl-primerl-gpu-ci.yml
    secrets: inherit
    with:
      sha: ${{ needs.validate.outputs.sha }}
      harness_sha: ${{ needs.validate.outputs.harness_sha }}
      worker_image: ${{ needs.build-primerl.outputs.worker_image }}
      gpu_limit: ${{ needs.validate.outputs.gpu_limit }}
      gpu_slot: ${{ needs.validate.outputs.primerl_gpu_slot }}
      upload_evidence: ${{ inputs.upload_evidence }}

  status-check:
    name: RL status check
    runs-on: ${{ inputs.runs_on || 'ubuntu-24.04' }}
    needs: [validate, build-generator-only, test-generator-only, build-vime, test-vime, build-primerl, test-primerl]
    if: ${{ always() && (github.event_name != 'issue_comment' || needs.validate.result != 'skipped') }}
    steps:
      - name: Benchmark jobs succeeded
        run: |
          echo '${{ toJson(needs) }}' \
            | jq -e 'all(.validate, .["build-generator-only"], .["test-generator-only"]; .result == "success")'
      - name: Training integration jobs succeeded
        if: github.event_name != 'issue_comment'
        run: |
          echo '${{ toJson(needs) }}' \
            | jq -e 'all(.["build-vime"], .["test-vime"],
                .["build-primerl"], .["test-primerl"]; .result == "success")'
