name: ModelExpress Inference GPU CI

on:
  workflow_call:
    inputs:
      framework:
        description: Test group whose required worker images are ready.
        type: string
        required: true
      runs_on:
        description: Runner for control jobs; GPU jobs retain their dedicated runners.
        type: string
        default: ''

env:
  MX_CI_MODEL: Qwen/Qwen2.5-0.5B
  VCLUSTER_NAME: mx-ci-cluster
  VCLUSTER_NAMESPACE: mx-ci
  MX_IMAGE_REPO: nvcr.io/0980761089281446
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: http.lowSpeedLimit
  GIT_CONFIG_VALUE_0: "1"
  GIT_CONFIG_KEY_1: http.lowSpeedTime
  GIT_CONFIG_VALUE_1: "60"

jobs:
  admission-slots:
    runs-on: ${{ inputs.runs_on || 'ubuntu-24.04' }}
    outputs:
      slots: ${{ steps.slots.outputs.slots }}
      count: ${{ steps.slots.outputs.count }}
      a100b_slots: ${{ steps.slots.outputs.a100b_slots }}
      a100b_count: ${{ steps.slots.outputs.a100b_count }}
    steps:
      - id: slots
        env:
          MX_CI_GPU_CONCURRENCY: ${{ vars.MX_CI_GPU_CONCURRENCY || '8' }}
          MX_CI_A100B_CONCURRENCY: ${{ vars.MX_CI_A100B_CONCURRENCY || '1' }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          count = int(os.environ["MX_CI_GPU_CONCURRENCY"])
          if not 1 <= count <= 16:
              raise SystemExit("MX_CI_GPU_CONCURRENCY must be between 1 and 16")
          a100b_count = int(os.environ["MX_CI_A100B_CONCURRENCY"])
          if not 1 <= a100b_count <= 4:
              raise SystemExit("MX_CI_A100B_CONCURRENCY must be between 1 and 4")
          a100b_count = min(count, a100b_count)
          seed = int(os.environ["GITHUB_RUN_ID"] if os.environ["GITHUB_EVENT_NAME"] in {"schedule", "workflow_dispatch"} else os.environ["GITHUB_REF"].rsplit("/", 1)[1])
          print(f"count={count}")
          print("slots=" + json.dumps([(seed + i) % count for i in range(16)]))
          print(f"a100b_count={a100b_count}")
          print("a100b_slots=" + json.dumps([(seed + i) % a100b_count for i in range(4)]))
          PYTHON

  test:
    needs: admission-slots
    name: ${{ matrix.name }}
    concurrency:
      group: ${{ matrix.large && 'modelexpress-gpu-a100a-large-workload' || format('modelexpress-gpu-{0}-slot-{1}', matrix.pool, (matrix.pool == 'a100b' && fromJSON(needs.admission-slots.outputs.a100b_slots) || fromJSON(needs.admission-slots.outputs.slots))[matrix.gpu_slot]) }}
      queue: max
      cancel-in-progress: false
    runs-on: prod-modelexpress-builder-amd-v1
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MX_CI_GPU_POOL: ${{ matrix.pool }}
      MX_CI_GPU_CONCURRENCY: ${{ matrix.pool == 'a100b' && needs.admission-slots.outputs.a100b_count || needs.admission-slots.outputs.count }}
      MX_CI_GPU_LANE: ${{ matrix.large && 'large-workload' || format('slot-{0}', (matrix.pool == 'a100b' && fromJSON(needs.admission-slots.outputs.a100b_slots) || fromJSON(needs.admission-slots.outputs.slots))[matrix.gpu_slot]) }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON('
            {
              "vllm": [
                {
                  "framework": "vllm", "gpu_slot": 0, "namespace": "mx-ci-vllm", "manifest": "ci/k8s/client/vllm/manifest-azure.yaml",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target",
                  "source_port": "8001", "worker_port": "8002", "expected_artifact_sources": "1", "expected_artifact_source_types": "torch_compile_cache",
                  "pool": "a100a", "kind": "p2p", "name": "P2P test (vllm)"
                },
                {
                  "framework": "vllm", "gpu_slot": 1, "namespace": "mx-ci-vllm-mtp", "manifest": "ci/k8s/client/vllm/manifest-azure-mtp.yaml",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "pytest_args": "--expect-mtp", "model": "Qwen/Qwen3.5-0.8B",
                  "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target", "source_port": "8031", "worker_port": "8032", "pool": "a100a",
                  "kind": "p2p", "name": "P2P test (vllm MTP)"
                },
                {
                  "framework": "vllm", "gpu_slot": 4, "namespace": "mx-ci-full-manifest-same", "manifest": "ci/k8s/client/vllm/manifest-azure.yaml",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target",
                  "source_port": "8021", "worker_port": "8022", "mx_p2p_metadata": "0", "pool": "a100a", "kind": "p2p",
                  "name": "P2P test (vllm full-manifest same-version)"
                },
                {
                  "framework": "vllm", "gpu_slot": 5, "namespace": "mx-ci-full-manifest-mixed", "manifest": "ci/k8s/client/vllm/manifest-azure.yaml",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target",
                  "source_port": "8023", "worker_port": "8024", "mx_p2p_metadata": "0", "server_image": "nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.4.0",
                  "pool": "a100a", "kind": "p2p", "name": "P2P test (vllm full-manifest mixed-version)"
                },
                {
                  "framework": "vllm", "gpu_slot": 6, "namespace": "mx-ci-full-manifest-redis-same", "manifest": "ci/k8s/client/vllm/manifest-azure.yaml",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target",
                  "source_port": "8025", "worker_port": "8026", "mx_p2p_metadata": "0", "server_manifest": "ci/k8s/server/mx-server-redis.yaml", "pool": "a100a",
                  "kind": "p2p", "name": "P2P test (vllm full-manifest redis same-version)"
                },
                {
                  "framework": "vllm", "gpu_slot": 7, "namespace": "mx-ci-full-manifest-redis-mixed", "manifest": "ci/k8s/client/vllm/manifest-azure.yaml",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target",
                  "source_port": "8027", "worker_port": "8028", "mx_p2p_metadata": "0", "server_manifest": "ci/k8s/server/mx-server-redis.yaml",
                  "server_image": "nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.4.0", "pool": "a100a", "kind": "p2p",
                  "name": "P2P test (vllm full-manifest redis mixed-version)"
                },
                {
                  "framework": "vllm", "gpu_slot": 0, "namespace": "mx-ci-vllm-mla", "manifest": "ci/k8s/client/vllm/manifest-azure-tp2.yaml",
                  "source_port": "8001", "worker_port": "8002", "pool": "a100b", "kind": "p2p", "name": "P2P MLA model test (vllm TP=2)", "tp_size": "2",
                  "model": "deepseek-ai/DeepSeek-V2-Lite", "measure_vram": "true", "test_script": "ci/k8s/client/test_p2p_k8s.py",
                  "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target"
                },
                {
                  "gpu_slot": 2, "namespace": "mx-ci-vllm-dp2", "manifest": "ci/k8s/client/vllm/manifest-azure-dp2.yaml", "tp_size": "1", "dp_size": "2",
                  "source_port": "8001", "worker_port": "8002", "framework": "vllm", "pool": "a100b", "kind": "p2p", "name": "P2P DP=2 test (vllm)",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target"
                },
                {
                  "gpu_slot": 3, "namespace": "mx-ci-vllm-ep2", "manifest": "ci/k8s/client/vllm/manifest-azure-ep2.yaml", "model": "deepseek-ai/DeepSeek-V2-Lite",
                  "tp_size": "2", "dp_size": "1", "pod_ready_timeout_seconds": "3600", "source_port": "8003", "worker_port": "8004", "framework": "vllm",
                  "pool": "a100b", "kind": "p2p", "name": "P2P EP=2 test (vllm)", "test_script": "ci/k8s/client/test_p2p_k8s.py",
                  "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target"
                },
                {
                  "framework": "vllm", "gpu_slot": 14, "manifest": "ci/k8s/client/vllm/manifest-azure.yaml", "namespace": "mx-ci-stale-vllm",
                  "source_port": "8011", "pool": "a100a", "kind": "stale", "name": "P2P Stale metadata test (vllm)"
                }
              ],
              "sglang": [
                {
                  "framework": "sglang", "gpu_slot": 2, "namespace": "mx-ci-sglang", "manifest": "ci/k8s/client/sgl/manifest-azure.yaml",
                  "test_script": "ci/k8s/client/test_p2p_k8s.py", "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target",
                  "source_port": "8005", "worker_port": "8006", "expected_artifact_sources": "1", "pool": "a100a", "kind": "p2p", "name": "P2P test (sglang)"
                },
                {
                  "framework": "sglang", "gpu_slot": 1, "namespace": "mx-ci-sglang-mla", "manifest": "ci/k8s/client/sgl/manifest-azure-tp2.yaml",
                  "source_port": "8009", "worker_port": "8010", "pool": "a100b", "kind": "p2p", "name": "P2P MLA model test (sglang TP=2)", "tp_size": "2",
                  "model": "deepseek-ai/DeepSeek-V2-Lite", "measure_vram": "true", "test_script": "ci/k8s/client/test_p2p_k8s.py", "pytest_args": "--expected-max-total-tokens 131072",
                  "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target"
                },
                {
                  "framework": "sglang", "gpu_slot": 15, "manifest": "ci/k8s/client/sgl/manifest-azure.yaml", "namespace": "mx-ci-stale-sgl",
                  "source_port": "8012", "pool": "a100a", "kind": "stale", "name": "P2P Stale metadata test (sglang)"
                }
              ],
              "sglang-mooncake": [
                {
                  "framework": "sglang-mooncake", "gpu_slot": 3, "namespace": "mx-ci-sglang-mooncake",
                  "manifest": "ci/k8s/client/sgl/manifest-azure-mooncake.yaml", "test_script": "ci/k8s/client/test_p2p_k8s.py",
                  "pytest_args": "--p2p-marker ''SGLang MxModelLoader transfer_engine COMPLETE'' --transport transfer_engine",
                  "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target", "source_port": "8007", "worker_port": "8008", "pool": "a100a",
                  "kind": "p2p", "name": "P2P test (sglang-mooncake)"
                }
              ],
              "dynamo-vllm": [
                {
                  "mode": "aggregated", "gpu_slot": 9, "manifest": "ci/k8s/client/vllm/dynamo/manifest-azure-aggregated.yaml", "namespace": "mx-ci-dynamo-agg",
                  "dgd_name": "mx-agg", "framework": "dynamo-vllm", "pool": "a100a", "kind": "dynamo", "name": "P2P test with Dynamo (aggregated)"
                }
              ],
              "large": [
                {
                  "framework": "vllm", "gpu_slot": 8, "tp_size": "2", "namespace": "mx-ci-vllm-multinode-tp2",
                  "manifest": "ci/k8s/client/vllm/manifest-azure-multi-node-tp2.yaml", "source_port": "8001", "worker_port": "8002", "pool": "a100a",
                  "kind": "p2p", "name": "P2P TP test (vllm TP=2 multi-node)", "test_script": "ci/k8s/client/test_p2p_k8s.py", "large": true,
                  "source_extra_env": "JOB_NAME=mx-source", "extra_env": "JOB_NAME=mx-target"
                },
                {
                  "mode": "disaggregated", "gpu_slot": 10, "manifest": "ci/k8s/client/vllm/dynamo/manifest-azure-disaggregated.yaml",
                  "namespace": "mx-ci-dynamo-disagg", "dgd_name": "mx-disagg", "framework": "dynamo-vllm", "pool": "a100a", "kind": "dynamo",
                  "name": "P2P test with Dynamo (disaggregated)", "large": true
                },
                {
                  "framework": "vllm", "pool": "a100a", "kind": "fleet", "name": "P2P Fleet scale test (vLLM, 15 workers)", "namespace": "mx-ci-fleet",
                  "large": true, "fleet_size": "15", "wave_sizes": "5 10 15"
                },
                {
                  "framework": "vllm", "namespace": "mx-ci-rolling-vllm", "manifest": "ci/k8s/client/vllm/manifest-azure-rolling-update.yaml", "pool": "a100a",
                  "kind": "fleet", "name": "P2P Rolling-update test (vllm, 5 workers)", "large": true, "fleet_size": "5", "wave_sizes": "5",
                  "rolling_update": "true", "rollout_timeout_seconds": "1200", "test_script": "ci/k8s/client/test_rolling_update.py"
                },
                {
                  "framework": "sglang", "namespace": "mx-ci-rolling-sglang", "manifest": "ci/k8s/client/sgl/manifest-azure-rolling-update.yaml", "pool": "a100a",
                  "kind": "fleet", "name": "P2P Rolling-update test (sglang, 5 workers)", "large": true, "fleet_size": "5", "wave_sizes": "5",
                  "rolling_update": "true", "rollout_timeout_seconds": "1200", "test_script": "ci/k8s/client/test_rolling_update.py"
                }
              ]
            }
          ')[inputs.framework] }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Wait for previous GPU workload cleanup
        env:
          KUBECONFIG: ${{ github.workspace }}/.kubeconfig-vcluster
        run: |
          source .github/scripts/ci-kubectl.sh
          wait_for_gpu_pool_cleanup "$MX_CI_GPU_POOL"

      - name: Run p2p test
        if: matrix.kind == 'p2p'
        uses: ./.github/actions/run-mx-p2p-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ format('{0}-{1}-{2}', matrix.namespace, github.run_id, github.run_attempt) }}
          server_image: ${{ matrix.server_image || format('{0}/mx-server:{1}', env.MX_IMAGE_REPO, github.sha) }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ matrix.model || env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          manifest: ${{ matrix.manifest || '' }}
          test_script: ${{ matrix.test_script || 'ci/k8s/client/test_p2p_k8s.py' }}
          server_manifest: ${{ matrix.server_manifest || 'ci/k8s/server/mx-server.yaml' }}
          mx_p2p_metadata: ${{ matrix.mx_p2p_metadata || '1' }}
          source_extra_env: ${{ matrix.source_extra_env || '' }}
          extra_env: ${{ matrix.extra_env || '' }}
          source_port: ${{ matrix.source_port || '8001' }}
          worker_port: ${{ matrix.worker_port || '8002' }}
          pytest_args: ${{ matrix.pytest_args || '' }}
          tp_size: ${{ matrix.tp_size || '1' }}
          dp_size: ${{ matrix.dp_size || '1' }}
          measure_vram: ${{ matrix.measure_vram || 'false' }}
          pod_ready_timeout_seconds: ${{ matrix.pod_ready_timeout_seconds || '900' }}
          expected_artifact_sources: ${{ matrix.expected_artifact_sources || '0' }}
          expected_artifact_source_types: ${{ matrix.expected_artifact_source_types || '' }}

      - name: Run fleet test
        if: matrix.kind == 'fleet'
        uses: ./.github/actions/run-mx-fleet-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ format('{0}-{1}-{2}', matrix.namespace, github.run_id, github.run_attempt) }}
          server_image: ${{ matrix.server_image || format('{0}/mx-server:{1}', env.MX_IMAGE_REPO, github.sha) }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ matrix.model || env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          manifest: ${{ matrix.manifest || 'ci/k8s/client/vllm/manifest-azure-fleet.yaml' }}
          test_script: ${{ matrix.test_script || 'ci/k8s/client/test_fleet_scale.py' }}
          fleet_size: ${{ matrix.fleet_size || '15' }}
          wave_sizes: ${{ matrix.wave_sizes || '5 10 15' }}
          rolling_update: ${{ matrix.rolling_update || 'false' }}
          rollout_timeout_seconds: ${{ matrix.rollout_timeout_seconds || '600' }}
          worker_cpu_request: ${{ vars.MX_CI_FLEET_CPU || '2' }}

      - name: Run dynamo test
        if: matrix.kind == 'dynamo'
        uses: ./.github/actions/run-mx-dynamo-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ format('{0}-{1}-{2}', matrix.namespace, github.run_id, github.run_attempt) }}
          server_image: ${{ matrix.server_image || format('{0}/mx-server:{1}', env.MX_IMAGE_REPO, github.sha) }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ matrix.model || env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          manifest: ${{ matrix.manifest || 'ci/k8s/client/vllm/dynamo/manifest-azure-aggregated.yaml' }}
          mode: ${{ matrix.mode || 'aggregated' }}
          dgd_name: ${{ format('{0}-{1}-{2}', matrix.dgd_name, github.run_id, github.run_attempt) }}

      - name: Run stale-metadata test
        if: matrix.kind == 'stale'
        uses: ./.github/actions/run-mx-stale-metadata-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ format('{0}-{1}-{2}', matrix.namespace, github.run_id, github.run_attempt) }}
          server_image: ${{ matrix.server_image || format('{0}/mx-server:{1}', env.MX_IMAGE_REPO, github.sha) }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ matrix.model || env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          manifest: ${{ matrix.manifest || '' }}
          source_port: ${{ matrix.source_port || '8001' }}

      - name: Dump vCluster diagnostics on failure
        # Captures vCluster control-plane state at the moment of failure
        # (pod status, recent events, syncer logs, controller-identity
        # overlay) — surfaces infra-side disruption that may be the real
        # cause rather than the test itself.
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        # connect-vcluster backgrounds a `kubectl port-forward` and exports
        # VCLUSTER_PF_PID via $GITHUB_ENV. Kill it before the job ends so
        # the next job on this self-hosted runner doesn't inherit an orphan.
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi
          rm -f "${GITHUB_WORKSPACE}/.kubeconfig-host" "${GITHUB_WORKSPACE}/.kubeconfig-vcluster"
