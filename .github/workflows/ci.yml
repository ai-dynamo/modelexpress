name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches:
      - main
      - 'release/*'
  # Reused by nightly-ci.yml to re-run the hosted suite against main HEAD on a
  # schedule — catches drift that per-merge runs can't (new cargo-audit
  # advisories, rust beta/nightly toolchain breakage, upstream base images).
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Runner label for every job (the nightly passes the self-hosted
          builder so nothing lands on GitHub-hosted runners). Empty keeps
          ubuntu-latest for direct push/pull_request runs.
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel any previous check runs for the same pull request to avoid redundant workflows.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Suite
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: stable
            can-fail: false
          - rust: beta
            can-fail: false
          - rust: nightly
            can-fail: true
    continue-on-error: ${{ matrix.can-fail }}
    env:
      # rust-toolchain.toml pins channel = "stable" and a toolchain file beats
      # `rustup default`, so installing beta/nightly is not enough on its own —
      # RUSTUP_TOOLCHAIN is the only override that wins. Without it the beta
      # and nightly legs silently re-ran the stable build: triple the compute,
      # zero extra coverage, and no early warning of a toolchain regression.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ matrix.rust }}
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: |
        # Must report the matrix toolchain — if this prints the pinned stable
        # version, RUSTUP_TOOLCHAIN is not taking effect and the leg is a
        # duplicate of the stable one.
        rustc --version
        cargo --version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-${{ matrix.rust }}-
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Lint with clippy
      if: matrix.rust == 'stable'
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build debug
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --verbose --lib

    - name: Run server memory-backend unit tests
      run: cargo test -p modelexpress-server --features memory-backend --lib

    - name: Run integration tests
      if: matrix.rust == 'stable'
      run: cargo test -p modelexpress-server --features integration-tests --test in_process_server

    - name: Build release
      run: cargo build --release --verbose

    - name: Run doc tests
      run: cargo test --doc

  python-test:
    name: Python Tests
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      working-directory: modelexpress_client/python
      run: |
        uv venv .venv --python 3.12
        uv pip install -e ".[dev]"

    - name: Run tests
      working-directory: modelexpress_client/python
      run: |
        .venv/bin/python -m pytest tests/ -v

  go-test:
    name: Go Bindings
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.x"
        cache-dependency-path: modelexpress_client/go/go.sum

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install protoc plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Validate generated bindings
      run: |
        modelexpress_client/go/generate_proto.sh
        if [ -n "$(git status --porcelain -- modelexpress_client/go)" ]; then
          git status --porcelain -- modelexpress_client/go
          git diff -- modelexpress_client/go
          exit 1
        fi

    - name: Run Go tests
      working-directory: modelexpress_client/go
      run: go test ./...

  artifact-transfer-contract:
    name: Artifact Transfer Contract
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-artifact-transfer-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-artifact-transfer-
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Run artifact transfer contract tests
      run: |
        cargo test -p model-express-workspace-tests --test artifact_transfer_contract

  integration-test:
    name: Integration Tests
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: test

    services:
      redis:
        image: redis:7-alpine
        # Container port only: Docker picks a free host port, so concurrent
        # runs on a shared self-hosted daemon (nightly) can't collide on 6379.
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Build release
      run: cargo build --release

    - name: Run registry backend Redis integration tests
      env:
        REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
      run: |
        cargo test -p model-express-workspace-tests \
          --test registry_backend_redis \
          -- --include-ignored --test-threads=1

    - name: Run integration test script
      env:
        MX_METADATA_BACKEND: redis
        REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
      run: |
        if [ -f run_integration_tests.sh ]; then
          chmod +x run_integration_tests.sh
          ./run_integration_tests.sh || echo "Integration test script failed (expected in CI)"
        fi

  security-audit:
    name: Security Audit
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Install and Run cargo-deny
      run: |
        cargo-deny --version || cargo install cargo-deny@0.16.4
        cargo-deny --no-default-features check --hide-inclusion-graph licenses bans --config ${{ github.workspace }}/deny.toml

  code-coverage:
    name: Code Coverage
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Install LLVM tools
      run: |
        rustup component add llvm-tools-preview

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov

    - name: Generate code coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: lcov.info
        fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t "model-express:${{ github.run_id }}" .

    - name: Test Docker image
      run: |
        # Run-scoped name, no fixed host port: concurrent runs on a shared
        # self-hosted daemon (nightly) must not collide. Health check hits
        # the container IP directly instead of a published host port.
        NAME="mx-test-server-${{ github.run_id }}"
        docker run --rm --detach --name "${NAME}" "model-express:${{ github.run_id }}"
        sleep 10
        IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${NAME}")
        # Test that the server is responding (basic health check)
        timeout 30 bash -c "until curl -s http://${IP}:8001/health; do sleep 1; done" || echo "Health check failed (expected for gRPC)"

    - name: Cleanup Docker image
      if: always()
      run: |
        docker rm -f "mx-test-server-${{ github.run_id }}" 2>/dev/null || true
        docker image rm -f "model-express:${{ github.run_id }}" 2>/dev/null || true

  k8s-grpc-test:
    name: Kubernetes gRPC Transfer Test
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: test
    # No concurrency group: every host-shared name this job used to collide on
    # is now run-scoped (cluster name, kubeconfig, image tag), and a group
    # holds a single pending slot — a third run would cancel the second rather
    # than queue it.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install kubectl, Helm and kind
      # Run-scoped, pinned installs. These jobs may run on a shared
      # self-hosted builder (the nightly passes runs_on), where writing to
      # /usr/local/bin would swap the kubectl/helm binaries out from under
      # every other job on the host — including the vCluster e2e suite.
      # kind is installed here too (same v0.31.0 the script would fetch) so
      # it lands on $GITHUB_PATH and is therefore resolvable by the always()
      # teardown step; the script's own installer puts it in ~/.local/bin,
      # which is only on PATH inside the script's own process.
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/bin"
        curl -fsSLo "${RUNNER_TEMP}/bin/kubectl" "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
        chmod +x "${RUNNER_TEMP}/bin/kubectl"
        curl -fsSLo "${RUNNER_TEMP}/bin/kind" "https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64"
        chmod +x "${RUNNER_TEMP}/bin/kind"
        curl -fsSL https://get.helm.sh/helm-v3.20.0-linux-amd64.tar.gz | tar xz -C "${RUNNER_TEMP}"
        install "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/bin/helm"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

    - name: Run gRPC transfer K8s test
      env:
        # Run-scoped cluster name and kubeconfig: on a shared builder a fixed
        # cluster name collides across runs and ~/.kube/config would be
        # clobbered for other jobs.
        MX_KIND_CLUSTER_NAME: mx-grpc-${{ github.run_id }}-${{ github.run_attempt }}
        KUBECONFIG: ${{ runner.temp }}/kubeconfig-grpc
        # Run-scoped image tag too: the local `modelexpress:test` tag is
        # shared state on a persistent builder's daemon.
        MX_TEST_IMAGE_TAG: test-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        chmod +x test_grpc_transfer_k8s.sh
        ./test_grpc_transfer_k8s.sh

    - name: Tear down kind cluster
      # Belt-and-braces with the script's own cleanup: a cancelled or timed-out
      # job would otherwise leave a kind cluster resident on the builder
      # forever, consuming memory and leaking into later runs.
      if: always()
      env:
        MX_KIND_CLUSTER_NAME: mx-grpc-${{ github.run_id }}-${{ github.run_attempt }}
        KUBECONFIG: ${{ runner.temp }}/kubeconfig-grpc
      run: |
        # kind is on $GITHUB_PATH from the install step above. Fall back to
        # deleting the node containers directly if the install step itself
        # never ran (e.g. the job was cancelled during setup).
        if command -v kind >/dev/null 2>&1; then
          kind delete cluster --name "${MX_KIND_CLUSTER_NAME}" 2>/dev/null || true
        else
          docker rm -f $(docker ps -aq --filter "label=io.x-k8s.kind.cluster=${MX_KIND_CLUSTER_NAME}") 2>/dev/null || true
        fi
        rm -f "${KUBECONFIG}" 2>/dev/null || true
