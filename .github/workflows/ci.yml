name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches:
      - main
      - 'release/*'
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Runner label for every job (the nightly passes the self-hosted
          builder so nothing lands on GitHub-hosted runners). Empty keeps
          ubuntu-latest for direct push/pull_request runs.
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel any previous check runs for the same pull request to avoid redundant workflows.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Suite
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: stable
            can-fail: false
          - rust: beta
            can-fail: true
          - rust: nightly
            can-fail: true
    continue-on-error: ${{ matrix.can-fail }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Check Helm CRD manifest sync
      if: matrix.rust == 'stable'
      run: cmp examples/crds.yaml helm/crds/modelexpress-crds.yaml

    - name: Install Rust toolchain
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "${{ matrix.rust }}"
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: |
        rustc --version
        cargo --version

    - name: Cache dependencies
      if: inputs.runs_on == ''
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-${{ matrix.rust }}-
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler build-essential

    - name: Check CRDs are up to date with Rust types
      if: matrix.rust == 'stable'
      run: cargo run --quiet -p modelexpress-server --bin crdgen | diff -u examples/crds.yaml -

    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Lint with clippy
      if: matrix.rust == 'stable'
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build debug
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --verbose --lib

    - name: Run server memory-backend unit tests
      run: cargo test -p modelexpress-server --features memory-backend --lib

    - name: Run integration tests
      if: matrix.rust == 'stable'
      run: cargo test -p modelexpress-server --features integration-tests --test in_process_server

    - name: Build release
      if: matrix.rust == 'stable'
      run: cargo build --release --verbose

    - name: Run doc tests
      run: cargo test --doc

  tls-feature-matrix:
    name: TLS Feature Matrix
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    strategy:
      matrix:
        features:
          - --no-default-features --features tls-rustls
          - --no-default-features --features openssl
          - --no-default-features --features tls-rustls,gcs
          - --no-default-features --features openssl,gcs

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      if: inputs.runs_on == ''
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-tls-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-tls-
          ${{ runner.os }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler pkg-config libssl-dev build-essential

    - name: Lint with clippy
      run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

    - name: Build
      run: cargo build --workspace ${{ matrix.features }} --verbose

  tls-no-backend-rejected:
    name: TLS No-Backend Rejected
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler build-essential

    - name: Building with no TLS backend must fail
      run: |
        if cargo check -p modelexpress-common --no-default-features 2>build.log; then
          echo "expected the build to be rejected when no TLS backend is selected"
          exit 1
        fi
        grep -q "no TLS backend selected" build.log

  python-test:
    name: Python Tests (protobuf ${{ matrix.protobuf_major }})
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - protobuf_major: 5
            protobuf_spec: "protobuf==5.27.2"
          - protobuf_major: 6
            protobuf_spec: "protobuf>=6.30.2,<7.0.0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      run: pip install uv

    - name: Install C toolchain
      # setup.py builds _alloc_ext with $CXX (default g++), not cc.
      run: command -v g++ >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

    - name: Install dependencies
      working-directory: modelexpress_client/python
      run: |
        uv venv .venv --python 3.12
        uv pip install -e ".[dev]" '${{ matrix.protobuf_spec }}'

    - name: Run tests
      working-directory: modelexpress_client/python
      run: |
        .venv/bin/python -m pytest tests/ -v

  python-proto-bindings:
    name: Python Generated Bindings
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Install only the codegen extra, not the project: modelexpress depends on
    # torch, which is a large download this job has no use for. The pin is
    # still read from pyproject.toml so it stays single-sourced.
    - name: Install codegen dependencies
      run: |
        pins=$(python - <<'EOF'
        import pathlib, tomllib
        pyproject = pathlib.Path("modelexpress_client/python/pyproject.toml")
        data = tomllib.loads(pyproject.read_text())
        print(" ".join(data["project"]["optional-dependencies"]["codegen"]))
        EOF
        )
        echo "Installing: ${pins}"
        pip install ${pins}

    - name: Validate generated bindings
      run: |
        modelexpress_client/python/generate_proto.sh
        if [ -n "$(git status --porcelain -- modelexpress_client/python)" ]; then
          echo "Generated Python bindings are out of date with modelexpress_common/proto."
          echo "Run modelexpress_client/python/generate_proto.sh and commit the result."
          git status --porcelain -- modelexpress_client/python
          git diff -- modelexpress_client/python
          exit 1
        fi

  go-test:
    name: Go Bindings
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: modelexpress_client/go/go.mod
        cache-dependency-path: modelexpress_client/go/go.sum

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install protoc plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Validate generated bindings
      run: |
        modelexpress_client/go/generate_proto.sh
        if [ -n "$(git status --porcelain -- modelexpress_client/go)" ]; then
          git status --porcelain -- modelexpress_client/go
          git diff -- modelexpress_client/go
          exit 1
        fi

    - name: Run Go tests
      working-directory: modelexpress_client/go
      run: go test ./...

  artifact-transfer-contract:
    name: Artifact Transfer Contract
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      if: inputs.runs_on == ''
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-artifact-transfer-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-artifact-transfer-
          ${{ inputs.runs_on || 'ubuntu-latest' }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler build-essential

    - name: Run artifact transfer contract tests
      run: |
        cargo test -p model-express-workspace-tests --test artifact_transfer_contract

  integration-test:
    name: Integration Tests
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Cache dependencies
      if: inputs.runs_on == ''
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-stable-
          ${{ runner.os }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler build-essential

    - name: Build release
      run: cargo build --release

    - name: Run registry backend Redis integration tests
      env:
        REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
      run: |
        cargo test -p model-express-workspace-tests \
          --test registry_backend_redis \
          -- --include-ignored --test-threads=1

    - name: Run P2P Redis status ordering test
      env:
        MX_TEST_REDIS_URL: redis://localhost:6379
      run: |
        cargo test -p modelexpress-server --lib \
          p2p::backend::redis::tests::older_status_update_does_not_replace_newer_status \
          -- --ignored --exact --test-threads=1

    - name: Run Refit service Redis integration tests
      env:
        REDIS_URL: redis://localhost:6379
      run: |
        cargo test -p model-express-workspace-tests \
          --test refit_service_redis \
          -- --include-ignored --test-threads=1

    - name: Run integration test script
      env:
        MX_METADATA_BACKEND: redis
        REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
      run: |
        if [ -f run_integration_tests.sh ]; then
          chmod +x run_integration_tests.sh
          ./run_integration_tests.sh
        fi
      continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Install C toolchain
      run: command -v cc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run security audit
      run: cargo audit

    - name: Install and Run cargo-deny
      run: |
        cargo-deny --version || cargo install cargo-deny@0.16.4
        cargo-deny --no-default-features check --hide-inclusion-graph licenses bans --config ${{ github.workspace }}/deny.toml

  code-coverage:
    name: Code Coverage
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: test
    permissions:
      contents: read
      id-token: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Install LLVM tools
      run: |
        rustup component add llvm-tools-preview

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler build-essential

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov

    - name: Generate code coverage
      env:
        REDIS_URL: redis://localhost:6379
      run: |
        cargo llvm-cov --all-features --workspace --no-report
        cargo llvm-cov --all-features -p model-express-workspace-tests \
          --test refit_service_redis --no-report -- --include-ignored
        cargo llvm-cov report --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        files: lcov.info
        fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t "model-express:${{ github.run_id }}" .

    - name: Test Docker image
      run: |
        NAME="mx-test-server-${{ github.run_id }}"
        docker run --rm --detach --name "${NAME}" "model-express:${{ github.run_id }}"
        sleep 10
        IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${NAME}")
        # Test that the server is responding (basic health check)
        timeout 30 bash -c "until curl -s http://${IP}:8001/health; do sleep 1; done" || echo "Health check failed (expected for gRPC)"

    - name: Cleanup Docker image
      if: always()
      run: |
        docker rm -f "mx-test-server-${{ github.run_id }}" 2>/dev/null || true
        docker image rm -f "model-express:${{ github.run_id }}" 2>/dev/null || true

  k8s-grpc-test:
    name: Kubernetes gRPC Transfer Test
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install kubectl, Helm and kind
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/bin"
        curl -fsSLo "${RUNNER_TEMP}/bin/kubectl" "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
        chmod +x "${RUNNER_TEMP}/bin/kubectl"
        curl -fsSLo "${RUNNER_TEMP}/bin/kind" "https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64"
        chmod +x "${RUNNER_TEMP}/bin/kind"
        curl -fsSL https://get.helm.sh/helm-v3.20.0-linux-amd64.tar.gz | tar xz -C "${RUNNER_TEMP}"
        install "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/bin/helm"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

    - name: Run gRPC transfer K8s test
      env:
        MX_KIND_CLUSTER_NAME: mx-grpc-${{ github.run_id }}-${{ github.run_attempt }}
        KUBECONFIG: ${{ runner.temp }}/kubeconfig-grpc
        MX_TEST_IMAGE_TAG: test-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        chmod +x test_grpc_transfer_k8s.sh
        ./test_grpc_transfer_k8s.sh

    - name: Tear down kind cluster
      if: always()
      env:
        MX_KIND_CLUSTER_NAME: mx-grpc-${{ github.run_id }}-${{ github.run_attempt }}
        KUBECONFIG: ${{ runner.temp }}/kubeconfig-grpc
        MX_TEST_IMAGE_TAG: test-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        if command -v kind >/dev/null 2>&1; then
          kind delete cluster --name "${MX_KIND_CLUSTER_NAME}" 2>/dev/null || true
        else
          docker rm -f $(docker ps -aq --filter "label=io.x-k8s.kind.cluster=${MX_KIND_CLUSTER_NAME}") 2>/dev/null || true
        fi
        rm -f "${KUBECONFIG}" 2>/dev/null || true
        docker image rm -f "modelexpress:${MX_TEST_IMAGE_TAG}" 2>/dev/null || true
