name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches:
      - main
      - 'release/*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel any previous check runs for the same pull request to avoid redundant workflows.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: stable
            can-fail: false
          - rust: beta
            can-fail: false
          - rust: nightly
            can-fail: true
    continue-on-error: ${{ matrix.can-fail }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Lint with clippy
      if: matrix.rust == 'stable'
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build debug
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --verbose --lib

    - name: Run server memory-backend unit tests
      run: cargo test -p modelexpress-server --features memory-backend --lib

    - name: Run integration tests
      if: matrix.rust == 'stable'
      run: cargo test -p modelexpress-server --features integration-tests --test in_process_server

    - name: Build release
      run: cargo build --release --verbose

    - name: Run doc tests
      run: cargo test --doc

  python-test:
    name: Python Tests (protobuf ${{ matrix.protobuf_major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - protobuf_major: 5
            protobuf_spec: "protobuf==5.27.2"
          - protobuf_major: 6
            protobuf_spec: "protobuf>=6.30.2,<7.0.0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      working-directory: modelexpress_client/python
      run: |
        uv venv .venv --python 3.12
        uv pip install -e ".[dev]" '${{ matrix.protobuf_spec }}'

    - name: Run tests
      working-directory: modelexpress_client/python
      run: |
        .venv/bin/python -m pytest tests/ -v

  rl-experience-python-test:
    name: RL Experience Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: pip install uv==0.8.14

    - name: Install dependencies
      working-directory: rl_experience_transfer
      run: uv sync --locked --dev

    - name: Run tests
      working-directory: rl_experience_transfer
      run: uv run --locked pytest -m "not nixl and not requires_gpu and not requires_xpu" -v

    - name: Lint
      working-directory: rl_experience_transfer
      run: |
        uv run --locked ruff check src tests examples
        uv run --locked ruff format --check src tests examples

    - name: Type check
      working-directory: rl_experience_transfer
      run: uv run --locked mypy

    - name: Build and smoke-test wheel
      working-directory: rl_experience_transfer
      run: |
        uv build --out-dir "$RUNNER_TEMP/rlxfer-dist"
        uv venv "$RUNNER_TEMP/rlxfer-wheel-env" --python "${{ matrix.python-version }}"
        uv pip install --python "$RUNNER_TEMP/rlxfer-wheel-env/bin/python" "$RUNNER_TEMP"/rlxfer-dist/*.whl
        "$RUNNER_TEMP/rlxfer-wheel-env/bin/python" -I -c "import rlxfer; assert rlxfer.__version__ == '0.1.0'"

  rl-experience-framework-integration:
    name: RL Experience Native + Pipeline Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout ModelExpress
      uses: actions/checkout@v4

    - name: Checkout NeMo RL contract
      uses: actions/checkout@v4
      with:
        repository: NVIDIA-NeMo/RL
        ref: daf46ff37a64832d8c5637bdfbb0bc3252b47052
        path: upstream/nemo-rl
        persist-credentials: false

    - name: Checkout PRIME-RL contract
      uses: actions/checkout@v4
      with:
        repository: PrimeIntellect-ai/prime-rl
        ref: 2873bf2b9109cb30ccfe950b52ac46bc2d8c142b
        path: upstream/prime-rl
        persist-credentials: false

    - name: Checkout slime contract
      uses: actions/checkout@v4
      with:
        repository: THUDM/slime
        ref: a6272da0d4f3d0a08520c99a2f3b4f6c887960dc
        path: upstream/slime
        persist-credentials: false

    - name: Checkout MILES contract
      uses: actions/checkout@v4
      with:
        repository: radixark/miles
        ref: 319716c0271259dc3afd15e032c81760535b23b3
        path: upstream/miles
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install lightweight dependencies
      working-directory: rl_experience_transfer
      run: |
        pip install uv==0.8.14
        uv venv .framework-venv --python 3.12
        uv pip install --python .framework-venv/bin/python --editable . pytest==9.0.2
        uv pip install --python .framework-venv/bin/python \
          beartype==0.22.9 datasets==4.8.5 httpx==0.28.1 hydra-core==1.3.5 jaxtyping==0.3.11 \
          loguru==0.7.3 msgspec==0.19.0 pillow==11.3.0 \
          prime-pydantic-config==0.4.2 pydantic==2.13.4 ray==2.55.1 \
          renderers==0.1.10.dev1 tomli==2.4.1 tomli-w==1.2.0 \
          transformers==5.6.0 wandb==0.21.4
        uv pip install --python .framework-venv/bin/python \
          torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

    - name: Install lightweight framework package metadata
      working-directory: rl_experience_transfer
      run: |
        uv pip install --python .framework-venv/bin/python --no-deps \
          --editable ../upstream/prime-rl \
          --editable ../upstream/slime \
          --editable ../upstream/miles

    - name: Run native framework matrix and pipeline components
      working-directory: rl_experience_transfer
      env:
        PYTHONPATH: ${{ github.workspace }}/upstream/nemo-rl:${{ github.workspace }}/upstream/prime-rl/src:${{ github.workspace }}/upstream/prime-rl/packages/prime-rl-configs/src:${{ github.workspace }}/upstream/slime:${{ github.workspace }}/upstream/miles
        RLXFER_RUN_FRAMEWORK_INTEGRATION: "1"
        RLXFER_NEMO_RL_SOURCE: ${{ github.workspace }}/upstream/nemo-rl
        RLXFER_PRIME_RL_SOURCE: ${{ github.workspace }}/upstream/prime-rl/src
        RLXFER_SLIME_SOURCE: ${{ github.workspace }}/upstream/slime
        RLXFER_MILES_SOURCE: ${{ github.workspace }}/upstream/miles
      run: |
        .framework-venv/bin/python -m pytest tests/test_framework_integration.py -v
        .framework-venv/bin/python examples/framework_pipeline.py all --format markdown >> "$GITHUB_STEP_SUMMARY"

  go-test:
    name: Go Bindings
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.x"
        cache-dependency-path: modelexpress_client/go/go.sum

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install protoc plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Validate generated bindings
      run: |
        modelexpress_client/go/generate_proto.sh
        if [ -n "$(git status --porcelain -- modelexpress_client/go)" ]; then
          git status --porcelain -- modelexpress_client/go
          git diff -- modelexpress_client/go
          exit 1
        fi

    - name: Run Go tests
      working-directory: modelexpress_client/go
      run: go test ./...

  artifact-transfer-contract:
    name: Artifact Transfer Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-artifact-transfer-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-artifact-transfer-
          ${{ runner.os }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Run artifact transfer contract tests
      run: |
        cargo test -p model-express-workspace-tests --test artifact_transfer_contract

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Build release
      run: cargo build --release

    - name: Run registry backend Redis integration tests
      env:
        REDIS_URL: redis://localhost:6379
      run: |
        cargo test -p model-express-workspace-tests \
          --test registry_backend_redis \
          -- --include-ignored --test-threads=1

    - name: Run integration test script
      env:
        MX_METADATA_BACKEND: redis
        REDIS_URL: redis://localhost:6379
      run: |
        if [ -f run_integration_tests.sh ]; then
          chmod +x run_integration_tests.sh
          ./run_integration_tests.sh || echo "Integration test script failed (expected in CI)"
        fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Install and Run cargo-deny
      run: |
        cargo-deny --version || cargo install cargo-deny@0.16.4
        cargo-deny --no-default-features check --hide-inclusion-graph licenses bans --config ${{ github.workspace }}/deny.toml

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Check Rust version
      run: rustc --version

    - name: Install LLVM tools
      run: |
        rustup component add llvm-tools-preview

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov

    - name: Generate code coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: lcov.info
        fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t model-express:latest .

    - name: Test Docker image
      run: |
        docker run --rm --detach --name test-server -p 8001:8001 model-express:latest
        sleep 10
        # Test that the server is responding (basic health check)
        timeout 30 bash -c 'until curl -s http://localhost:8001/health; do sleep 1; done' || echo "Health check failed (expected for gRPC)"
        docker stop test-server || true

  k8s-grpc-test:
    name: Kubernetes gRPC Transfer Test
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Run gRPC transfer K8s test
      run: |
        chmod +x test_grpc_transfer_k8s.sh
        ./test_grpc_transfer_k8s.sh
