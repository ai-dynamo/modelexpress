# ModelExpress K8s CI.
#
# Ten jobs:
#   build-server        — builds and pushes the MX coordination server image
#                         from ci/k8s/server/Dockerfile.server. Runs on the
#                         self-hosted builder runner
#                         (prod-modelexpress-builder-amd-v1).
#
#   build-client        — matrix over inference engine frameworks (vllm,
#                         trt-llm, sglang, dynamo-vllm); builds and pushes
#                         one worker image per framework. Runs on the
#                         self-hosted builder runner. All build jobs run in
#                         parallel.
#
#   ensure-vcluster     — bootstraps the persistent mx-ci-cluster vCluster on
#                         first run (no-ops on re-runs). Runs in parallel with
#                         the build jobs.
#
#   test-p2p            — matrix over frameworks; needs build-client,
#                         build-server, and ensure-vcluster. Each matrix entry
#                         creates its own isolated namespace, deploys a full
#                         stack (mx-server + workers), runs pytest, then
#                         deletes the namespace. Runs up to max-parallel: 3
#                         entries concurrently to bound simultaneous HF model
#                         downloads and GPU footprint.
#
#   test-tp             — TP > 1 variant of test-p2p. Multi-node TP=2 only
#                         (StatefulSet + Ray, one GPU per pod on a100a, 2 pods
#                         per role). Single-node TP=2 is covered by
#                         test-p2p-mla-model (same manifest, plus VRAM parity)
#                         and was dropped here to avoid doubling a100b demand.
#                         See TEST_PLAN row 5.1.
#
#   test-parallel       — DP > 1 and EP > 1 variants of test-p2p, matrixed and
#                         serialized (max-parallel: 1) since both are single-node
#                         full-GPU jobs on the scarce non-MIG pool. DP uses vLLM
#                         native data parallelism (--data-parallel-size 2, N full
#                         interchangeable copies at worker_rank 0, tp_size=1); EP
#                         uses expert parallelism (--enable-expert-parallel over a
#                         TP=2 MoE world, rank-distinct weights, tp_size=2, the
#                         identity hash carrying a derived expert-parallel world
#                         size of tp * dp * pcp rather than a constant). See
#                         TEST_PLAN rows 5.2 and 5.3.
#
#   test-p2p-mla-model — vLLM + SGLang MLA/MoE P2P test on the full-GPU A100b
#                        pool, matrixed over framework and serialized
#                        (max-parallel: 1). Uses a TP=2 DeepSeek MLA + MoE model
#                        and runs the source/target VRAM parity assertions. The
#                        vLLM entry doubles as the single-node TP=2 coverage
#                        (same manifest-azure-tp2.yaml + test_p2p_k8s.py as the
#                        dropped test-tp single-node entry); the SGLang entry
#                        covers the remote_instance + NIXL path.
#
#   test-with-dynamo    — P2P test orchestrated through a DynamoGraphDeployment.
#                         Matrix over serving topology (aggregated /
#                         disaggregated). Different shape than test-p2p (DGD CR
#                         + grove-managed pods, not a raw K8s Job), so it's
#                         its own top-level job rather than a test-p2p matrix
#                         entry. Relies on the cluster-wide Dynamo operator
#                         installed in dynamo-system by setup-mx-vcluster.
#
#   test-stale-metadata — Reaper-correctness check. mx-server runs with the
#                         Redis backend (sidecar) and compressed reaper knobs
#                         (heartbeat=30s, scan=10s); a single source pod
#                         publishes, the action force-kills it, and pytest
#                         asserts ListSources(status_filter=READY) returns 0
#                         after the heartbeat window. Matrix over framework
#                         (vllm / sglang). No target pod — the assertion runs
#                         against mx-server directly via gRPC.
#
#   model-streamer       — matrix over frameworks; single worker pod, no
#                          vCluster, no P2P. Streams weights directly from S3
#                          via runai-model-streamer + IRSA. Validates the
#                          streamer path independently of the P2P plumbing.
#                          Only vllm is active today — the SGLang adapter's
#                          streamer path currently crashes inside
#                          ModelStreamerStrategy.load on
#                          `ctx.model_config.model` (vLLM-specific attribute),
#                          and the composite action also hard-codes vLLM's
#                          launch command. Uncomment the sglang matrix entry
#                          once both are addressed.
#
#   ci-status-check     — umbrella job that needs every gating job above.
#                         Single check that the branch-protection rule on
#                         `main` requires; adding a new gating job means
#                         appending it to this job's `needs:` list, no
#                         branch-protection reconfigure needed.
#
# To add a new inference engine:
#   1. Add ci/k8s/client/<engine>/Dockerfile
#   2. Add ci/k8s/client/<engine>/manifest-*.yaml + test_p2p_k8s.py
#   3. Add an entry to the build-client and test-p2p matrix include lists below.
#   4. If the engine's S3 streamer path works end-to-end, add the framework to
#      the model-streamer matrix and generalize the run-mx-streamer-test
#      composite action to dispatch on framework.
#   5. If the engine also runs under a Dynamo DGD (`dynamo-<engine>`), add it
#      to the build-client matrix with the dynamo-specific Dockerfile and
#      consider extending test-with-dynamo to a matrix.
#   6. If you add a new top-level test job (not just a matrix entry), add
#      its job key to `ci-status-check`'s `needs:` list so it's covered by
#      the branch-protection gate.
#
# Required secrets:
#   AZURE_AKS_CI_KUBECONFIG_B64   — base64-encoded kubeconfig for the AKS host cluster
#   NGC_API_KEY                   — push/pull registry images
#   HF_TOKEN                      — HuggingFace token (required; used to create hf-token-secret in the test namespace)

name: ModelExpress CI Tests

on:
  # copy-pr-bot mediated trigger. Direct `pull_request:` events are forbidden
  # on self-hosted runners (PR-head code is untrusted); copy-pr-bot
  # copies a PR's content to `pull-request/<N>` in this repo AFTER a
  # maintainer approves (or all commits are GPG-signed by Nvidians), and
  # the push to that internal branch is what fires this workflow.
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  # github.ref_name is the bot-created branch (e.g. `pull-request/123`), so
  # consecutive pushes to the same PR cancel earlier runs but pushes to
  # different PRs don't fight for the same group.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  MX_CI_MODEL: Qwen/Qwen2.5-0.5B
  VCLUSTER_NAME: mx-ci-cluster
  VCLUSTER_NAMESPACE: mx-ci
  MX_CI_S3_BUCKET: ai-dynamo-modelexpress-ci
  MX_CI_S3_REGION: us-west-2
  MX_IMAGE_REPO: nvcr.io/0980761089281446

jobs:
  # ---------------------------------------------------------------------------
  # Build the MX coordination server image from source.
  # Image tag convention: <MX_IMAGE_REPO>/mx-server:<sha>
  # Uses a public ubuntu:24.04 runtime base — no NGC org access required.
  # ---------------------------------------------------------------------------
  build-server:
    name: Build server image
    runs-on: prod-modelexpress-builder-amd-v1
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute SERVER_IMAGE
        # Persist the tag in $GITHUB_ENV so both the build step and the
        # cleanup step reference the same value without re-templating.
        run: |
          echo "SERVER_IMAGE=${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to image registry
        run: |
          echo "${{ secrets.NGC_API_KEY }}" | \
            docker login nvcr.io -u '$oauthtoken' --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f ci/k8s/server/Dockerfile.server \
            -t "${SERVER_IMAGE}" \
            --push \
            .

      - name: Cleanup local image
        # buildx with --push typically doesn't materialize a local image,
        # but reap defensively in case the buildx driver was switched.
        # `if: always()` survives failure + cancel-in-progress so the
        # self-hosted builder runner's Docker daemon doesn't accumulate
        # stale images across runs.
        if: always()
        run: |
          docker image rm -f "${SERVER_IMAGE}" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Build one worker image per inference engine framework.
  # Image tag convention: <MX_IMAGE_REPO>/mx-worker-<framework>:<sha>
  # The test job reconstructs this tag from the same inputs — no job output needed.
  # ---------------------------------------------------------------------------
  build-client:
    name: Build worker image (${{ matrix.framework }})
    runs-on: prod-modelexpress-builder-amd-v1
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: vllm
            dockerfile: ci/k8s/client/vllm/Dockerfile
          - framework: sglang
            dockerfile: ci/k8s/client/sgl/Dockerfile
          - framework: sglang-mooncake
            dockerfile: ci/k8s/client/sgl/Dockerfile.mooncake
          - framework: dynamo-vllm
            dockerfile: ci/k8s/client/vllm/dynamo/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute WORKER_IMAGE
        # Persist the tag in $GITHUB_ENV so both the build step and the
        # cleanup step reference the same value without re-templating.
        run: |
          echo "WORKER_IMAGE=${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to image registry
        run: |
          echo "${{ secrets.NGC_API_KEY }}" | \
            docker login nvcr.io -u '$oauthtoken' --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push
        # Build context is repo root — Dockerfiles COPY from modelexpress_client/python/.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f "${{ matrix.dockerfile }}" \
            -t "${WORKER_IMAGE}" \
            --push \
            .

      - name: Cleanup local image
        # buildx with --push typically doesn't materialize a local image,
        # but reap defensively in case the buildx driver was switched.
        # `if: always()` survives failure + cancel-in-progress so the
        # self-hosted builder runner's Docker daemon doesn't accumulate
        # stale images across runs (each matrix entry adds a multi-GB image).
        if: always()
        run: |
          docker image rm -f "${WORKER_IMAGE}" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Ensure the persistent vCluster is ready.
  # Bootstraps on first run, no-ops on re-runs.  Runs in parallel with build
  # jobs — the vCluster does not depend on any built image.
  # ---------------------------------------------------------------------------
  ensure-vcluster:
    name: Ensure vCluster
    runs-on: prod-modelexpress-builder-amd-v1
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check if vCluster exists
        id: vcluster-check
        uses: ./.github/actions/check-vcluster-exists
        with:
          kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Bootstrap vCluster (first run only)
        if: steps.vcluster-check.outputs.exists != 'true'
        uses: ./.github/actions/setup-mx-vcluster
        with:
          kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Connect to vCluster
        # Always connect — verifies the vCluster is accessible on re-runs
        # where bootstrap was skipped.
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Guard against host / vCluster version skew
        # The control-plane version is a pinned constant (vcluster_k8s_version
        # in setup-mx-vcluster). What broke CI once was the AKS host
        # auto-upgrading PAST that pin: Kubernetes 1.34 added observedGeneration
        # on pod conditions, and a vCluster minor below the host makes the
        # syncer loop, dropping that field and overwriting Ready=True with stale
        # data so pods never surface as Ready. setup-mx-vcluster is gated (only
        # runs when the vCluster is absent), so a running cluster silently
        # skewed after a host bump is never re-checked there. Compare the LIVE
        # vCluster server minor against the host's on every run and fail loudly
        # with the fix — so the next host bump is a red step with the answer in
        # it instead of days of digging. Compares major.minor only (the skew is
        # a minor-version feature; patch differences are fine). Fails closed on
        # a confirmed skew and also when either version can't be read.
        # Incident writeup + context: MX-429.
        shell: bash
        run: |
          # `|| true`: the default GitHub bash runs with `-eo pipefail`, so a
          # no-match grep would abort the `VAR=$(server_minor ...)` assignment
          # before the empty-value check runs. Swallow the pipeline status and
          # let the explicit check below produce the parse-error diagnostic.
          server_minor() {
            kubectl --kubeconfig="$1" version 2>/dev/null \
              | grep -iE 'server version' | grep -oE '[0-9]+\.[0-9]+' | head -1 || true
          }
          HOST_MM=$(server_minor "${{ github.workspace }}/.kubeconfig-host")
          VC_MM=$(server_minor "${{ github.workspace }}/.kubeconfig-vcluster")
          echo "Host k8s minor: ${HOST_MM:-unknown}; vCluster k8s minor: ${VC_MM:-unknown}"
          if [ -z "${HOST_MM}" ] || [ -z "${VC_MM}" ]; then
            # Fail closed: reachability is already verified above, so an
            # unreadable version means the parse broke, not connectivity. Fail
            # loudly rather than let the guard silently stop protecting.
            echo "::error::Could not read host and/or vCluster server version (host='${HOST_MM:-}', vCluster='${VC_MM:-}'). Fix the version parse in this step."
            exit 1
          fi
          HOST_MAJOR=${HOST_MM%.*}; HOST_MINOR=${HOST_MM#*.}
          VC_MAJOR=${VC_MM%.*};     VC_MINOR=${VC_MM#*.}
          if [ "${VC_MAJOR}" -lt "${HOST_MAJOR}" ] \
             || { [ "${VC_MAJOR}" -eq "${HOST_MAJOR}" ] && [ "${VC_MINOR}" -lt "${HOST_MINOR}" ]; }; then
            echo "::error::vCluster control plane is ${VC_MM} but the AKS host is ${HOST_MM}. A vCluster minor below the host stalls pod-ready propagation (observedGeneration, added in k8s 1.34, makes the syncer overwrite Ready=True). Bump vcluster_k8s_version in .github/actions/setup-mx-vcluster to >= ${HOST_MM}, then recreate the vCluster (delete it so the gated bootstrap rebuilds at the new version)."
            exit 1
          fi
          echo "No host/vCluster version skew (vCluster ${VC_MM} >= host ${HOST_MM})."

      - name: vCluster baseline health
        # Snapshot vCluster control-plane state before any test job runs. When
        # downstream jobs fail with "connection refused" mid-run, this baseline
        # tells us whether the vCluster was already showing signs of strain
        # (restarts, OOMs, evictions, low headroom) or was healthy at the start
        # — pointing the investigation at either cluster-health or test-load.
        # Same action is invoked with `if: failure()` from each test job to
        # capture state at the moment a test failed (which may post-date
        # this baseline).
        if: always()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        # connect-vcluster backgrounds a `kubectl port-forward` and exports
        # VCLUSTER_PF_PID via $GITHUB_ENV. Kill it before the job ends so
        # the next job on this self-hosted runner doesn't inherit an orphan.
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Run P2P weight-transfer test for each framework.
  # Each matrix job creates its own namespace for full isolation, allowing
  # parallel execution in the future (remove max-parallel: 1 to enable).
  # ---------------------------------------------------------------------------
  test-p2p:
    name: P2P test (${{ matrix.label || matrix.framework }})
    runs-on: prod-modelexpress-builder-amd-v1
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Cap concurrent P2P entries at 3. Running all at once had every
      # entry's source download the model from HuggingFace simultaneously (no
      # shared model cache across namespaces), which starved slow sources past
      # their publish timeout; capping the fan-out cuts the peak concurrent
      # HF pulls and per-entry GPU footprint. Note this only bounds this job's
      # matrix — the other P2P jobs (test-tp/dp/ep/mla, test-with-dynamo) are
      # separate jobs and still run alongside.
      max-parallel: 3
      matrix:
        include:
          - framework: vllm
            namespace: mx-ci-vllm-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure.yaml
            test_script: ci/k8s/client/test_p2p_k8s.py
            source_extra_env: "JOB_NAME=mx-source"
            extra_env: "JOB_NAME=mx-target"
            source_port: "8001"
            worker_port: "8002"
            expected_artifact_sources: "1"
            expected_artifact_source_types: "torch_compile_cache"
          - framework: sglang
            namespace: mx-ci-sglang-${{ github.run_id }}
            manifest: ci/k8s/client/sgl/manifest-azure.yaml
            test_script: ci/k8s/client/test_p2p_k8s.py
            source_extra_env: "JOB_NAME=mx-source"
            extra_env: "JOB_NAME=mx-target"
            source_port: "8005"
            worker_port: "8006"
            expected_artifact_sources: "1"
          # Same SGLang P2P test as above, but over the Mooncake TransferEngine
          # transport instead of NIXL. The ModelExpress package loader uses the
          # same remote_instance command on source and target; the first replica
          # publishes a TransferEngine session and later replicas pull from it.
          # The per-rank NIXL agent assertion is skipped via --transport.
          - framework: sglang-mooncake
            namespace: mx-ci-sglang-mooncake-${{ github.run_id }}
            manifest: ci/k8s/client/sgl/manifest-azure-mooncake.yaml
            test_script: ci/k8s/client/test_p2p_k8s.py
            pytest_args: "--p2p-marker 'SGLang MxModelLoader transfer_engine COMPLETE' --transport transfer_engine"
            source_extra_env: "JOB_NAME=mx-source"
            extra_env: "JOB_NAME=mx-target"
            source_port: "8007"
            worker_port: "8008"
          # Full tensor-manifest publish path (MX_P2P_METADATA=0): the source
          # embeds the full tensor manifest in the WorkerMetadata proto it
          # publishes, instead of serving it on-demand. The mixed-version entry
          # (client @ this commit vs the last released server) is a proto
          # backward-compatibility guard — it catches client-side proto changes
          # that break older servers (e.g. dropping the legacy `tensors`
          # field). same-version only guards the path against future same-build
          # breaks.
          - framework: vllm
            label: vllm full-manifest same-version
            namespace: mx-ci-full-manifest-same-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure.yaml
            test_script: ci/k8s/client/test_p2p_k8s.py
            source_extra_env: "JOB_NAME=mx-source"
            extra_env: "JOB_NAME=mx-target"
            source_port: "8021"
            worker_port: "8022"
            mx_p2p_metadata: "0"
          - framework: vllm
            label: vllm full-manifest mixed-version
            namespace: mx-ci-full-manifest-mixed-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure.yaml
            test_script: ci/k8s/client/test_p2p_k8s.py
            source_extra_env: "JOB_NAME=mx-source"
            extra_env: "JOB_NAME=mx-target"
            source_port: "8023"
            worker_port: "8024"
            mx_p2p_metadata: "0"
            # TODO: resolve this dynamically to the latest released
            # modelexpress-server tag instead of hardcoding, so the guard
            # tracks "newest client vs latest released server" without a
            # manual bump each release.
            server_image: nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.4.0
          # Redis backend variants of the full-manifest path: same
          # MX_P2P_METADATA=0 embedded-metadata publish, but with a Redis
          # metadata store instead of the default Kubernetes CRD backend. The
          # source-readiness gate queries mx-server's ListSources (backend-
          # agnostic), so it works even though Redis publishes no ModelMetadata
          # CRs.
          - framework: vllm
            label: vllm full-manifest redis same-version
            namespace: mx-ci-full-manifest-redis-same-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure.yaml
            test_script: ci/k8s/client/test_p2p_k8s.py
            source_extra_env: "JOB_NAME=mx-source"
            extra_env: "JOB_NAME=mx-target"
            source_port: "8025"
            worker_port: "8026"
            mx_p2p_metadata: "0"
            server_manifest: ci/k8s/server/mx-server-redis.yaml
          - framework: vllm
            label: vllm full-manifest redis mixed-version
            namespace: mx-ci-full-manifest-redis-mixed-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure.yaml
            test_script: ci/k8s/client/test_p2p_k8s.py
            source_extra_env: "JOB_NAME=mx-source"
            extra_env: "JOB_NAME=mx-target"
            source_port: "8027"
            worker_port: "8028"
            mx_p2p_metadata: "0"
            server_manifest: ci/k8s/server/mx-server-redis.yaml
            server_image: nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.4.0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run P2P RDMA transfer test
        uses: ./.github/actions/run-mx-p2p-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ matrix.namespace }}
          # Defaults to this commit's server; matrix.server_image overrides it
          # (e.g. the mixed-version embedded-metadata entry pins a released tag).
          server_image: ${{ matrix.server_image || format('{0}/mx-server:{1}', env.MX_IMAGE_REPO, github.sha) }}
          manifest: ${{ matrix.manifest }}
          test_script: ${{ matrix.test_script }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          server_manifest: ${{ matrix.server_manifest || 'ci/k8s/server/mx-server.yaml' }}
          mx_p2p_metadata: ${{ matrix.mx_p2p_metadata || '1' }}
          source_extra_env: ${{ matrix.source_extra_env }}
          extra_env: ${{ matrix.extra_env }}
          source_port: ${{ matrix.source_port }}
          worker_port: ${{ matrix.worker_port }}
          pytest_args: ${{ matrix.pytest_args }}
          expected_artifact_sources: ${{ matrix.expected_artifact_sources || '0' }}
          expected_artifact_source_types: ${{ matrix.expected_artifact_source_types || '' }}

      - name: Dump vCluster diagnostics on failure
        # Captures vCluster control-plane state at the moment of failure
        # (pod status, recent events, syncer logs, controller-identity
        # overlay) — surfaces infra-side disruption that may be the real
        # cause rather than the test itself.
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        # connect-vcluster backgrounds a `kubectl port-forward` and exports
        # VCLUSTER_PF_PID via $GITHUB_ENV. Kill it before the job ends so
        # the next job on this self-hosted runner doesn't inherit an orphan.
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Dedicated P2P MLA/MoE model test (vLLM + SGLang).
  # Runs on the full-GPU A100b pool with TP=2 and a DeepSeek MLA + MoE model,
  # plus the source/target VRAM parity assertions. The SGLang variant also gates
  # the derived w_kc/w_vc attention tensors (invisible to named_parameters()),
  # which must be captured + transferred or the target serves garbage
  # (TEST_PLAN row 10).
  #
  # Matrix over framework with max-parallel: 1 so the two variants run
  # back-to-back rather than concurrently — both need 4 full GPUs on the scarce
  # non-MIG pool, so serializing halves peak demand there. fail-fast: false keeps
  # their results independent: one framework failing does not skip the other.
  # ---------------------------------------------------------------------------
  test-p2p-mla-model:
    name: P2P MLA model test (${{ matrix.framework }} TP=2)
    runs-on: prod-modelexpress-builder-amd-v1
    # Full-GPU pool is required because VRAM sampling is blocked on MIG slices.
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - framework: vllm
            namespace: mx-ci-vllm-mla-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure-tp2.yaml
            source_port: "8001"
            worker_port: "8002"
          - framework: sglang
            namespace: mx-ci-sglang-mla-${{ github.run_id }}
            manifest: ci/k8s/client/sgl/manifest-azure-tp2.yaml
            source_port: "8009"
            worker_port: "8010"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run P2P MLA model test
        uses: ./.github/actions/run-mx-p2p-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ matrix.namespace }}
          server_image: ${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}
          manifest: ${{ matrix.manifest }}
          test_script: ci/k8s/client/test_p2p_k8s.py
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: deepseek-ai/DeepSeek-V2-Lite
          hf_token: ${{ secrets.HF_TOKEN }}
          source_extra_env: "JOB_NAME=mx-source"
          extra_env: "JOB_NAME=mx-target"
          source_port: ${{ matrix.source_port }}
          worker_port: ${{ matrix.worker_port }}
          tp_size: "2"
          pod_ready_timeout_seconds: "3600"
          measure_vram: "true"

      - name: Dump vCluster diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # P2P weight transfer with tensor parallelism > 1.
  #
  # Multi-node TP only: StatefulSet + Ray, 1 GPU per pod on the a100a pool,
  # so this job does NOT contend for the scarce full-GPU a100b pool. See the
  # manifest header for the cross-host pod-pairing rationale.
  #
  # Single-node TP=2 is intentionally NOT a separate entry here: the
  # `test-p2p-mla-model` job already exercises the single-node TP=2 path
  # (same manifest-azure-tp2.yaml + test_p2p_k8s.py on the a100b full-GPU
  # pool) and adds VRAM-parity assertions on top. Running both was redundant
  # and doubled the a100b demand, so the Qwen single-node TP=2 entry was
  # dropped in favor of the MLA one. See TEST_PLAN row 5.1.
  # ---------------------------------------------------------------------------
  test-tp:
    name: P2P TP test (${{ matrix.framework }} TP=${{ matrix.tp_size }} ${{ matrix.topology }})
    runs-on: prod-modelexpress-builder-amd-v1
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Multi-node TP=2 (vLLM). StatefulSet + Ray topology; see the
          # manifest header for the cross-host pod-pairing rationale.
          - framework: vllm
            tp_size: 2
            topology: multi-node
            namespace: mx-ci-vllm-multinode-tp2-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure-multi-node-tp2.yaml
            source_port: "8001"
            worker_port: "8002"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run P2P RDMA transfer test (TP > 1)
        uses: ./.github/actions/run-mx-p2p-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ matrix.namespace }}
          server_image: ${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}
          manifest: ${{ matrix.manifest }}
          test_script: ci/k8s/client/test_p2p_k8s.py
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          source_extra_env: "JOB_NAME=mx-source"
          extra_env: "JOB_NAME=mx-target"
          source_port: ${{ matrix.source_port }}
          worker_port: ${{ matrix.worker_port }}
          tp_size: ${{ matrix.tp_size }}

      - name: Dump vCluster diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        # connect-vcluster backgrounds a `kubectl port-forward` and exports
        # VCLUSTER_PF_PID via $GITHUB_ENV. Kill it before the job ends so
        # the next job on this self-hosted runner doesn't inherit an orphan.
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # P2P weight transfer with parallelism > 1 beyond plain TP — vLLM data
  # parallelism (DP=2) and expert parallelism (EP=2), single-node.
  #
  # DP (--data-parallel-size 2): N full interchangeable model copies, so the
  # ModelExpress identity carries no DP dimension and every DP core resolves to
  # worker_rank 0 (tp_size=1). The source publishes one rank-0 CR and the
  # target's DP cores each pull the full rank-0 weights over RDMA. dp_size=2
  # widens the per-rank agent assertion to [tp_size, tp_size*dp_size] = [1, 2]
  # (the two target cores may converge on one source or split across both). See
  # TEST_PLAN row 5.2.
  #
  # EP (--enable-expert-parallel over TP=2, MoE model): experts shard per rank,
  # so weights stay rank-distinct and transfers are rank-paired like TP
  # (tp_size=2). The new coverage is the identity hash carrying an
  # expert-parallel world size derived as tp * dp * pcp rather than read from a
  # ParallelConfig attribute that does not exist (TEST_PLAN row 5.3, MX-440) —
  # a source/target mismatch there forces a disk fallback and fails the RDMA
  # marker assertion.
  #
  # Both run single-node on the scarce full-GPU non-MIG pool (4 GPUs each), so
  # matrix max-parallel: 1 serializes them back-to-back to halve peak demand
  # there; fail-fast: false keeps their results independent (one failing does
  # not skip the other).
  # ---------------------------------------------------------------------------
  test-parallel:
    name: P2P ${{ matrix.label }} test (vllm)
    runs-on: prod-modelexpress-builder-amd-v1
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: DP=2
            namespace: mx-ci-vllm-dp2-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure-dp2.yaml
            tp_size: "1"
            dp_size: "2"
            source_port: "8001"
            worker_port: "8002"
          - label: EP=2
            namespace: mx-ci-vllm-ep2-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure-ep2.yaml
            model: deepseek-ai/DeepSeek-V2-Lite
            tp_size: "2"
            dp_size: "1"
            pod_ready_timeout_seconds: "3600"
            source_port: "8003"
            worker_port: "8004"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run P2P RDMA transfer test (${{ matrix.label }})
        uses: ./.github/actions/run-mx-p2p-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ matrix.namespace }}
          server_image: ${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}
          manifest: ${{ matrix.manifest }}
          test_script: ci/k8s/client/test_p2p_k8s.py
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-vllm:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          # DP uses the default dense CI model; EP overrides to an MoE model.
          model: ${{ matrix.model || env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          source_extra_env: "JOB_NAME=mx-source"
          extra_env: "JOB_NAME=mx-target"
          source_port: ${{ matrix.source_port }}
          worker_port: ${{ matrix.worker_port }}
          tp_size: ${{ matrix.tp_size }}
          dp_size: ${{ matrix.dp_size }}
          # EP's MoE model is larger; give it the same headroom as the MLA job.
          pod_ready_timeout_seconds: ${{ matrix.pod_ready_timeout_seconds || '900' }}

      - name: Dump vCluster diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        # connect-vcluster backgrounds a `kubectl port-forward` and exports
        # VCLUSTER_PF_PID via $GITHUB_ENV. Kill it before the job ends so
        # the next job on this self-hosted runner doesn't inherit an orphan.
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Dynamo aggregated-serving P2P test — DGD lifecycle (apply / scale / wait)
  # against the cluster-wide Dynamo operator installed in dynamo-system by
  # setup-mx-vcluster. Different shape than test-p2p (DGD CR + grove-managed
  # pods, not a raw Job), so it lives as its own top-level job rather than a
  # matrix entry of test-p2p.
  # ---------------------------------------------------------------------------
  test-with-dynamo:
    name: P2P test with Dynamo (${{ matrix.mode }})
    runs-on: prod-modelexpress-builder-amd-v1
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: aggregated
            manifest: ci/k8s/client/vllm/dynamo/manifest-azure-aggregated.yaml
            namespace: mx-ci-dynamo-agg-${{ github.run_id }}
            dgd_name: mx-dynamo-agg-${{ github.run_id }}
          - mode: disaggregated
            manifest: ci/k8s/client/vllm/dynamo/manifest-azure-disaggregated.yaml
            namespace: mx-ci-dynamo-disagg-${{ github.run_id }}
            dgd_name: mx-dynamo-disagg-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run Dynamo P2P test
        uses: ./.github/actions/run-mx-dynamo-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          # DGD name shared with the action input AND the manifest's envsubst
          # placeholder, so all three (kubectl patch/delete, manifest
          # metadata.name, derived service refs) stay in sync.
          namespace: ${{ matrix.namespace }}
          dgd_name: ${{ matrix.dgd_name }}
          manifest: ${{ matrix.manifest }}
          mode: ${{ matrix.mode }}
          server_image: ${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-dynamo-vllm:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}

      - name: Dump vCluster diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Fleet scale test (row 20) — ~15 workers, CRD backend, NIXL-over-TCP.
  # Raw Deployment (no Dynamo), no anti-affinity (pack a100a MIG slices),
  # NIXL_UCX_TLS=tcp (MIG slices GPU but not RDMA — one IB NIC per node).
  # Scales in waves (1→5→10→15) so CI failures localise to a wave.
  # ---------------------------------------------------------------------------
  test-fleet-scale:
    name: Fleet scale test (vLLM, 15 workers)
    runs-on: prod-modelexpress-builder-amd-v1
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run fleet scale test
        uses: ./.github/actions/run-mx-fleet-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: mx-ci-fleet-${{ github.run_id }}
          server_image: ${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-vllm:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          fleet_size: "15"
          wave_sizes: "5 10 15"

      - name: Dump vCluster diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Rolling-update test — five workers, CRD backend, NIXL-over-TCP.
  # Runs independently of the 15-worker fleet test for both vLLM and SGLang.
  # The Deployment rolls with maxUnavailable=1/maxSurge=0: one source
  # terminates while four stay alive.
  # ---------------------------------------------------------------------------
  test-rolling-update:
    name: Rolling-update test (${{ matrix.framework }}, 5 workers)
    runs-on: prod-modelexpress-builder-amd-v1
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: vllm
            namespace: mx-ci-rolling-vllm-${{ github.run_id }}
            manifest: ci/k8s/client/vllm/manifest-azure-rolling-update.yaml
          - framework: sglang
            namespace: mx-ci-rolling-sglang-${{ github.run_id }}
            manifest: ci/k8s/client/sgl/manifest-azure-rolling-update.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run rolling-update test
        uses: ./.github/actions/run-mx-fleet-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ matrix.namespace }}
          server_image: ${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          model: ${{ env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          manifest: ${{ matrix.manifest }}
          test_script: ci/k8s/client/test_rolling_update.py
          fleet_size: "5"
          wave_sizes: "5"
          rolling_update: "true"
          rollout_timeout_seconds: "600"

      - name: Dump vCluster diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Stale-metadata test (row 18) — single source pod, no target, mx-server
  # deployed with the Redis backend + compressed reaper knobs. After the
  # source publishes, we force-kill it and assert that the server stops
  # returning it as READY within ~60s. Matrix over framework so we catch
  # framework-specific publish-path regressions in the reaper flow.
  # ---------------------------------------------------------------------------
  test-stale-metadata:
    name: Stale metadata test (${{ matrix.framework }})
    runs-on: prod-modelexpress-builder-amd-v1
    needs: [build-client, build-server, ensure-vcluster]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: vllm
            manifest: ci/k8s/client/vllm/manifest-azure.yaml
            namespace: mx-ci-stale-vllm-${{ github.run_id }}
            source_port: "8011"
          - framework: sglang
            manifest: ci/k8s/client/sgl/manifest-azure.yaml
            namespace: mx-ci-stale-sgl-${{ github.run_id }}
            source_port: "8012"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connect to vCluster
        id: connect-vcluster
        uses: ./.github/actions/connect-vcluster
        with:
          host_kubeconfig_base64: ${{ secrets.AZURE_AKS_CI_KUBECONFIG_B64 }}
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Run stale-metadata test
        uses: ./.github/actions/run-mx-stale-metadata-test
        with:
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: ${{ matrix.namespace }}
          server_image: ${{ env.MX_IMAGE_REPO }}/mx-server:${{ github.sha }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          manifest: ${{ matrix.manifest }}
          model: ${{ env.MX_CI_MODEL }}
          hf_token: ${{ secrets.HF_TOKEN }}
          worker_registry: nvcr.io
          ngc_api_key: ${{ secrets.NGC_API_KEY }}
          source_port: ${{ matrix.source_port }}

      - name: Dump vCluster diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-vcluster-diagnostics
        with:
          vcluster_name: ${{ env.VCLUSTER_NAME }}
          vcluster_namespace: ${{ env.VCLUSTER_NAMESPACE }}

      - name: Reap vCluster port-forward
        if: always()
        run: |
          if [ -n "${VCLUSTER_PF_PID:-}" ]; then
            kill "${VCLUSTER_PF_PID}" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # Model Streamer S3 tests — single worker pod, no vCluster, no P2P.
  # Covers direct streaming and fallback to the default loader.
  # IRSA provides S3 access; first run uploads safetensors to the bucket.
  #
  # Matrix over inference engine frameworks. The composite action dispatches
  # the framework-specific loader command while keeping the S3 setup,
  # readiness, inference, and cleanup checks shared.
  # ---------------------------------------------------------------------------
  model-streamer:
    name: Model Streamer ${{ matrix.mode }} test (${{ matrix.framework }}, S3)
    runs-on: prod-modelexpress-tester-amd-gpu-v1
    needs: [build-client]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: vllm
            mode: direct
            test_model_streamer_fallback: 'false'
          - framework: vllm
            mode: fallback
            test_model_streamer_fallback: 'true'
          - framework: sglang
            mode: direct
            test_model_streamer_fallback: 'false'
          - framework: sglang
            mode: fallback
            test_model_streamer_fallback: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to image registry
        run: |
          echo "${{ secrets.NGC_API_KEY }}" | \
            docker login nvcr.io -u '$oauthtoken' --password-stdin

      - name: Run model streamer test
        uses: ./.github/actions/run-mx-streamer-test
        with:
          framework: ${{ matrix.framework }}
          worker_image: ${{ env.MX_IMAGE_REPO }}/mx-worker-${{ matrix.framework }}:${{ github.sha }}
          model: ${{ env.MX_CI_MODEL }}
          s3_bucket: ${{ env.MX_CI_S3_BUCKET }}
          s3_region: ${{ env.MX_CI_S3_REGION }}
          hf_token: ${{ secrets.HF_TOKEN }}
          test_model_streamer_fallback: ${{ matrix.test_model_streamer_fallback }}

  # ---------------------------------------------------------------------------
  # Umbrella status check for branch protection.
  #
  # Aggregates the result of every gating job in this workflow into a single
  # check that GitHub's branch-protection rule on `main` requires. The
  # indirection lets us add or remove gating jobs by editing only the `needs:`
  # list below — no need to update the branch-protection configuration in the
  # GitHub repo settings every time.
  #
  # `if: always()` is load-bearing: without it, a failed dependency would
  # mark this job as `skipped`, which GitHub branch protection treats as
  # `pending` indefinitely, blocking the PR forever. With `always()`, the
  # job runs and the bash check below decides pass/fail based on each
  # dependency's `.result`.
  #
  # `success` and `skipped` are both accepted as "passing":
  #   - `success` is the happy path
  #   - `skipped` accommodates conditional jobs (e.g., a job behind a
  #     changed-files filter that legitimately didn't need to run). None of
  #     our gating jobs are skippable today, but the allowance future-proofs
  #     the gate without forcing a reconfigure.
  # ---------------------------------------------------------------------------
  ci-status-check:
    name: CI status check
    runs-on: ubuntu-latest
    needs:
      - build-server
      - build-client
      - ensure-vcluster
      - test-p2p
      - test-p2p-mla-model
      - test-tp
      - test-parallel
      - test-with-dynamo
      - test-fleet-scale
      - test-rolling-update
      - test-stale-metadata
      - model-streamer
    if: always()
    steps:
      - name: All dependent jobs succeeded (or skipped)
        run: |
          echo '${{ toJson(needs) }}' \
            | jq -e 'to_entries | map(.value.result) | all(. as $r | ["success", "skipped"] | any($r == .))'
