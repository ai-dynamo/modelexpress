#
# Builds the modelexpress Python client wheels via docker/Dockerfile.client-wheel
# and uploads the resulting artifacts to NV Artifactory.
#
# Triggered on:
#   - push to pull-request/<pr_id> (mirrored from contributor PRs by
#     copy-pr-bot): lands under pr/<pr_id>/<sha>/<run_id>/<run_attempt>/<arch>/
#   - push to main and release/**: lands under
#     post-merge/<sha>/<run_id>/<run_attempt>/<arch>/
#
# copy-pr-bot mirrors PRs (including fork PRs) into the pull-request/<pr_id>
# branch namespace inside this repo, which lets the workflow access
# environment-scoped secrets that fork PRs can't reach directly.
#
# Runs in parallel to (does not gate on) the rest of CI. Upload is
# environment-gated on `automated-release`.

name: Build & upload client wheels

on:
  push:
    branches:
      - 'pull-request/*'
      - main
      - 'release/**'
  # Reused by nightly-ci.yml (with `secrets: inherit`): stamps a PEP440 dev
  # version into the package before building and lands the artifacts under
  # nightly/<run_id>/... instead of the pr/ / post-merge/ namespaces.
  workflow_call:
    inputs:
      wheel_version:
        description: >-
          Full PEP440 version to stamp into modelexpress_client/python/pyproject.toml
          before building (e.g. 0.5.0.dev20260805). Empty keeps the checked-in version.
        required: false
        type: string
        default: ''
      upload_prefix:
        description: >-
          Artifactory subpath overriding the pr/ / post-merge/ computation,
          used verbatim (e.g. nightly). Wheel filenames are arch-unique; the
          py3-none-any wheel and sdist are uploaded identically by both arch
          jobs and simply overwrite each other.
        required: false
        type: string
        default: ''
      upload_repo:
        description: >-
          Artifactory repository name overriding the ARTIFACTORY_PYPI_REPO_NAME
          secret (e.g. sw-dynamo-modelexpress-cargo-local).
        required: false
        type: string
        default: ''
      skip_upload:
        description: Build the wheels but skip the Artifactory upload (dry runs).
        required: false
        type: boolean
        default: false

concurrency:
  # PR-mirror pushes still collapse onto one group per PR branch, so a new push
  # cancels the previous build. Every other trigger — push to main/release and
  # any workflow_call caller — gets a run-unique group: a concurrency group
  # holds only ONE pending slot and cancels the previous occupant, so a shared
  # group would let a third run silently cancel a nightly's pending wheel build.
  # (github.run_id/run_attempt are the CALLER's under workflow_call.)
  group: >-
    ${{ startsWith(github.ref, 'refs/heads/pull-request/')
        && format('build-wheels-{0}', github.ref)
        || format('build-wheels-{0}-{1}-{2}', github.ref, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build & upload wheels (${{ matrix.arch }})
    environment: automated-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: prod-modelexpress-builder-amd-v1
            platform: linux/amd64
          - arch: arm64
            runner: prod-modelexpress-builder-arm-v1
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Compute artifactory subpath
        id: dest
        env:
          UPLOAD_PREFIX: ${{ inputs.upload_prefix }}
        run: |
          if [ -n "${UPLOAD_PREFIX}" ]; then
            SUBPATH="${UPLOAD_PREFIX}"
          else
            case "${GITHUB_REF_NAME}" in
              pull-request/*)
                PR_ID="${GITHUB_REF_NAME#pull-request/}"
                SUBPATH="pr/${PR_ID}/${{ github.sha }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.arch }}"
                ;;
              *)
                SUBPATH="post-merge/${{ github.sha }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.arch }}"
                ;;
            esac
          fi
          echo "subpath=${SUBPATH}" >> "$GITHUB_OUTPUT"
          echo "Destination subpath: ${SUBPATH}"

      - name: Apply wheel version override
        if: inputs.wheel_version != ''
        env:
          WHEEL_VERSION: ${{ inputs.wheel_version }}
        run: |
          # Stamp the dev version into the package before the docker build
          # copies the source tree, so the built wheels report it.
          sed -i "s/^version = \".*\"/version = \"${WHEEL_VERSION}\"/" \
            modelexpress_client/python/pyproject.toml
          grep '^version = ' modelexpress_client/python/pyproject.toml

      - name: Build wheels
        env:
          WHEEL_VERSION: ${{ inputs.wheel_version }}
        run: |
          mkdir -p dist
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f docker/Dockerfile.client-wheel \
            --target export \
            --output type=local,dest=./dist \
            .
          echo "Built artifacts:"
          ls -la dist/
          # An empty dist/ must never pass as success: the version guard below
          # is vacuously true on an empty listing, and the upload would then
          # publish nothing while the job stays green.
          WHEEL_COUNT=$(find dist/ -maxdepth 1 -name '*.whl' | wc -l)
          SDIST_COUNT=$(find dist/ -maxdepth 1 -name '*.tar.gz' | wc -l)
          echo "wheels=${WHEEL_COUNT} sdists=${SDIST_COUNT}"
          if [ "${WHEEL_COUNT}" -lt 1 ] || [ "${SDIST_COUNT}" -lt 1 ]; then
            echo "::error::expected at least one wheel and one sdist in dist/, got ${WHEEL_COUNT}/${SDIST_COUNT}"
            exit 1
          fi
          if [ -n "${WHEEL_VERSION}" ]; then
            # Guard against UTC-midnight drift between version computation and
            # build: every artifact must carry the stamped version.
            if ls dist/ | grep -v -- "-${WHEEL_VERSION}-\|^modelexpress-${WHEEL_VERSION}" | grep -q .; then
              echo "::error::Artifacts in dist/ do not all carry version ${WHEEL_VERSION}"
              ls dist/
              exit 1
            fi
          fi

      - name: Set up JFrog CLI
        # `inputs.skip_upload != true` is also true for plain push events,
        # where the inputs context is empty.
        if: inputs.skip_upload != true
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: ${{ secrets.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Upload to Artifactory
        if: inputs.skip_upload != true
        env:
          UPLOAD_REPO: ${{ inputs.upload_repo || secrets.ARTIFACTORY_PYPI_REPO_NAME }}
        run: |
          DEST="${UPLOAD_REPO}/${{ steps.dest.outputs.subpath }}/"
          echo "Uploading to: ${DEST}"
          jf rt upload --flat "dist/*.whl" "${DEST}"
          jf rt upload --flat "dist/*.tar.gz" "${DEST}"
